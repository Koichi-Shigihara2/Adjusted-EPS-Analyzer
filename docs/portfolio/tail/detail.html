<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TANUKI TAIL — 詳細</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:   #0a0d14;
      --sur:  #111520;
      --sur2: #161c2d;
      --bdr:  #1e2840;
      --acc:  #3b82f6;
      --grn:  #10b981;
      --red:  #f43f5e;
      --amb:  #f59e0b;
      --txt:  #e2e8f0;
      --sub:  #7a92b0;
      --mut:  #64748b;
      --core: #f0a500;
      --sat:  #4a9eff;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 14px; min-height: 100vh; line-height: 1.6; }

    header { border-bottom: 1px solid var(--bdr); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; gap: 12px; flex-wrap: wrap; }
    .logo { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .12em; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--txt); }
    .logo-dot { width: 8px; height: 8px; background: var(--core); border-radius: 50%; animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{box-shadow:0 0 0 0 rgba(240,165,0,.4)} 50%{box-shadow:0 0 0 6px rgba(240,165,0,0)} }
    .nav-links a, .site-nav a { font-family: var(--mono); font-size: 11px; color: var(--mut); text-decoration: none; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px solid transparent; transition: all .2s; }
    .nav-links a:hover, .site-nav a:hover { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-links a.active, .site-nav a.active { color: var(--core); border-bottom-color: var(--core); }
    .site-nav { display: flex; gap: 14px; flex-wrap: wrap; }
    .nav-sep { display: inline-block; width: 1px; height: 12px; background: var(--bdr); margin: auto 0; }

    /* Auth */
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .auth-box { text-align: center; padding: 48px 40px; background: var(--sur); border: 1px solid var(--bdr); border-radius: 12px; width: 340px; }
    .auth-title { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--core); letter-spacing: .1em; margin-bottom: 8px; }
    .auth-sub { font-family: var(--mono); font-size: 11px; color: var(--mut); margin-bottom: 28px; }
    .auth-row { display: flex; gap: 8px; justify-content: center; }
    .auth-input { font-family: var(--mono); font-size: 13px; padding: 10px 14px; background: var(--sur2); border: 1px solid var(--bdr); color: var(--txt); width: 190px; border-radius: 4px; outline: none; }
    .auth-input:focus { border-color: var(--acc); }
    .auth-btn { padding: 10px 18px; background: var(--core); color: #fff; border: none; cursor: pointer; font-family: var(--mono); font-size: 13px; border-radius: 4px; transition: opacity .2s; }
    .auth-btn:hover { opacity: .85; }
    #pw-error { color: var(--red); font-size: 11px; font-family: var(--mono); margin-top: 12px; min-height: 16px; }

    /* Thesis tab */
    .t-block { margin-bottom: 20px; }
    .t-label { font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .07em; margin-bottom: 6px; }
    .t-text { font-size: 13px; line-height: 1.8; color: var(--txt); white-space: pre-wrap; word-break: break-word; }
    .t-meta { display: flex; gap: 24px; font-family: var(--mono); font-size: 11px; color: var(--mut); margin-top: 4px; }

    /* Review tab */
    .rv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .rv-quarter { font-family: var(--mono); font-size: 16px; font-weight: 700; }
    .rv-date { font-family: var(--mono); font-size: 10px; color: var(--mut); }
    .gauge-wrap { margin-bottom: 14px; }
    .gauge-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .gauge-num { font-family: var(--mono); font-size: 22px; font-weight: 700; }
    .gauge-bar { height: 8px; background: var(--sur2); border-radius: 4px; overflow: hidden; }
    .gauge-fill { height: 100%; border-radius: 4px; }
    .rec-badge { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: .05em; }
    .rec-continue { background: rgba(16,185,129,.15); color: var(--grn); border: 1px solid rgba(16,185,129,.3); }
    .rec-watch    { background: rgba(245,158,11,.15);  color: var(--amb); border: 1px solid rgba(245,158,11,.3); }
    .rec-revise   { background: rgba(244,63,94,.12);   color: var(--red); border: 1px solid rgba(244,63,94,.25); }
    .rec-exit     { background: rgba(244,63,94,.22);   color: var(--red); border: 2px solid rgba(244,63,94,.5); }
    .rv-summary { font-size: 13px; line-height: 1.7; color: var(--txt); margin: 10px 0 14px; }
    .rv-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    @media (max-width: 540px) { .rv-lists { grid-template-columns: 1fr; } }
    .rv-list-box { background: var(--sur2); border-radius: 4px; padding: 12px; }
    .rv-list-title { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; margin-bottom: 8px; }
    .rv-list-title.pos { color: var(--grn); }
    .rv-list-title.neg { color: var(--amb); }
    .rv-list { list-style: none; }
    .rv-list li { font-size: 12px; line-height: 1.6; padding: 3px 0 3px 14px; position: relative; color: var(--sub); border-bottom: 1px solid rgba(30,40,64,.4); }
    .rv-list li:last-child { border-bottom: none; }
    .rv-list li::before { content: '›'; position: absolute; left: 0; }
    .rv-list.pos li::before { color: var(--grn); }
    .rv-list.neg li::before { color: var(--amb); }
    .bias-box { background: rgba(244,63,94,.07); border: 1px solid rgba(244,63,94,.3); border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; font-size: 12px; color: var(--red); line-height: 1.6; }
    .bias-box strong { display: block; font-family: var(--mono); font-size: 10px; margin-bottom: 4px; }
    .exit-box { background: var(--sur2); border-radius: 4px; padding: 12px; margin-bottom: 14px; }
    .exit-box-label { font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .07em; margin-bottom: 6px; }
    .exit-dist-badge { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 2px; margin-right: 6px; }
    .ed-far   { background: rgba(16,185,129,.12); color: var(--grn); border: 1px solid rgba(16,185,129,.25); }
    .ed-close { background: rgba(244,63,94,.12);  color: var(--red); border: 1px solid rgba(244,63,94,.25); }
    .ed-watch { background: rgba(245,158,11,.12); color: var(--amb); border: 1px solid rgba(245,158,11,.25); }
    .nkpi-title { font-family: var(--mono); font-size: 10px; color: var(--sub); letter-spacing: .07em; margin-bottom: 8px; }
    .nkpi-list { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin-bottom: 14px; }
    .nkpi-item { font-family: var(--mono); font-size: 10px; padding: 3px 9px; background: rgba(59,130,246,.1); color: var(--acc); border: 1px solid rgba(59,130,246,.25); border-radius: 2px; }
    .hist-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0; color: var(--mut); font-family: var(--mono); font-size: 11px; user-select: none; }
    .hist-toggle:hover { color: var(--sub); }
    .hist-body { display: none; }
    .hist-body.open { display: block; }
    .hist-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(30,40,64,.4); cursor: pointer; transition: color .12s; }
    .hist-item:hover { color: var(--acc); }
    .hist-item:last-child { border-bottom: none; }
    .hist-q { font-family: var(--mono); font-size: 12px; }
    .hist-sc { font-family: var(--mono); font-size: 11px; color: var(--mut); }
    .no-rv { font-family: var(--mono); font-size: 12px; color: var(--mut); text-align: center; padding: 40px; }
    .pred-section { margin-top: 14px; }
    .pred-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 0; color: var(--mut); font-family: var(--mono); font-size: 11px; user-select: none; }
    .pred-toggle:hover { color: var(--sub); }
    .pred-body { display: none; }
    .pred-body.open { display: block; }
    .pred-entry-header { font-family: var(--mono); font-size: 10px; color: var(--sub); margin: 12px 0 6px; letter-spacing: .04em; }
    .pred-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .pred-table th { text-align: left; padding: 4px 6px; font-family: var(--mono); font-size: 10px; color: var(--mut); border-bottom: 1px solid rgba(30,40,64,.5); }
    .pred-table td { padding: 5px 6px; border-bottom: 1px solid rgba(30,40,64,.25); vertical-align: middle; }
    .pred-table tbody tr:last-child td { border-bottom: none; }
    .pred-ok { color: var(--mut); }
    .pred-up { color: var(--grn); }
    .pred-dn { color: var(--red); }
    .pred-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: rgba(255,255,255,.08); }

    /* KPI tab */
    .kpi-card { background: var(--sur2); border-radius: 4px; padding: 14px; margin-bottom: 14px; }
    .kpi-card-name { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-bottom: 8px; }
    .tbl-wrap { overflow-x: auto; }

    /* DCF tab */
    .dcf-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
    .dcf-tbl th { background: var(--sur2); padding: 7px 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; border-bottom: 1px solid var(--bdr); text-align: center; }
    .dcf-tbl th:first-child { text-align: left; }
    .dcf-tbl td { padding: 6px 10px; border-bottom: 1px solid rgba(30,40,64,.4); }
    .dcf-tbl td:first-child { color: var(--sub); font-family: var(--mono); font-size: 11px; }
    .dcf-tbl td:not(:first-child) { text-align: center; font-family: var(--mono); }
    .dcf-bear { color: var(--red); }
    .dcf-base { color: var(--acc); }
    .dcf-bull { color: var(--grn); }
    .dcf-sec { background: var(--sur2); border-radius: 4px; padding: 12px; margin-bottom: 10px; }
    .dcf-sec-title { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; margin-bottom: 8px; }
    .dcf-sec-title.assum { color: var(--sub); }
    .dcf-sec-title.risk  { color: var(--red); }
    .dcf-ul { list-style: none; }
    .dcf-ul li { font-size: 12px; line-height: 1.6; padding: 3px 0 3px 14px; position: relative; color: var(--sub); }
    .dcf-ul li::before { content: '›'; position: absolute; left: 0; color: var(--mut); }
    .sat-note { text-align: center; color: var(--mut); font-family: var(--mono); font-size: 12px; padding: 32px; border: 1px dashed var(--bdr); border-radius: 4px; margin-top: 16px; }
    .tag { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 2px; }
    .tag.core { background: rgba(240,165,0,.1); color: var(--core); border: 1px solid rgba(240,165,0,.2); }
    .tag.sat  { background: rgba(74,158,255,.1); color: var(--sat);  border: 1px solid rgba(74,158,255,.2); }
    td.num { text-align: right; font-family: var(--mono); font-size: 12px; }
    .num { text-align: right; font-family: var(--mono); }

    /* Dashboard tab */
    .db-summary-bar { display:flex; gap:12px; align-items:center; padding:6px 0; border-bottom:1px solid var(--bdr); margin-bottom:8px; flex-wrap:wrap; }
    .db-summary-item { display:flex; flex-direction:column; align-items:center; }
    .db-summary-label { font-size:9px; color:var(--sub); text-transform:uppercase; font-family:var(--mono); letter-spacing:.05em; }
    .db-summary-value { font-size:14px; font-weight:700; }
    .db-two-col { display:grid; grid-template-columns:60% 40%; gap:8px; margin-bottom:8px; }
    .db-two-col-half { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
    .db-col { background:var(--sur2); border-radius:8px; padding:8px 10px; }
    .db-col-title { font-size:10px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; font-family:var(--mono); margin-bottom:4px; }
    .db-gauge-mini { height:6px; background:var(--bdr); border-radius:3px; margin:2px 0 4px; }
    .db-gauge-mini-fill { height:100%; border-radius:3px; }
    .db-kpi-mini-label { font-size:10px; color:var(--sub); display:flex; justify-content:space-between; margin-bottom:2px; }
    .db-list-item { font-size:11px; padding:1px 0; color:var(--txt); line-height:1.5; }
    .db-list-item::before { content:'› '; color:var(--sub); }
    .db-fold { border:1px solid var(--bdr); border-radius:8px; margin-bottom:4px; }
    .db-fold-head { padding:7px 12px; cursor:pointer; font-size:11px; color:var(--sub); display:flex; justify-content:space-between; align-items:center; user-select:none; }
    .db-fold-body { padding:0 12px 8px; display:none; }
    .db-fold.open .db-fold-body { display:block; }
    .db-fold.open .db-fold-head span:last-child { transform:rotate(90deg); display:inline-block; }
    @media (max-width:600px) { .db-two-col,.db-two-col-half { grid-template-columns:1fr; } }

    /* Detail-specific */
    .detail-wrap { max-width:1200px; margin:0 auto; padding:16px; }
    .detail-subheader { display:flex; justify-content:space-between; align-items:center; padding:10px 0 12px; border-bottom:1px solid var(--bdr); margin-bottom:0; }
    .detail-nav-btn { display:inline-block; font-family:var(--mono); font-size:11px; background:none; border:1px solid var(--bdr); color:var(--sub); padding:4px 12px; border-radius:4px; cursor:pointer; text-decoration:none; transition:all .15s; }
    .detail-nav-btn:hover { border-color:var(--core); color:var(--core); }
    .detail-tabs { display:flex; gap:0; border-bottom:1px solid var(--bdr); margin-bottom:16px; overflow-x:auto; }
    .detail-tab-btn { padding:8px 16px; font-size:11px; font-family:var(--mono); letter-spacing:.04em; color:var(--mut); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none; white-space:nowrap; transition:all .15s; }
    .detail-tab-btn:hover { color:var(--sub); }
    .detail-tab-btn.active { color:var(--core); border-bottom-color:var(--core); }
    .detail-body { min-height:600px; }
    .detail-subheader-bar { background:var(--sur); border-bottom:1px solid var(--bdr); position:sticky; top:0; z-index:90; }
  </style>
</head>
<body data-tool="tail">

<!-- Auth screen -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">TANUKI TAIL</div>
    <div class="auth-sub">DETAIL VIEW</div>
    <div class="auth-row">
      <input id="pw-input" type="password" class="auth-input" placeholder="Password">
      <button class="auth-btn" onclick="checkPassword()">→</button>
    </div>
    <div id="pw-error"></div>
  </div>
</div>

<!-- Main content -->
<div id="main-content" style="display:none">
  <script src="../../common/site-nav.js"></script>
  <script src="../../common/info-tooltip.js"></script>

  <!-- Subheader -->
  <div class="detail-subheader-bar">
    <div class="detail-wrap">
      <div class="detail-subheader">
        <a href="index.html" class="detail-nav-btn">← TAIL 一覧</a>
        <div id="detail-ticker-header" style="display:flex;align-items:center;gap:10px"></div>
        <div id="detail-nav" style="display:flex;align-items:center;gap:8px"></div>
      </div>
    </div>
  </div>

  <!-- Tabs + body -->
  <div class="detail-wrap">
    <div class="detail-tabs" id="detail-tabs"></div>
    <div class="detail-body" id="detail-body">
      <div style="text-align:center;color:var(--mut);padding:60px;font-family:var(--mono);font-size:12px">読込中...</div>
    </div>
  </div>
</div>

<script>
/* ─── Auth ─── */
var PW_HASH = "1ccaba2b5d2e782f70745dc02ee88f537d51f6938bd6c22982a3d4d685be483a";
var SESSION_KEY = "tail_auth";

async function sha256(text) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}
async function checkPassword() {
  var pw = document.getElementById('pw-input').value;
  var hash = await sha256(pw);
  if (hash === PW_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  var pwInput = document.getElementById('pw-input');
  if (pwInput) pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPassword(); });
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    initApp();
  }
});

/* ─── State ─── */
var currentTicker = new URLSearchParams(location.search).get('ticker') || '';
var currentTabIdx = 0;
/* Keep these names so copied functions work unchanged */
var modalTicker = currentTicker;
var modalTabIdx = 0;

var loadedPositions  = {};
var positionsIndex   = [];
var loadedReviews    = {};
var reviewQByTicker  = {};
var kpiCache         = {};
var portfolioAvgCost = {};
var latestValCache   = {};
var loadedProposals  = {};
var loadedScenarios  = {};
var predictionHistory = {};
var journalData      = [];
var loadedCtrl       = {};
var ctrlIndex        = {};

/* ─── Init ─── */
function initApp() {
  if (!currentTicker) {
    document.getElementById('detail-body').innerHTML = '<div class="no-rv">URLパラメータ ticker が必要です（例: detail.html?ticker=PLTR）</div>';
    document.getElementById('detail-ticker-header').innerHTML = '<span style="font-family:var(--mono);color:var(--red)">ticker 未指定</span>';
    return;
  }
  document.title = 'TANUKI TAIL — ' + currentTicker;
  loadAll();
}

/* ─── Data loading ─── */
function loadAll() {
  var ticker = currentTicker;

  var posP = fetch('data/positions_index.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : { positions: [] }; })
    .catch(function () { return { positions: [] }; })
    .then(function (idx) {
      positionsIndex = idx.positions || [];
      return Promise.all(positionsIndex.map(function (fname) {
        return fetch('data/positions/' + fname + '?_=' + Date.now())
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      }));
    })
    .then(function (items) {
      items.forEach(function (p) { if (p && p.ticker) loadedPositions[p.ticker] = p; });
    });

  Promise.all([posP, loadReviewQueue(), loadPortfolio(), loadPredictionHistory()]).then(function () {
    loadValuations([ticker]).then(function () {
      renderDetailHeader();
      renderDetailTabs();
      renderDetailBody(ticker, 0);

      /* Async: KPI */
      fetch('data/kpi/' + ticker + '_layer2.json?_=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (d) {
          if (!d) return;
          kpiCache[ticker] = d;
          if (currentTabIdx === 3) renderDetailBody(ticker, 3);
          if (currentTabIdx === 0) { var el = document.getElementById('db-kpi-zone'); if (el) el.innerHTML = _buildDashboardKpi(ticker); }
        });

      /* Async: scenarios */
      ensureScenariosLoaded(ticker).then(function () {
        if (currentTabIdx === 4) renderDetailBody(ticker, 4);
        if (currentTabIdx === 0) { var el = document.getElementById('db-dcf-zone'); if (el) el.innerHTML = _buildDashboardDcf(ticker); }
      });

      /* Async: ctrl */
      fetch('data/ctrl/' + ticker + '/index.json?_=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (idx) {
          ctrlIndex[ticker] = idx || null;
          var q = (idx && idx.quarters && idx.quarters.length > 0) ? idx.quarters[0] : null;
          var url = q
            ? 'data/ctrl/' + ticker + '/' + q + '.json?_=' + Date.now()
            : 'data/ctrl/' + ticker + '/latest.json?_=' + Date.now();
          return fetch(url).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
        })
        .then(function (d) {
          loadedCtrl[ticker] = d || null;
          if (currentTabIdx === 6) renderDetailBody(ticker, 6);
          if (currentTabIdx === 0) { var el = document.getElementById('db-ctrl-zone'); if (el) el.innerHTML = _buildDashboardCtrl(ticker); }
        });
    });
  });
}

function loadPredictionHistory() {
  return fetch('data/prediction_history.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(function (data) { Object.assign(predictionHistory, data); });
}

function loadReviewQueue() {
  return fetch('data/review_queue.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : { queue: [] }; })
    .catch(function () { return { queue: [] }; })
    .then(function (data) {
      var completed = (data.queue || []).filter(function (e) { return e.status === 'completed'; });
      completed.forEach(function (e) {
        if (!reviewQByTicker[e.ticker]) reviewQByTicker[e.ticker] = [];
        reviewQByTicker[e.ticker].push(e);
      });
      Object.keys(reviewQByTicker).forEach(function (t) {
        reviewQByTicker[t].sort(function (a, b) { return b.quarter.localeCompare(a.quarter); });
      });
      return Promise.all(completed.map(function (e) {
        var path = 'data/reviews/' + e.ticker + '_' + e.quarter + '_review.json?_=' + Date.now();
        return fetch(path)
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (rv) {
            if (rv) {
              if (!loadedReviews[e.ticker]) loadedReviews[e.ticker] = {};
              loadedReviews[e.ticker][e.quarter] = rv;
            }
          });
      }));
    });
}

function loadPortfolio() {
  return fetch('../data/portfolio.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (data) {
      if (!data) return;
      var totals = {};
      Object.values(data.brokers || {}).forEach(function (broker) {
        Object.entries(broker.positions || {}).forEach(function (kv) {
          var ticker = kv[0], pos = kv[1];
          if (!totals[ticker]) totals[ticker] = { cost: 0, shares: 0 };
          totals[ticker].cost   += (pos.avg_cost || 0) * (pos.shares || 0);
          totals[ticker].shares += (pos.shares || 0);
        });
      });
      Object.keys(totals).forEach(function (t) {
        if (totals[t].shares > 0)
          portfolioAvgCost[t] = Math.round(totals[t].cost / totals[t].shares * 100) / 100;
      });
    });
}

function loadValuations(tickers) {
  return Promise.all(tickers.map(function (ticker) {
    var path = '../../value-monitor/tanuki_valuation/data/' + ticker + '/latest.json?_=' + Date.now();
    return fetch(path)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (d) {
        if (!d) return;
        var comp = d.components || {};
        latestValCache[ticker] = {
          current_price:   comp.current_price          || null,
          intrinsic_value: d.intrinsic_value_per_share || null,
          upside_percent:  d.upside_percent            || null,
          tanuki_score:    d.tanuki_score              || null,
        };
      });
  }));
}

function ensureScenariosLoaded(ticker) {
  if (loadedScenarios[ticker]) return Promise.resolve();
  loadedScenarios[ticker] = {};
  return Promise.all(['bear', 'base', 'bull'].map(function (sc) {
    var path = '../scenario/' + ticker + '/' + sc + '.json?_=' + Date.now();
    return fetch(path)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (d) { if (d) loadedScenarios[ticker][sc] = d; });
  }));
}

function getDisplayPrice(ticker, thesisPrice) {
  if (thesisPrice != null) return '$' + Number(thesisPrice).toFixed(2);
  var avg = portfolioAvgCost[ticker];
  if (avg != null) return '<span title="portfolio.json 加重平均取得単価">$' + avg.toFixed(2) + '</span>';
  return '—';
}

/* ─── Detail page rendering ─── */
function renderDetailHeader() {
  var ticker = currentTicker;
  var p = loadedPositions[ticker];
  var isCore = p && p.type === 'core';
  var color  = isCore ? 'var(--core)' : 'var(--sat)';
  document.getElementById('detail-ticker-header').innerHTML =
    '<span style="font-family:var(--mono);font-size:22px;font-weight:700;color:' + color + '">' + esc(ticker) + '</span>' +
    '<span class="tag ' + (isCore ? 'core' : 'sat') + '">' + (isCore ? 'CORE' : 'SATELLITE') + '</span>' +
    (p && p.strategy_name ? '<span style="font-size:12px;color:var(--sub)">' + esc(p.strategy_name) + '</span>' : '');

  /* Navigation: CORE first → SAT, alphabetical within each */
  var actives = Object.values(loadedPositions).filter(function (x) { return x.status !== 'archived'; });
  actives.sort(function (a, b) {
    if (a.type !== b.type) return a.type === 'core' ? -1 : 1;
    return (a.ticker || '').localeCompare(b.ticker || '');
  });
  var idx  = actives.findIndex(function (x) { return x.ticker === ticker; });
  var prev = idx > 0 ? actives[idx - 1] : null;
  var next = (idx >= 0 && idx < actives.length - 1) ? actives[idx + 1] : null;
  document.getElementById('detail-nav').innerHTML =
    (prev ? '<a href="detail.html?ticker=' + prev.ticker + '" class="detail-nav-btn">← ' + prev.ticker + '</a>' : '<span style="font-size:12px;color:var(--mut)">—</span>') +
    (next ? '<a href="detail.html?ticker=' + next.ticker + '" class="detail-nav-btn">' + next.ticker + ' →</a>' : '<span style="font-size:12px;color:var(--mut)">—</span>');
}

function renderDetailTabs() {
  var tabs = ['ダッシュボード', 'テーゼ', '最新レビュー', 'KPIトレンド', 'DCFシナリオ', 'AI視点', '内部統制'];
  document.getElementById('detail-tabs').innerHTML = tabs.map(function (t, i) {
    return '<button class="detail-tab-btn' + (i === 0 ? ' active' : '') + '" onclick="switchDetailTab(' + i + ')">' + t + '</button>';
  }).join('');
}

function switchDetailTab(n) {
  currentTabIdx = n;
  modalTabIdx   = n;
  document.querySelectorAll('.detail-tab-btn').forEach(function (b, i) {
    b.classList.toggle('active', i === n);
  });
  renderDetailBody(currentTicker, n);
}

function renderDetailBody(ticker, n) {
  var p    = loadedPositions[ticker];
  var body = document.getElementById('detail-body');
  if      (n === 0) body.innerHTML = buildDashboard(ticker);
  else if (n === 1) body.innerHTML = p && p.type !== 'core' ? buildTabSat(p) : buildTabThesis(p);
  else if (n === 2) body.innerHTML = buildTabReview(ticker, null);
  else if (n === 3) body.innerHTML = buildTabKpi(ticker);
  else if (n === 4) body.innerHTML = buildTabDcf(ticker);
  else if (n === 5) body.innerHTML = buildTabCall2(ticker);
  else if (n === 6) body.innerHTML = buildTabCtrl(ticker);
}

/* Alias so copied functions that call renderModalBody() still work */
function renderModalBody(ticker, n) { renderDetailBody(ticker, n); }

/* ─── Tab 0: ダッシュボード ─── */
function _buildDashboardKpi(ticker) {
  var kd = kpiCache[ticker];
  if (!kd) return '<div style="color:var(--mut);font-size:12px">KPIデータ読込中...</div>';
  var kpis = kd.kpis || {};
  var names = Object.keys(kpis).filter(function (kname) {
    return (kpis[kname].data || []).some(function (d) { return d.value !== null && d.value !== undefined; });
  });
  if (!names.length) return '<div style="color:var(--mut);font-size:12px">KPIデータなし</div>';
  return names.slice(0, 3).map(function (kname) {
    var kinfo = kpis[kname];
    var validValues = (kinfo.data || []).filter(function (d) { return d.value !== null && d.value !== undefined; });
    if (!validValues.length) return '';
    var rawD = validValues.sort(function (a, b) { return a.quarter.localeCompare(b.quarter); });
    var last = rawD[rawD.length - 1];
    var prev = rawD.length > 1 ? rawD[rawD.length - 2] : null;
    var diff = (prev && prev.value !== 0) ? ((last.value - prev.value) / Math.abs(prev.value) * 100) : null;
    var diffStr = diff !== null ? (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%' : '';
    var diffCol = diff !== null ? (diff >= 0 ? 'var(--grn)' : 'var(--red)') : 'var(--mut)';
    return '<div style="margin-bottom:6px">' +
      '<div class="db-kpi-mini-label"><span>' + esc(kname) + '</span><span style="color:' + diffCol + '">' + diffStr + '</span></div>' +
      '<div style="font-size:13px;font-weight:700;font-family:var(--mono)">' + last.value + '</div>' +
      '</div>';
  }).join('');
}

function _buildDashboardDcf(ticker) {
  var scd = loadedScenarios[ticker];
  if (!scd || (!scd.bear && !scd.base && !scd.bull)) {
    return '<div style="color:var(--mut);font-size:12px">DCFデータ読込中...</div>';
  }
  var curPr = (scd.base || scd.bear || scd.bull || {}).current_price;
  var periods = [['1年後', '1Y'], ['3年後', '3Y'], ['5年後', '5Y']];
  var rows = [
    { key: 'bear', cls: 'dcf-bear', em: '🐻' },
    { key: 'base', cls: 'dcf-base', em: '📊' },
    { key: 'bull', cls: 'dcf-bull', em: '🐂' },
  ];
  var trs = rows.map(function (r) {
    var sd = scd[r.key];
    var fv = sd ? (sd.future_values || {}) : {};
    return '<tr>' +
      '<td style="font-family:var(--mono);font-size:10px" class="' + r.cls + '">' + r.em + ' ' + r.key.toUpperCase() + '</td>' +
      periods.map(function (p) {
        var v = fv[p[0]];
        var over = (v != null && curPr != null && Number(v) >= Number(curPr));
        return '<td style="text-align:center;font-family:var(--mono);font-size:10px' + (over ? ';color:var(--grn);font-weight:700' : '') + '">' +
          (v != null ? '$' + Number(v).toFixed(0) : '—') + '</td>';
      }).join('') + '</tr>';
  }).join('');
  var cpRow = curPr ? '<tr style="border-top:1px solid var(--bdr)"><td style="font-size:10px;color:var(--amb);font-family:var(--mono)">現在株価</td><td colspan="3" style="text-align:center;font-size:10px;font-family:var(--mono);color:var(--amb)">$' + Number(curPr).toFixed(0) + '</td></tr>' : '';
  return '<table style="width:100%;border-collapse:collapse;font-size:11px">' +
    '<thead><tr><th style="text-align:left;font-size:9px;color:var(--sub);padding:2px 4px"></th>' +
    periods.map(function (p) { return '<th style="text-align:center;font-size:9px;color:var(--sub);padding:2px 4px">' + p[1] + '</th>'; }).join('') +
    '</tr></thead><tbody>' + trs + cpRow + '</tbody></table>';
}

function _buildDashboardCtrl(ticker) {
  var cd = loadedCtrl[ticker];
  if (cd === undefined) return '<div style="color:var(--mut);font-size:12px">読込中...</div>';
  if (!cd) return '<div style="color:var(--mut);font-size:12px">CTRLデータなし</div>';
  var effLabel, effColor;

  else if (cd.effective === false) { effLabel = 'NOT EFFECTIVE'; effColor = 'var(--red)'; }
  else                              { effLabel = 'UNKNOWN';       effColor = 'var(--mut)'; }
  var jaText = (cd.item4_excerpt_ja || '').slice(0, 200);
  return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
    '<span style="font-size:12px;font-weight:700;color:' + effColor + ';border:1px solid ' + effColor + ';padding:2px 8px;border-radius:3px">' + esc(effLabel) + '</span>' +
    '<span style="font-size:11px;color:var(--mut)">' + esc(cd.quarter || '') + ' / ' + esc(cd.filing_date || '') + '</span>' +
    '</div>' +
    (jaText ? '<div style="font-size:12px;color:var(--sub);line-height:1.6;white-space:pre-wrap">' + esc(jaText) + (cd.item4_excerpt_ja && cd.item4_excerpt_ja.length > 200 ? '…' : '') + '</div>' +
      '<div style="font-size:11px;color:var(--acc);margin-top:6px;cursor:pointer" onclick="switchDetailTab(6)">続きを読む → 内部統制タブへ</div>' : '');
}

function _dbFold(title, content) {
  return '<div class="db-fold">' +
    '<div class="db-fold-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
    '<span>' + esc(title) + '</span><span>▶</span></div>' +

    '</div>';
}

function buildDashboard(ticker) {
  var p = loadedPositions[ticker];
  if (!p) return '<div class="no-rv">ポジションデータなし</div>';
  var isSat = p.type !== 'core';

  var val      = latestValCache[ticker];
  var dev      = (val && val.upside_percent != null) ? Number(val.upside_percent) : null;
  var iv       = (val && val.intrinsic_value != null) ? Number(val.intrinsic_value) : null;
  var cp       = (val && val.current_price   != null) ? Number(val.current_price)   : null;
  var reviews  = loadedReviews[ticker];
  var qs       = reviews ? Object.keys(reviews).sort().reverse() : [];
  var latestQ  = qs.length ? qs[0] : null;
  var s1       = (latestQ && reviews[latestQ]) ? (reviews[latestQ].stage1 || {}) : null;
  var score    = s1 ? (s1.health_score || 0) : null;
  var rec      = s1 ? (s1.recommendation || '') : '';
  var gc       = score != null ? (score >= 71 ? 'var(--grn)' : score >= 41 ? 'var(--amb)' : 'var(--red)') : 'var(--mut)';
  var recCls   = rec ? 'rec-' + rec.toLowerCase() : '';

  var devHtml  = dev != null ? '<span style="color:' + (dev >= 0 ? 'var(--grn)' : 'var(--red)') + '">' + (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%</span>' : '<span style="color:var(--mut)">—</span>';
  var ivHtml   = iv  != null ? '<span>$' + iv.toFixed(2) + '</span>' : '<span style="color:var(--mut)">—</span>';
  var cpHtml   = cp  != null ? '<span>$' + cp.toFixed(2) + '</span>' : '<span style="color:var(--mut)">—</span>';
  var scoreHtml = score != null
    ? '<div style="display:flex;align-items:center;gap:6px"><span style="font-size:18px;font-weight:700;color:' + gc + '">' + score + '</span>' +
      (rec ? '<span class="rec-badge ' + recCls + '" style="font-size:10px">' + esc(rec) + '</span>' : '') + '</div>'
    : '<span style="color:var(--mut)">—</span>';

  var summaryBar =
    '<div class="db-summary-bar">' +
    '<div class="db-summary-item"><div class="db-summary-label">乖離率</div><div class="db-summary-value">' + devHtml + '</div></div>' +
    '<div class="db-summary-item"><div class="db-summary-label">理論株価 IV</div><div class="db-summary-value">' + ivHtml + '</div></div>' +
    '<div class="db-summary-item"><div class="db-summary-label">現在株価</div><div class="db-summary-value">' + cpHtml + '</div></div>' +
    '<div class="db-summary-item"><div class="db-summary-label">直近スコア</div><div class="db-summary-value">' + scoreHtml + '</div></div>' +
    '</div>';

  var thesisText  = p.thesis || p.strategy_name || '';
  var accentColor = isSat ? 'var(--sat)' : 'var(--core)';
  var zoneB = thesisText
    ? '<div style="background:var(--sur2);border-radius:8px;padding:8px 10px;margin-bottom:8px;border-left:3px solid ' + accentColor + '">' +
      '<div class="db-col-title">投資テーゼ</div>' +
      '<div style="font-size:12px;color:var(--txt);line-height:1.6">' + esc(thesisText.slice(0, 100)) + (thesisText.length > 100 ? '…' : '') + '</div>' +
      '</div>'
    : '';

  var reviewRightHtml = '';
  if (!reviews) {
    reviewRightHtml = '<div style="color:var(--mut);font-size:12px">レビューデータ読込中...</div>';
  } else if (!qs.length || !s1) {
    reviewRightHtml = '<div style="color:var(--mut);font-size:12px">レビューデータなし</div>';
  } else {
    var hist = qs.slice().reverse().map(function (q) {
      var r = reviews[q] && reviews[q].stage1;
      return { q: q, v: r ? (r.health_score || 0) : null };
    }).filter(function (d) { return d.v != null; });
    var sparkHtml = '';
    if (hist.length >= 2) {
      var WS = 220, HS = 70, PLS = 14, PRS = 6, PTS = 4, PBS = 18;
      var cWS = WS - PLS - PRS, cHS = HS - PTS - PBS, nS = hist.length;
      var minS = Math.min.apply(null, hist.map(function (d) { return d.v; }));
      var maxS = Math.max.apply(null, hist.map(function (d) { return d.v; }));
      var rngS = maxS === minS ? 1 : maxS - minS;
      function xS(i) { return PLS + (nS > 1 ? (i / (nS - 1)) * cWS : cWS / 2); }
      function yS(v) { return PTS + cHS - ((v - minS) / rngS) * cHS; }
      var ptsS  = hist.map(function (d, i) { return xS(i).toFixed(1) + ',' + yS(d.v).toFixed(1); });
      var dotsS = hist.map(function (d, i) {
        var isLast = i === nS - 1;
        var dc = d.v >= 71 ? '#10b981' : d.v >= 41 ? '#f59e0b' : '#f43f5e';
        return '<circle cx="' + xS(i).toFixed(1) + '" cy="' + yS(d.v).toFixed(1) + '" r="' + (isLast ? 3.5 : 2) + '" fill="' + dc + '" stroke="var(--sur2)" stroke-width="1"><title>' + d.q + ': ' + d.v + '</title></circle>';
      }).join('');
      var showSetS = (nS > 5)
        ? { 0: true, [Math.floor((nS - 1) / 2)]: true, [nS - 1]: true }
        : (function () { var s = {}; for (var i = 0; i < nS; i++) s[i] = true; return s; }());
      var xlblsS = hist.map(function (d, i) {
        if (!showSetS[i]) return '';
        return '<text x="' + xS(i).toFixed(1) + '" y="' + (HS - 4) + '" text-anchor="middle" font-size="8" fill="var(--mut)">' + d.q + '</text>';
      }).join('');
      sparkHtml = '<div style="margin-bottom:5px"><div class="db-col-title">スコア推移</div>' +
        '<svg viewBox="0 0 ' + WS + ' ' + HS + '" style="width:100%;display:block">' +
        '<polyline points="' + ptsS.join(' ') + '" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-linejoin="round"/>' +
        dotsS + xlblsS + '</svg></div>';
    }
    var posItems = (s1.positives || []).slice(0, 2);
    var conItems = (s1.concerns  || []).slice(0, 2);
    var posMore  = (s1.positives || []).length - posItems.length;
    var conMore  = (s1.concerns  || []).length - conItems.length;
    var posHtml2 = posItems.map(function (t) { return '<div class="db-list-item" style="color:var(--grn)">' + esc(t) + '</div>'; }).join('') + (posMore > 0 ? '<div style="font-size:11px;color:var(--mut)">他' + posMore + '件</div>' : '');
    var conHtml2 = conItems.map(function (t) { return '<div class="db-list-item" style="color:var(--red)">' + esc(t) + '</div>'; }).join('') + (conMore > 0 ? '<div style="font-size:11px;color:var(--mut)">他' + conMore + '件</div>' : '');
    var nkItems  = (s1.next_kpis || []).slice(0, 2);
    var nkHtml2  = nkItems.map(function (k) { return '<span style="font-size:10px;background:var(--sur);border:1px solid var(--bdr);border-radius:3px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;display:inline-block">' + esc(k) + '</span>'; }).join('');
    var biasSmHtml = s1.optimism_bias_warning ? '<div style="font-size:11px;color:var(--amb);background:rgba(245,158,11,.1);border-radius:4px;padding:2px 6px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">⚠ ' + esc(s1.optimism_bias_warning.slice(0, 60)) + (s1.optimism_bias_warning.length > 60 ? '…' : '') + '</div>' : '';
    reviewRightHtml = sparkHtml +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
      '<div class="db-gauge-mini" style="flex:1"><div class="db-gauge-mini-fill" style="width:' + score + '%;background:' + gc + '"></div></div>' +
      '<span class="rec-badge ' + recCls + '" style="font-size:10px">' + esc(rec) + '</span></div>' +
      '<div style="font-size:12px;color:var(--txt);line-height:1.5;max-height:3em;overflow:hidden;margin-bottom:4px">' + esc(s1.summary || '') + '</div>' +
      biasSmHtml +
      (posHtml2 ? '<div style="margin-bottom:3px"><div style="font-size:10px;color:var(--sub);margin-bottom:1px">ポジティブ</div>' + posHtml2 + '</div>' : '') +
      (conHtml2 ? '<div style="margin-bottom:3px"><div style="font-size:10px;color:var(--sub);margin-bottom:1px">懸念点</div>' + conHtml2 + '</div>' : '') +
      (nkHtml2 ? '<div style="margin-top:4px"><div style="font-size:10px;color:var(--sub);margin-bottom:2px">確認KPI</div><div style="display:flex;flex-wrap:wrap;gap:4px">' + nkHtml2 + '</div></div>' : '');
  }

  var zoneC =
    '<div class="db-two-col-half">' +
    '<div class="db-col"><div class="db-col-title">KPIトレンド</div><div id="db-kpi-zone">' + _buildDashboardKpi(ticker) + '</div></div>' +
    '<div class="db-col">' + reviewRightHtml + '</div>' +
    '</div>';

  var exitDist   = s1 ? (s1.exit_distance || '') : '';
  var exitReason = s1 ? (s1.exit_distance_reason || '') : '';
  var edCls2 = exitDist.includes('遠') ? 'ed-far' : exitDist.includes('近い') ? 'ed-close' : 'ed-watch';
  var devContextHtml =
    '<div class="db-col-title">乖離率</div>' +
    '<div style="font-size:26px;font-weight:700;font-family:var(--mono);color:' + (dev != null ? (dev >= 0 ? 'var(--grn)' : 'var(--red)') : 'var(--mut)') + ';margin-bottom:6px">' +
    (dev != null ? (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%' : '—') + '</div>' +
    (exitDist ? '<span class="exit-dist-badge ' + edCls2 + '" style="font-size:11px">' + esc(exitDist) + '</span>' +
      (exitReason ? '<div style="font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5">' + esc(exitReason) + '</div>' : '') : '');

  var zoneD =
    '<div style="display:grid;grid-template-columns:40% 60%;gap:8px;margin-bottom:8px">' +
    '<div class="db-col">' + devContextHtml + '</div>' +
    '<div class="db-col"><div class="db-col-title">DCFシナリオ</div><div id="db-dcf-zone">' + _buildDashboardDcf(ticker) + '</div></div>' +
    '</div>';

  var c2Html = '';
  if (!reviews) {
    c2Html = '<div style="color:var(--mut);font-size:12px">データ読込中...</div>';
  } else if (latestQ && reviews[latestQ] && reviews[latestQ].call2) {
    var c2 = reviews[latestQ].call2;
    var fp = c2.five_perspectives || {};
    var fpLbls = [
      { key: 'competitive_advantage', label: '競争優位' },
      { key: 'growth',                label: '成長性' },
      { key: 'market',                label: '市場環境' },
      { key: 'management',            label: '経営' },
      { key: 'business_model',        label: 'ビジネスモデル' },
    ];
    c2Html = fpLbls.map(function (item) {
      var txt = fp[item.key];
      if (!txt) return '';
      return '<div style="margin-bottom:8px"><div style="font-size:10px;color:var(--sub);margin-bottom:2px">' + esc(item.label) + '</div>' +
        '<div style="font-size:12px;color:var(--txt);line-height:1.5">' + esc(txt) + '</div></div>';
    }).join('');
    if (c2.thesis_questions && c2.thesis_questions.length) {
      c2Html += '<div style="margin-top:10px"><div style="font-size:10px;color:var(--sub);margin-bottom:4px">テーゼへの問いかけ</div>' +
        c2.thesis_questions.map(function (q) { return '<div class="db-list-item" style="color:var(--amb)">' + esc(q) + '</div>'; }).join('') + '</div>';
    }
  } else {
    c2Html = '<div style="color:var(--mut);font-size:12px">AI定性分析データなし</div>';
  }
  var zoneE = _dbFold('AI視点', c2Html);

  var exitCondText = isSat ? (p.exit_condition || '') : (p.exit_guide || '');
  var ctrlFoldHtml = '<div id="db-ctrl-zone">' + _buildDashboardCtrl(ticker) + '</div>' +
    (exitCondText
      ? '<div style="margin-top:10px"><div style="font-size:10px;color:var(--sub);margin-bottom:4px">EXIT条件</div>' +
        '<div style="font-size:12px;color:var(--txt);line-height:1.6;white-space:pre-wrap">' + esc(exitCondText.slice(0, 200)) + (exitCondText.length > 200 ? '…' : '') + '</div></div>'
      : '');
  var zoneF = _dbFold('内部統制・EXIT', ctrlFoldHtml);

  return summaryBar + zoneB + zoneC + zoneD + zoneE + zoneF;
}

/* ─── Tab 2: 最新レビュー ─── */
function buildTabReview(ticker, targetQ) {
  var reviews = loadedReviews[ticker];
  if (!reviews) return '<div class="no-rv">まだ四半期レビューがありません。<br>決算提出後に自動生成されます。</div>';
  var qs = Object.keys(reviews).sort().reverse();
  if (!qs.length) return '<div class="no-rv">レビューデータなし</div>';
  var q  = targetQ || qs[0];
  var rv = reviews[q];
  if (!rv) return '<div class="no-rv">指定された四半期のレビューが見つかりません。</div>';
  var s1      = rv.stage1 || {};
  var score   = s1.health_score || 0;
  var rec     = s1.recommendation || 'WATCH';
  var gc      = score >= 71 ? 'var(--grn)' : score >= 41 ? 'var(--amb)' : 'var(--red)';
  var recCls  = 'rec-' + rec.toLowerCase();
  var genDate = rv.generated_at ? rv.generated_at.slice(0, 10) : '—';
  var posHtml = (s1.positives || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
  var conHtml = (s1.concerns  || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
  var biasHtml = s1.optimism_bias_warning ? '<div class="bias-box"><strong>⚠ 楽観バイアス警告</strong>' + esc(s1.optimism_bias_warning) + '</div>' : '';
  var ed    = s1.exit_distance || '—';
  var edCls = ed.includes('遠') ? 'ed-far' : ed.includes('近い') ? 'ed-close' : 'ed-watch';
  var nkHtml = (s1.next_kpis || []).map(function (k) { return '<li class="nkpi-item">' + esc(k) + '</li>'; }).join('');
  var histHtml = '';
  if (qs.length > 1) {
    var others = qs.filter(function (x) { return x !== q; });
    var histItems = others.map(function (oq) {
      var or  = reviews[oq] && reviews[oq].stage1;
      var osc = or ? or.health_score : '?';
      var orc = or ? or.recommendation : '';
      return '<div class="hist-item" onclick="showReviewQ(\'' + esc(ticker) + '\',\'' + esc(oq) + '\')">' +
        '<span class="hist-q">' + esc(oq) + '</span>' +
        '<span class="rec-badge rec-' + esc((orc || '').toLowerCase()) + '" style="font-size:10px">' + esc(orc) + '</span>' +
        '<span class="hist-sc">' + osc + '点</span></div>';
    }).join('');
    histHtml = '<div style="margin-top:14px">' +
      '<div class="hist-toggle" onclick="toggleHist(this)"><span>▶</span><span>過去のレビュー (' + others.length + '件)</span></div>' +
      '<div class="hist-body">' + histItems + '</div></div>';
  }
  var predHtml = _buildPredictionSection(ticker, q);
  return [
    '<div class="rv-head"><span class="rv-quarter">' + esc(q) + '</span><span class="rv-date">生成: ' + esc(genDate) + '</span></div>',
    '<div class="gauge-wrap">',
    '<div class="gauge-top"><span class="gauge-num" style="color:' + gc + '">' + score + '</span>',
    '<span class="rec-badge ' + recCls + '">' + esc(rec) + '</span></div>',
    '<div class="gauge-bar"><div class="gauge-fill" style="width:' + score + '%;background:' + gc + '"></div></div></div>',
    '<div class="rv-summary">' + esc(s1.summary || '') + '</div>',
    biasHtml,
    '<div class="rv-lists">',
    '<div class="rv-list-box"><div class="rv-list-title pos">ポジティブ点</div><ul class="rv-list pos">' + posHtml + '</ul></div>',
    '<div class="rv-list-box"><div class="rv-list-title neg">懸念点</div><ul class="rv-list neg">' + conHtml + '</ul></div>',
    '</div>',
    '<div class="exit-box"><div class="exit-box-label">エグジット条件との距離感</div>',
    '<span class="exit-dist-badge ' + edCls + '">' + esc(ed) + '</span>',
    '<span style="font-size:12px;color:var(--sub)">' + esc(s1.exit_distance_reason || '') + '</span></div>',
    '<div class="nkpi-title">次四半期の確認KPI</div>',
    '<ul class="nkpi-list">' + nkHtml + '</ul>',
    predHtml,
    histHtml,
  ].join('');
}

function _fmtPredVal(v) {
  if (v === null || v === undefined) return 'N/A';
  if (typeof v === 'number' && Math.abs(v) <= 10) return (v * 100).toFixed(1) + '%';
  if (Math.abs(v) >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
  if (Math.abs(v) >= 1e6) return '$' + Math.round(v / 1e6) + 'M';
  return String(v);
}

function _buildPredictionSection(ticker, currentQ) {
  var entries = (predictionHistory[ticker] || []).filter(function (e) {
    return e.kpi_forecast_available && e.matchable && e.scenario === 'base';
  });
  var recent = entries.slice(-2);
  if (!recent.length) return '';
  var rows = [];
  recent.forEach(function (entry) {
    var preds = entry.predictions || {};
    var kpiKeys = Object.keys(preds);
    if (!kpiKeys.length) return;
    var tableRows = kpiKeys.map(function (kn) {
      var p = preds[kn];
      var dev = p.deviation_pct;
      var acc = p.accuracy;
      var devStr = dev !== null && dev !== undefined ? (dev >= 0 ? '+' : '') + dev.toFixed(1) + '%' : 'N/A';
      var devCls = acc === 'accurate' ? 'pred-ok' : acc === 'under_estimated' ? 'pred-up' : 'pred-dn';
      var badge  = acc === 'accurate' ? '' : acc === 'under_estimated' ? '過小評価' : '過大評価';
      return '<tr><td>' + esc(kn) + '</td><td>' + esc(_fmtPredVal(p.predicted)) + '</td><td>' + esc(_fmtPredVal(p.actual)) + '</td>' +
        '<td class="' + devCls + '">' + devStr + (badge ? ' <span class="pred-badge">' + badge + '</span>' : '') + '</td></tr>';
    }).join('');
    rows.push('<div class="pred-entry-header">' + esc(entry.review_quarter) + ' レビュー予測 → ' + esc(entry.forecast_target) + ' 実績</div>' +
      '<table class="pred-table"><thead><tr><th>KPI</th><th>予測値</th><th>実績値</th><th>乖離率</th></tr></thead><tbody>' + tableRows + '</tbody></table>');
  });
  if (!rows.length) return '';
  return '<div class="pred-section">' +
    '<div class="pred-toggle" onclick="togglePred(this)"><span class="pred-toggle-icon">▶</span><span>過去予測の振り返り</span></div>' +
    '<div class="pred-body">' + rows.join('') + '</div></div>';
}

function togglePred(el) {
  var body = el.nextElementSibling;
  var open = body.classList.toggle('open');
  el.querySelector('.pred-toggle-icon').textContent = open ? '▼' : '▶';
}

/* ─── Tab 3: KPIトレンド ─── */
function buildTabKpi(ticker) {
  var kd = kpiCache[ticker];
  if (!kd) return '<div style="text-align:center;color:var(--mut);padding:40px;font-family:var(--mono);font-size:12px">KPIデータ読み込み中...</div>';
  var kpis  = kd.kpis || {};
  var names = Object.keys(kpis).filter(function (kname) {
    return (kpis[kname].data || []).some(function (d) { return d.value !== null && d.value !== undefined; });
  });
  if (!names.length) return '<div style="text-align:center;color:var(--mut);padding:40px;font-family:var(--mono);font-size:12px">KPIデータなし</div>';
  return names.map(function (kname) {
    return '<div class="kpi-card"><div class="kpi-card-name">' + esc(kname) + '</div>' + buildSparkline(kpis[kname]) + '</div>';
  }).join('');
}

function buildSparkline(kinfo) {
  var rawData = (kinfo.data || []).slice()
    .filter(function (d) { return d.value !== null && d.value !== undefined; })
    .sort(function (a, b) { return a.quarter.localeCompare(b.quarter); });
  var unit = kinfo.unit || '';
  if (!rawData.length) return '<p style="color:var(--mut);font-size:12px;text-align:center">データなし</p>';
  var W = 440, H = 120, PL = 50, PR = 14, PT = 12, PB = 26;
  var cW = W - PL - PR, cH = H - PT - PB, n = rawData.length;
  var vals = rawData.map(function (d) { return d.value; });
  var minV = Math.min.apply(null, vals);
  var maxV = Math.max.apply(null, vals);
  var rng  = maxV === minV ? 1 : maxV - minV;
  function xAt(i) { return PL + (n > 1 ? (i / (n - 1)) * cW : cW / 2); }
  function yAt(v) { return PT + cH - ((v - minV) / rng) * cH; }
  function fv(v) {
    if (unit === 'USD') {
      if (Math.abs(v) < 2)    return (v * 100).toFixed(1) + '%';
      if (Math.abs(v) >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
      if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    }
    return String(v);
  }
  var pts = rawData.map(function (d, i) { return xAt(i).toFixed(1) + ',' + yAt(d.value).toFixed(1); });
  var circles = rawData.map(function (d, i) {
    return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(d.value).toFixed(1) + '" r="3.5" fill="var(--acc)" stroke="var(--bg)" stroke-width="1.5"><title>' + d.quarter + ': ' + fv(d.value) + '</title></circle>';
  }).join('');
  var lv = rawData[n - 1];
  var lx = xAt(n - 1), ly = yAt(lv.value);
  var anchor = (lx > W * 0.72) ? 'end' : 'start';
  var lxOff  = (anchor === 'end') ? -6 : 6;
  var lyAdj  = (ly < PT + 16) ? ly + 14 : ly - 5;
  var lastLbl = '<text x="' + (lx + lxOff) + '" y="' + lyAdj + '" text-anchor="' + anchor + '" font-size="10" fill="var(--acc)">' + fv(lv.value) + '</text>';
  var showSet = new Set([0, n - 1]);
  var step = Math.max(1, Math.ceil(n / 4));
  for (var i = 0; i < n; i += step) showSet.add(i);
  var xLbls = rawData.map(function (d, idx) {
    if (!showSet.has(idx)) return '';
    return '<text x="' + xAt(idx).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" font-size="9" fill="var(--mut)">' + d.quarter + '</text>';
  }).join('');
  var yLbls =
    '<text x="' + (PL - 3) + '" y="' + (PT + 4) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + fv(maxV) + '</text>' +
    '<text x="' + (PL - 3) + '" y="' + (PT + cH) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + fv(minV) + '</text>';
  var midY = (PT + cH / 2).toFixed(1);
  var grid = '<line x1="' + PL + '" y1="' + midY + '" x2="' + (W - PR) + '" y2="' + midY + '" stroke="var(--bdr)" stroke-dasharray="3,3" stroke-width="1"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block">' +
    grid + yLbls +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>' +
    circles + lastLbl + xLbls + '</svg>';
}

/* ─── Tab 4: DCFシナリオ ─── */
function buildTabDcf(ticker) {
  var reviews = loadedReviews[ticker];
  if (!reviews) return '<div class="no-rv">レビューデータなし</div>';
  var qs = Object.keys(reviews).sort().reverse();
  if (!qs.length) return '<div class="no-rv">レビューデータなし</div>';
  var s2  = reviews[qs[0]].stage2 || {};
  var sc  = s2.scenarios || {};
  var scd = loadedScenarios[ticker];
  var hasScenario = scd && (scd.bear || scd.base || scd.bull);
  if (!hasScenario) {
    if (!scd) {
      ensureScenariosLoaded(ticker).then(function () {
        if (currentTabIdx === 4) renderDetailBody(ticker, 4);
      });
    }
    if (!Object.keys(sc).length) return '<div class="no-rv">DCFデータなし</div>';
    return _buildLegacyDcfTable(qs[0], sc, s2);
  }
  return _buildFuturePriceTable(ticker, qs[0], scd, sc, s2);
}

function _buildFuturePriceTable(ticker, quarter, scd, sc, s2) {
  var anyScen  = scd.base || scd.bear || scd.bull || {};
  var baseIv   = anyScen.base_intrinsic_value;
  var curPrice = anyScen.current_price;
  var periods  = ['現在', '1年後', '3年後', '5年後'];
  function fv(v) { return (v != null && v !== 0) ? '$' + Number(v).toFixed(0) : '—'; }
  function getVal(sd, period) {
    if (!sd) return null;
    if (period === '現在') return sd.base_intrinsic_value;
    return (sd.future_values || {})[period] || null;
  }
  function cellStyle(val) {
    if (val == null || !curPrice) return '';
    return val >= curPrice ? 'color:var(--grn);font-weight:600' : '';
  }
  var thead = '<tr><th></th>' + periods.map(function (p) { return '<th style="text-align:center;font-family:var(--mono);font-size:10px">' + p + '</th>'; }).join('') + '</tr>';
  var scRows = [
    { key: 'bear', em: '🐻', cls: 'dcf-bear' },
    { key: 'base', em: '📊', cls: 'dcf-base' },
    { key: 'bull', em: '🐂', cls: 'dcf-bull' },
  ];
  var tbody = scRows.map(function (row) {
    var sd = scd[row.key];
    return '<tr><td style="font-family:var(--mono);font-size:11px" class="' + row.cls + '">' + row.em + ' ' + row.key.toUpperCase() + '</td>' +
      periods.map(function (p) {
        var v = getVal(sd, p);
        return '<td class="num ' + row.cls + '" style="' + cellStyle(v) + '">' + fv(v) + '</td>';
      }).join('') + '</tr>';
  }).join('');
  var cpRow = curPrice
    ? '<tr style="border-top:2px solid var(--amb)"><td style="color:var(--amb);font-family:var(--mono);font-size:11px">現在株価</td>' +
      '<td class="num" style="color:var(--amb)">' + fv(curPrice) + '</td>' +
      '<td colspan="3" style="text-align:center;color:var(--mut);font-size:10px;font-family:var(--mono)">← 緑字のセル = 現在株価を超える時点</td></tr>'
    : '';
  var metaHtml = '<div style="margin-bottom:8px;font-family:var(--mono);font-size:10px;color:var(--sub)">' + esc(quarter) + ' 将来理論価格（起点: $' + (baseIv ? Number(baseIv).toFixed(2) : '—') + ' / 現在株価: $' + (curPrice ? Number(curPrice).toFixed(2) : '—') + '）</div>';
  var tableHtml = '<div class="tbl-wrap"><table class="dcf-tbl"><thead>' + thead + '</thead><tbody>' + tbody + cpRow + '</tbody></table></div>';
  var aRows = [
    { label: '売上成長率 Y1/Y2/Y3', fn: function (sd) { var a = sd.assumptions || {}; return [a.Y1_growth, a.Y2_growth, a.Y3_growth].map(function (v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }).join(' / '); } },
    { label: '加重成長率（使用値）', fn: function (sd) { var wg = (sd.assumptions || {}).weighted_growth; return wg != null ? (wg * 100).toFixed(1) + '%' : '—'; } },
    { label: 'ターミナル成長率',     fn: function (sd) { var v = (sd.assumptions || {}).terminal_growth; return v != null ? (v * 100).toFixed(1) + '%' : '—'; } },
    { label: '最終営業利益率',       fn: function (sd) { var v = (sd.assumptions || {}).operating_margin; return v != null ? (v * 100).toFixed(1) + '%' : '—'; } },
  ];
  var aHead = '<tr><th>前提</th><th class="dcf-bear">BEAR</th><th class="dcf-base">BASE</th><th class="dcf-bull">BULL</th></tr>';
  var aBody = aRows.map(function (r) {
    return '<tr><td>' + esc(r.label) + '</td>' + ['bear', 'base', 'bull'].map(function (s) { return '<td class="num dcf-' + s + '">' + (scd[s] ? r.fn(scd[s]) : '—') + '</td>'; }).join('') + '</tr>';
  }).join('');
  var rationaleHtml = ['bear', 'base', 'bull'].map(function (s) {
    var rat = (sc[s] || {}).rationale;
    return rat ? '<div class="kpi-card" style="margin-bottom:8px"><div class="kpi-card-name dcf-' + s + '">' + s.toUpperCase() + ' 根拠</div><div style="font-size:12px;color:var(--sub);line-height:1.6">' + esc(rat) + '</div></div>' : '';
  }).join('');
  var assumHtml = (s2.key_assumptions || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');
  var riskHtml  = (s2.risk_factors    || []).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');
  var detailsHtml = '<details style="margin-top:12px"><summary style="font-family:var(--mono);font-size:10px;color:var(--sub);cursor:pointer;padding:4px 0;list-style:none">▶ シナリオ前提を表示</summary>' +
    '<div style="margin-top:8px"><table class="dcf-tbl"><thead>' + aHead + '</thead><tbody>' + aBody + '</tbody></table>' +
    rationaleHtml +
    (assumHtml ? '<div class="dcf-sec"><div class="dcf-sec-title assum">KEY ASSUMPTIONS</div><ul class="dcf-ul">' + assumHtml + '</ul></div>' : '') +
    (riskHtml  ? '<div class="dcf-sec"><div class="dcf-sec-title risk">RISK FACTORS</div><ul class="dcf-ul">' + riskHtml + '</ul></div>' : '') +
    '</div></details>';
  var kpiDetailsHtml = '';
  var baseKpiFc  = (scd.base || {}).kpi_forecasts || {};
  var kpiCurrent = (scd.base || {}).kpi_current   || {};
  var kpiL1Keys  = (scd.base || {}).kpi_layer1_keys || [];
  var kpiFmt     = (scd.base || {}).kpi_format     || {};
  var allKpiKeys = Object.keys(kpiCurrent);
  if (allKpiKeys.length > 0 && (baseKpiFc['1年後'] || baseKpiFc['3年後'])) {
    function fmtKv(v, fmt) {
      if (v == null) return '—';
      var n = Number(v); if (isNaN(n)) return String(v);
      fmt = fmt || (Math.abs(n) >= 1e6 ? 'usd' : Math.abs(n) <= 2 ? 'pct' : 'usd_small');
      if (fmt === 'usd') { if (Math.abs(n) >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B'; if (Math.abs(n) >= 1e6) return '$' + (n / 1e6).toFixed(0) + 'M'; return '$' + n.toFixed(0); }
      if (fmt === 'pct') return (n * 100).toFixed(1) + '%';
      if (fmt === 'usd_small') return '$' + n.toFixed(2);
      return n.toFixed(2);
    }
    var l2Keys = allKpiKeys.filter(function (k) { return kpiL1Keys.indexOf(k) === -1; });
    var l1Keys = allKpiKeys.filter(function (k) { return kpiL1Keys.indexOf(k) !== -1; });
    var kfcHead = '<tr><th>KPI</th><th style="text-align:center;font-family:var(--mono);font-size:10px">現在</th>' +
      ['bear','base','bull'].map(function (s) {
        return '<th class="dcf-' + s + '" style="text-align:center;font-family:var(--mono);font-size:10px">' + s.toUpperCase() + '<br><span style="font-size:9px">1年後</span></th>' +
               '<th class="dcf-' + s + '" style="text-align:center;font-family:var(--mono);font-size:10px">' + s.toUpperCase() + '<br><span style="font-size:9px">3年後</span></th>';
      }).join('') + '</tr>';
    function buildKfcRow(kpiName, isL1) {
      var fmt = kpiFmt[kpiName];
      var curVal = kpiCurrent[kpiName];
      var nameHtml = isL1 ? '<span style="color:var(--mut)">' + esc(kpiName) + '</span> <span style="font-size:9px;color:var(--mut);font-family:var(--mono)">(財務推計)</span>' : esc(kpiName);
      return '<tr><td style="font-size:11px">' + nameHtml + '</td><td class="num" style="color:var(--sub)">' + fmtKv(curVal, fmt) + '</td>' +
        ['bear','base','bull'].map(function (s) {
          var fc1 = ((scd[s] || {}).kpi_forecasts || {})['1年後'] || {};
          var fc3 = ((scd[s] || {}).kpi_forecasts || {})['3年後'] || {};
          return '<td class="num dcf-' + s + '">' + fmtKv(fc1[kpiName], fmt) + '</td><td class="num dcf-' + s + '">' + fmtKv(fc3[kpiName], fmt) + '</td>';
        }).join('') + '</tr>';
    }
    var kfcBody = l2Keys.map(function (k) { return buildKfcRow(k, false); }).join('');
    if (l1Keys.length > 0) {
      kfcBody += '<tr style="border-top:1px solid var(--bdr)"><td colspan="8" style="padding:2px 0"></td></tr>';
      kfcBody += l1Keys.map(function (k) { return buildKfcRow(k, true); }).join('');
    }
    kpiDetailsHtml = '<details style="margin-top:8px"><summary style="font-family:var(--mono);font-size:10px;color:var(--sub);cursor:pointer;padding:4px 0;list-style:none">▶ KPI予想値を表示</summary>' +
      '<div style="margin-top:8px"><div class="tbl-wrap"><table class="dcf-tbl"><thead>' + kfcHead + '</thead><tbody>' + kfcBody + '</tbody></table></div></div></details>';
  }
  return metaHtml + tableHtml + kpiDetailsHtml + detailsHtml;
}

function _buildLegacyDcfTable(quarter, sc, s2) {
  var rows = [
    { key: 'revenue_growth_y1',         label: '売上成長率 Y1' },
    { key: 'revenue_growth_y2',         label: '売上成長率 Y2' },
    { key: 'revenue_growth_y3',         label: '売上成長率 Y3' },
    { key: 'terminal_growth',           label: 'ターミナル成長率' },
    { key: 'operating_margin_terminal', label: '最終営業利益率' },
  ];
  function fp(v) { return v != null ? (v * 100).toFixed(1) + '%' : '—'; }
  var thead = '<tr><th>指標</th><th class="dcf-bear">BEAR</th><th class="dcf-base">BASE</th><th class="dcf-bull">BULL</th></tr>';
  var tbody = rows.map(function (r) {
    return '<tr><td>' + esc(r.label) + '</td>' + ['bear', 'base', 'bull'].map(function (s) { return '<td class="dcf-' + s + '">' + fp((sc[s] || {})[r.key]) + '</td>'; }).join('') + '</tr>';
  }).join('');
  var rationaleHtml = ['bear', 'base', 'bull'].map(function (s) {
    var rat = (sc[s] || {}).rationale;
    return rat ? '<div class="kpi-card" style="margin-bottom:8px"><div class="kpi-card-name dcf-' + s + '">' + s.toUpperCase() + ' シナリオ根拠</div><div style="font-size:12px;color:var(--sub);line-height:1.6">' + esc(rat) + '</div></div>' : '';
  }).join('');
  var assumHtml = (s2.key_assumptions || []).map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('');
  var riskHtml  = (s2.risk_factors    || []).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');
  return [
    '<div style="margin-bottom:4px;font-family:var(--mono);font-size:10px;color:var(--sub)">' + esc(quarter) + ' Grok DCFパラメータ（将来価格データ生成中...）</div>',
    '<table class="dcf-tbl"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>',
    rationaleHtml,
    assumHtml ? '<div class="dcf-sec"><div class="dcf-sec-title assum">KEY ASSUMPTIONS</div><ul class="dcf-ul">' + assumHtml + '</ul></div>' : '',
    riskHtml  ? '<div class="dcf-sec"><div class="dcf-sec-title risk">RISK FACTORS</div><ul class="dcf-ul">' + riskHtml + '</ul></div>' : '',
  ].join('');
}

/* ─── Tab 5: AI視点 ─── */
function buildTabCall2(ticker) {
  var reviews = loadedReviews[ticker];
  if (!reviews) return '<div class="no-rv">レビューデータなし</div>';
  var qs = Object.keys(reviews).sort().reverse();
  if (!qs.length) return '<div class="no-rv">レビューデータなし</div>';
  var rv = reviews[qs[0]];
  var c2 = rv && rv.call2;
  if (!c2) return '<div class="no-rv">AI定性分析データがありません。<br>次回のレビュー生成で自動追加されます。</div>';
  var fp = c2.five_perspectives || {};
  var fpLabels = [
    { key: 'business_model',        label: 'ビジネスモデル' },
    { key: 'growth',                label: '成長性' },
    { key: 'competitive_advantage', label: '競争優位' },
    { key: 'management',            label: '経営' },
    { key: 'market',                label: '市場環境' },
  ];
  var fpHtml = fpLabels.map(function (item) {
    var txt = fp[item.key] || '—';
    return '<div class="kpi-card" style="margin-bottom:6px"><div class="kpi-card-name">' + esc(item.label) + '</div><div style="font-size:12px;color:var(--sub);line-height:1.6">' + esc(txt) + '</div></div>';
  }).join('');
  var ha = c2.historical_analogy || {};
  var haHtml = ha.company ? [
    '<div class="kpi-card" style="border-left:3px solid var(--acc);margin-bottom:8px">',
    '<div class="kpi-card-name">歴史的類比: ' + esc(ha.company) + '</div>',
    '<div style="font-size:12px;line-height:1.6;color:var(--sub)">',
    '<strong>類似点:</strong> ' + esc(ha.similarity || '—') + '<br>',
    '<strong>その後:</strong> ' + esc(ha.outcome || '—') + '<br>',
    '<strong>示唆:</strong> ' + esc(ha.implication || '—'),
    '</div></div>',
  ].join('') : '';
  var espHtml   = c2.entry_story_progress ? tBlock('エントリーストーリー進捗', c2.entry_story_progress) : '';
  var maHtml    = c2.market_attention     ? tBlock('世の中の注目ポイント',     c2.market_attention)    : '';
  var macroHtml = c2.macro_implications   ? tBlock('マクロ環境の示唆',         c2.macro_implications)  : '';
  var tqHtml = '';
  if (c2.thesis_questions && c2.thesis_questions.length) {
    var qItems = c2.thesis_questions.map(function (q) { return '<li style="margin-bottom:6px">' + esc(q) + '</li>'; }).join('');
    tqHtml = '<div class="bias-box" style="border-color:var(--red);margin-bottom:8px"><strong>テーゼへの問いかけ</strong><ul style="margin:6px 0 0 16px;padding:0">' + qItems + '</ul></div>';
  }
  var nrfHtml = '';
  if (c2.next_review_focus && c2.next_review_focus.length) {
    var badges = c2.next_review_focus.map(function (f, i) {
      return '<span class="tag core" style="margin:2px 4px 2px 0;display:inline-block">' + (i + 1) + '. ' + esc(f) + '</span>';
    }).join('');
    nrfHtml = '<div class="dcf-sec"><div class="dcf-sec-title assum">次回確認論点</div><div style="padding:6px 0">' + badges + '</div></div>';
  }
  return [
    '<div class="rv-head"><span class="rv-quarter">' + esc(qs[0]) + '</span><span class="rv-date">AI定性分析</span></div>',
    '<div style="margin-bottom:12px"><div class="nkpi-title">5観点での気になる点</div>' + fpHtml + '</div>',
    haHtml, espHtml, maHtml, macroHtml, tqHtml, nrfHtml,
  ].join('');
}

/* ─── Tab 6: 内部統制 ─── */
function _buildCtrlBody(ticker, d) {
  if (d === null) return '<div style="padding:20px;color:var(--mut);text-align:center">データなし（未取得 or CIK未登録）</div>';
  var effLabel, effColor;
  if (d.effective === true)       { effLabel = '有効 (Effective)';      effColor = 'var(--green, #22c55e)'; }
  else if (d.effective === false) { effLabel = '無効 (Not Effective)';  effColor = 'var(--red, #ef4444)'; }
  else                             { effLabel = '判定不能';               effColor = 'var(--mut)'; }
  var badgeHtml = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
    '<span style="font-size:13px;font-weight:700;color:' + effColor + ';background:' +
    effColor.replace(')', ',0.12)').replace('var(', 'rgba(').replace('var(--green, #22c55e)', 'rgba(34,197,94,0.12)').replace('var(--red, #ef4444)', 'rgba(239,68,68,0.12)').replace('var(--mut)', 'rgba(128,128,128,0.12)') +
    ';padding:4px 10px;border-radius:4px;border:1px solid ' + effColor + '">' + esc(effLabel) + '</span>' +
    '<span style="font-size:11px;color:var(--mut)">' + esc(d.quarter || '') + ' / 提出日: ' + esc(d.filing_date || '') + '</span></div>';
  var mwHtml = '';
  if (d.material_weaknesses && d.material_weaknesses.length > 0) {
    var mwItems = d.material_weaknesses.map(function (s) { return '<li style="margin-bottom:6px;line-height:1.5;font-size:11px">' + esc(s.slice(0, 300)) + (s.length > 300 ? '…' : '') + '</li>'; }).join('');
    mwHtml = '<div class="dcf-sec" style="margin-bottom:10px"><div class="dcf-sec-title assum" style="color:var(--red,#ef4444)">マテリアルウィークネス (' + d.material_weaknesses.length + '件)</div><ul style="margin:6px 0 0 0;padding-left:16px">' + mwItems + '</ul></div>';
  } else if (d.effective === true) {
    mwHtml = '<div class="dcf-sec" style="margin-bottom:10px"><div class="dcf-sec-title" style="color:var(--green,#22c55e)">マテリアルウィークネス: なし</div></div>';
  }
  var sdHtml = '';
  if (d.significant_deficiencies && d.significant_deficiencies.length > 0) {
    var sdItems = d.significant_deficiencies.map(function (s) { return '<li style="margin-bottom:6px;line-height:1.5;font-size:11px">' + esc(s.slice(0, 300)) + (s.length > 300 ? '…' : '') + '</li>'; }).join('');
    sdHtml = '<div class="dcf-sec" style="margin-bottom:10px"><div class="dcf-sec-title assum" style="color:#f59e0b">重要な欠陥 (' + d.significant_deficiencies.length + '件)</div><ul style="margin:6px 0 0 0;padding-left:16px">' + sdItems + '</ul></div>';
  }
  var excerptHtml = '';
  if (d.item4_excerpt_ja) {
    excerptHtml += '<div class="dcf-sec" style="margin-top:10px;margin-bottom:10px"><div class="dcf-sec-title assum" style="margin-bottom:6px">Item 4 要旨（日本語）</div>' +
      '<div style="font-size:12px;color:var(--txt);line-height:1.7;white-space:pre-wrap;padding:10px;background:var(--sur2);border-radius:4px;max-height:280px;overflow-y:auto">' + esc(d.item4_excerpt_ja) + '</div></div>';
  }
  if (d.item4_excerpt) {
    excerptHtml += '<details style="margin-top:4px"><summary style="font-family:var(--mono);font-size:10px;color:var(--sub);cursor:pointer;padding:4px 0;list-style:none">▶ Item 4 原文（English）を表示</summary>' +
      '<div style="margin-top:8px;padding:10px;background:var(--sur2);border-radius:4px;font-size:10px;font-family:var(--mono);color:var(--sub);white-space:pre-wrap;max-height:300px;overflow-y:auto">' + esc(d.item4_excerpt) + '</div></details>';
  }
  var fetchedHtml = '<div style="margin-top:14px;font-size:10px;color:var(--mut)">取得日時: ' + esc((d.fetched_at || '').slice(0, 19).replace('T', ' ')) + ' JST</div>';
  return [badgeHtml, mwHtml, sdHtml, excerptHtml, fetchedHtml].join('');
}

function _onCtrlQuarterChange(ticker, quarter, containerId) {
  var el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '<div style="padding:16px;color:var(--mut);text-align:center">読み込み中…</div>';
  fetch('data/ctrl/' + ticker + '/' + quarter + '.json?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (d) { el.innerHTML = _buildCtrlBody(ticker, d); });
}

function buildTabCtrl(ticker) {
  var d = loadedCtrl[ticker];
  if (d === undefined) return '<div style="padding:20px;color:var(--mut);text-align:center">読み込み中…</div>';
  var quarters  = (ctrlIndex[ticker] && ctrlIndex[ticker].quarters) || [];
  var selectorHtml = '';
  var bodyId = 'ctrl-body-' + ticker;
  if (quarters.length >= 2) {
    var opts = quarters.map(function (q) {
      return '<option value="' + esc(q) + '"' + (q === (d && d.quarter) ? ' selected' : '') + '>' + esc(q) + '</option>';
    }).join('');
    selectorHtml = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">' +
      '<span style="font-size:11px;color:var(--sub)">対象期:</span>' +
      '<select onchange="_onCtrlQuarterChange(\'' + ticker + '\',this.value,\'' + bodyId + '\')" ' +
      'style="background:var(--sur2);color:var(--txt);border:1px solid var(--bdr);border-radius:4px;padding:3px 8px;font-size:12px;cursor:pointer">' +
      opts + '</select></div>';
  }
  return '<div class="rv-head"><span class="rv-quarter">' + esc(ticker) + '</span><span class="rv-date">内部統制評価 (Item 4)</span></div>' +
    selectorHtml + '<div id="' + bodyId + '">' + _buildCtrlBody(ticker, d) + '</div>';
}

/* ─── Utility ─── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function truncate(s, n) { return esc(s.length > n ? s.slice(0, n) + '…' : s); }
function calcDays(d) { return Math.max(0, Math.floor((Date.now() - new Date(d).getTime()) / 86400000)) + '日'; }
</script>
</body>
</html>
