<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TANUKI SCORE — 統合投資判断</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:  #0a0d14; --sur: #0f1425; --sur2: #141a2e; --bdr: #1b2540;
      --acc: #3b82f6; --grn: #10b981; --red: #f43f5e; --amb: #f59e0b;
      --cyn: #06b6d4; --pur: #8b5cf6;
      --txt: #e2e8f0; --sub: #7a92b0; --mut: #3d5070;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 15px; min-height: 100vh; }
    .shell { max-width: 980px; margin: 0 auto; padding: 0 24px 60px; }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--bdr); padding: 14px 0;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px; flex-wrap: wrap; gap: 10px;
      position: sticky; top: 0; background: var(--bg); z-index: 100;
    }
    .logo { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .12em; display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo-dot { width: 7px; height: 7px; background: var(--grn); border-radius: 50%; animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4);}50%{box-shadow:0 0 0 5px rgba(16,185,129,0);} }
    .nav-links { display: flex; flex-wrap: wrap; gap: 14px; }
    .nav-links a { font-family: var(--mono); font-size: 11px; color: var(--mut); text-decoration: none; letter-spacing: .06em; padding: 4px 0; border-bottom: 1px solid transparent; transition: all .2s; }
    .nav-links a:hover { color: var(--acc); border-bottom-color: var(--acc); }
    .nav-links a.active { color: var(--acc); border-bottom-color: var(--acc); }

    /* ── Section title ── */
    .sec { font-family: var(--mono); font-size: 11px; color: var(--mut); letter-spacing: .1em; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }

    /* ── ① Market summary bar ── */
    .mkt-bar { background: var(--sur); border: 1px solid var(--bdr); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .mkt-phase { font-size: 15px; font-weight: 500; flex: 1; min-width: 200px; }
    .mkt-stats { display: flex; gap: 0; }
    .mkt-stat { font-family: var(--mono); font-size: 12px; color: var(--sub); padding: 4px 14px; border-left: 1px solid var(--bdr); }
    .mkt-stat strong { color: var(--txt); font-size: 14px; }
    .mkt-stat:first-child { border-left: none; }

    /* ── ② Category board ── */
    .cat-row { display: grid; gap: 12px; margin-bottom: 12px; }
    .cat-row.top3 { grid-template-columns: repeat(3, 1fr); }
    .cat-row.bot2 { grid-template-columns: 2fr 1fr; }

    .cat-card { background: var(--sur); border: 1px solid var(--bdr); padding: 16px 18px; }
    .cat-card.shikomi { border-color: rgba(16,185,129,.35); }
    .cat-card.wait    { border-color: rgba(245,158,11,.35); }
    .cat-card.profit  { border-color: rgba(59,130,246,.35); }
    .cat-card.watch   { border-color: var(--bdr); }
    .cat-card.ronogai { border-color: rgba(244,63,94,.25); }

    .cat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .cat-label { font-family: var(--mono); font-size: 14px; font-weight: 500; }
    .shikomi .cat-label { color: var(--grn); }
    .wait    .cat-label { color: var(--amb); }
    .profit  .cat-label { color: var(--acc); }
    .watch   .cat-label { color: var(--sub); }
    .ronogai .cat-label { color: var(--red); }
    .cat-count { font-family: var(--mono); font-size: 12px; color: var(--mut); }
    .cat-desc  { font-size: 11px; color: var(--mut); margin-bottom: 10px; font-family: var(--mono); letter-spacing: .03em; }

    .cat-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .cat-chip { display: inline-flex; flex-direction: column; padding: 6px 10px; border: 1px solid var(--bdr); background: var(--sur2); text-decoration: none; transition: border-color .12s; }
    .cat-chip:hover { border-color: var(--sub); }
    .cat-chip .ckr { font-family: var(--mono); font-size: 13px; font-weight: 500; }
    .cat-chip .csc { font-family: var(--mono); font-size: 10px; color: var(--mut); margin-top: 2px; }
    .shikomi .cat-chip .ckr { color: var(--grn); }
    .wait    .cat-chip .ckr { color: var(--amb); }
    .profit  .cat-chip .ckr { color: var(--acc); }
    .watch   .cat-chip .ckr { color: var(--sub); }
    .ronogai .cat-chip .ckr { color: var(--red); }

    /* ── 今日の特選銘柄 ── */
    .pick-card { background: var(--sur); border: 1px solid rgba(20,184,166,.35); }
    .pick-header { padding: 14px 20px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .pick-pin { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #14b8a6; }
    .pick-ts  { font-family: var(--mono); font-size: 11px; color: var(--mut); }
    .pick-meta { padding: 14px 20px 10px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .pick-ticker { font-family: var(--mono); font-size: 26px; font-weight: 500; color: #14b8a6; text-decoration: none; }
    .pick-ticker:hover { text-decoration: underline; }
    .pick-company { font-size: 14px; color: var(--sub); flex: 1; }
    .pick-reason { font-family: var(--mono); font-size: 12px; color: var(--mut); padding: 0 20px 8px; }
    .pick-scores { display: flex; gap: 10px; padding: 0 20px 14px; }
    .pick-sc { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 1px; }
    .pick-sc.shikomi { background: rgba(16,185,129,.12); color: var(--grn); }
    .pick-sc.wait    { background: rgba(245,158,11,.12);  color: var(--amb); }
    .pick-sc.profit  { background: rgba(59,130,246,.12);  color: var(--acc); }
    .pick-sc.watch   { background: rgba(100,116,139,.12); color: var(--sub); }
    .pick-sc.ronogai { background: rgba(244,63,94,.10);   color: var(--red); }
    .pick-report { border-top: 1px solid var(--bdr); }
    .pick-section { padding: 14px 20px; border-bottom: 1px solid rgba(27,37,64,.5); }
    .pick-section:last-child { border-bottom: none; }
    .pick-sec-title { font-family: var(--mono); font-size: 11px; color: #14b8a6; letter-spacing: .08em; margin-bottom: 8px; }
    .pick-sec-body { font-size: 14px; color: var(--txt); line-height: 1.75; white-space: pre-wrap; }
    .pick-stale { padding: 20px; font-family: var(--mono); font-size: 12px; color: var(--mut); text-align: center; }

    /* 論外 toggle */
    .ronogai-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .ronogai-toggle .tog-arrow { font-size: 10px; color: var(--mut); transition: transform .2s; }
    .ronogai-toggle.open .tog-arrow { transform: rotate(180deg); }
    #ronogai-body { display: none; }
    .cat-empty { font-family: var(--mono); font-size: 12px; color: var(--mut); padding: 4px 0; }

    /* ── ③ Detail table ── */
    .tbl-wrap { background: var(--sur); border: 1px solid var(--bdr); overflow-x: auto; }
    .dtbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dtbl th {
      font-family: var(--mono); font-size: 10px; color: var(--mut); text-align: left;
      padding: 9px 12px; border-bottom: 1px solid var(--bdr); white-space: nowrap;
      background: var(--sur); cursor: pointer; user-select: none; position: relative;
    }
    .dtbl th:hover { color: var(--sub); }
    .dtbl th.sorted { color: var(--acc); }
    .sort-arr { margin-left: 4px; font-size: 9px; opacity: .7; }
    .dtbl td { padding: 8px 12px; border-bottom: 1px solid rgba(27,37,64,.5); white-space: nowrap; vertical-align: middle; }
    .dtbl tr:last-child td { border-bottom: none; }
    .dtbl tr:hover td { background: rgba(255,255,255,.013); }

    .tkr-a { color: var(--acc); font-family: var(--mono); font-weight: 500; font-size: 13px; text-decoration: none; }
    .tkr-a:hover { text-decoration: underline; }
    .cat-badge { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 1px; white-space: nowrap; }
    .badge-shikomi { background: rgba(16,185,129,.12); color: var(--grn); }
    .badge-wait    { background: rgba(245,158,11,.12);  color: var(--amb); }
    .badge-profit  { background: rgba(59,130,246,.12);  color: var(--acc); }
    .badge-watch   { background: rgba(100,116,139,.12); color: var(--sub); }
    .badge-ronogai { background: rgba(244,63,94,.10);   color: var(--red); }

    .sc-num { font-family: var(--mono); font-size: 13px; text-align: right; }
    .sc-hi  { color: var(--grn); } .sc-mid { color: var(--amb); } .sc-lo { color: var(--sub); } .sc-no { color: var(--mut); }
    .num { font-family: var(--mono); font-size: 13px; text-align: right; }
    .pos { color: var(--grn); } .neg { color: var(--red); } .neu { color: var(--sub); }
    .s1 { color: var(--grn); } .s2 { color: var(--cyn); } .s3 { color: var(--amb); } .s4 { color: var(--red); }
    .fcf-ok { color: var(--grn); } .fcf-ng { color: var(--mut); }
    .tbl-note { font-family: var(--mono); font-size: 10px; color: var(--mut); margin-top: 8px; letter-spacing: .04em; }

    /* Loading */
    .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--bdr); border-top-color: var(--acc); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { color: var(--mut); font-family: var(--mono); font-size: 12px; padding: 40px; text-align: center; }

    @media (max-width: 640px) {
      .cat-row.top3 { grid-template-columns: 1fr; }
      .cat-row.bot2 { grid-template-columns: 1fr; }
      .mkt-stats { flex-wrap: wrap; }
    }

    /* ── 6-cat cards & badges ── */
    .cat-card.buy      { border-color: rgba(34,197,94,.35); }
    .cat-card.watch-cat{ border-color: rgba(234,179,8,.35); }
    .cat-card.hold     { border-color: rgba(59,130,246,.35); }
    .cat-card.trim     { border-color: rgba(249,115,22,.35); }
    .cat-card.sell     { border-color: rgba(239,68,68,.35); }
    .cat-card.pass     { border-color: rgba(71,85,105,.25); }
    .buy       .cat-label { color: #22c55e; }
    .watch-cat .cat-label { color: #eab308; }
    .hold      .cat-label { color: #3b82f6; }
    .trim      .cat-label { color: #f97316; }
    .sell      .cat-label { color: #ef4444; }
    .pass      .cat-label { color: #475569; }
    .buy       .cat-chip .ckr { color: #22c55e; }
    .watch-cat .cat-chip .ckr { color: #eab308; }
    .hold      .cat-chip .ckr { color: #3b82f6; }
    .trim      .cat-chip .ckr { color: #f97316; }
    .sell      .cat-chip .ckr { color: #ef4444; }
    .pass      .cat-chip .ckr { color: #475569; }
    .badge-BUY  { background: rgba(34,197,94,.12);  color: #22c55e; }
    .badge-WATCH{ background: rgba(234,179,8,.12);  color: #eab308; }
    .badge-HOLD { background: rgba(59,130,246,.12); color: #3b82f6; }
    .badge-TRIM { background: rgba(249,115,22,.12); color: #f97316; }
    .badge-SELL { background: rgba(239,68,68,.10);  color: #ef4444; }
    .badge-PASS { background: rgba(71,85,105,.10);  color: #475569; }
    .chip-tags {
      font-size: 9px; color: #94a3b8; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;
    }

    /* ── ④ 判定実績バックテスト ── */
    .sv-wrap { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--bdr); }
    .section-title { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--acc); letter-spacing: .15em; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--bdr); }
    .sv-card { background: var(--sur); border: 1px solid var(--bdr); border-radius: 8px; padding: 24px; margin-top: 0; }
    .sv-subtitle { color: var(--sub); font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
    .sv-sec-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--acc); text-transform: uppercase; margin: 14px 0 8px; border-left: 2px solid var(--acc); padding-left: 8px; }
    .sv-table-wrap { overflow-x: auto; border: 1px solid var(--bdr); border-radius: 4px; max-height: 300px; overflow-y: auto; }
    .sv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sv-table thead th { background: var(--sur2); padding: 7px 12px; text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--sub); position: sticky; top: 0; border-bottom: 1px solid var(--bdr); }
    .sv-table tbody tr { border-bottom: 1px solid rgba(27,37,64,.5); }
    .sv-table tbody tr:last-child { border-bottom: none; }
    .sv-table tbody tr:hover { background: var(--sur2); }
    .sv-table td { padding: 6px 12px; }
    .sv-badge { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
    .sv-badge.sv-buy            { background: rgba(16,185,129,.15); color: #10b981; border-color: rgba(16,185,129,.3); }
    .sv-badge.sv-growth-premium { background: rgba(16,185,129,.1);  color: #10b981; border-color: rgba(16,185,129,.2); }
    .sv-badge.sv-watch          { background: rgba(59,130,246,.15); color: #3b82f6; border-color: rgba(59,130,246,.3); }
    .sv-badge.sv-hold           { background: rgba(100,116,139,.15);color: #94a3b8; border-color: rgba(100,116,139,.3); }
    .sv-badge.sv-trim           { background: rgba(245,158,11,.15); color: #f59e0b; border-color: rgba(245,158,11,.3); }
    .sv-badge.sv-sell           { background: rgba(244,63,94,.15);  color: #f43f5e; border-color: rgba(244,63,94,.3); }
    .sv-badge.sv-pass           { background: rgba(100,116,139,.1); color: var(--sub); border-color: rgba(100,116,139,.2); }

    footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--bdr); text-align: center; font-size: 11px; color: var(--mut); }
    footer a { color: var(--acc); text-decoration: none; }
    .last-updated { font-family: var(--mono); font-size: 11px; color: var(--mut); text-align: right; padding: 6px 0 0; }
  </style>
  <link rel="stylesheet" href="../../common/site-theme.css">
</head>
<body data-tool="tanuki-score">
<div class="shell">
  <header>
    <a href="../../" class="logo">
      <img src="../../common/images/logo.png" alt="TANUKI" style="height:30px;width:auto;object-fit:contain">
      <span class="logo-dot"></span>
      TANUKI SCORE
    </a>
    <nav class="nav-links"></nav>
  </header>
  <div class="last-updated" id="last-updated"></div>

  <div id="mkt-summary"><div class="loading"><span class="spin"></span>市場データを取得中...</div></div>
  <div id="daily-pick"></div>
  <div id="cat-board"></div>
  <div id="detail-tbl"></div>

  <!-- ④ 判定実績バックテスト -->
  <div class="sv-wrap">
    <div id="score-verify-section"></div>
  </div>

  <footer>
    <p>TANUKI SCORE | Part of <a href="/On-a-journey/">ON A JOURNEY</a> Investment Suite</p>
    <p style="margin-top:8px">データソース: SEC EDGAR + yfinance + Market Pulse | 計算: Koichi式 v8.0</p>
  </footer>
</div>

<script>
// ─── Paths ───────────────────────────────────────────────────
const TS     = '?t=' + Date.now();
const T_BASE = '../tanuki_valuation/';
const H_BASE = '../hypecore/data/';
const E_PATH = '../adjusted_eps_analyzer/data/summary.json';
const M_PATH = '../../market-monitor/market-pulse/data/market_data.json';

// ─── Scoring ─────────────────────────────────────────────────
function calcFunda(revYoy, rule40, epsYoyPct, fcfBase) {
  let s = 0;
  s += revYoy    == null ? 0 : revYoy    > 20 ? 25 : revYoy    >= 0 ? 15 : 0;
  s += rule40    == null ? 0 : rule40    > 40 ? 25 : rule40    >= 20 ? 15 : 0;
  s += epsYoyPct == null ? 0 : epsYoyPct > 20 ? 25 : epsYoyPct >= 0 ? 15 : 0;
  s += fcfBase   == null ? 0 : fcfBase   > 0  ? 25 : 0;
  return s;
}

function calcTiming(upside, fg, stage) {
  let s = 0;
  s += upside == null ? 0 : upside > 30 ? 40 : upside >= 10 ? 25 : upside >= 0 ? 10 : 0;
  s += fg < 30 ? 40 : fg < 50 ? 25 : fg < 70 ? 10 : 0;
  s += stage == null ? 0 : stage === 1 ? 20 : stage === 2 ? 15 : stage === 3 ? 5 : 0;
  return s;
}

function classify(f, t, stock) {
  const upside  = stock.upside  ?? null;
  const stage   = stock.stage   ?? 0;
  const revYoy  = stock.revYoy  ?? 0;
  const rule40  = stock.rule40  ?? 0;
  const ma200   = stock.ma200   ?? 0;
  const fcfBase = stock.fcfBase ?? null;
  const fcfEst  = stock.fcfEst  ?? null;

  if (f < 25) return 'PASS';

  const sellFunda = revYoy < 0 && rule40 < 20 && (
    fcfBase < 0 || (fcfEst != null && fcfBase != null && fcfEst < fcfBase * 0.8)
  );
  const sellTech = stage >= 4 && upside != null && upside < -20 && ma200 < -10 && f < 50;
  if (f >= 25 && (sellFunda || sellTech)) return 'SELL';

  if (f >= 50) {
    if (upside != null && upside < -30 && stage >= 3) return 'TRIM';
    if (upside != null && upside > 20 && t >= 50)     return 'BUY';
    if (upside != null && upside > 0)                  return 'WATCH';
    return 'HOLD';
  }

  return 'HOLD';
}

// ─── Display helpers ─────────────────────────────────────────
function scClass(v) {
  return v >= 75 ? 'sc-hi' : v >= 50 ? 'sc-mid' : v >= 25 ? 'sc-lo' : 'sc-no';
}
function pct(v, dec = 1) {
  if (v == null) return '<span class="neu">—</span>';
  const s = (v >= 0 ? '+' : '') + v.toFixed(dec) + '%';
  return `<span class="${v >= 0 ? 'pos' : 'neg'}">${s}</span>`;
}
function mktMessage(fg) {
  if (fg < 30) return '🔴 極度の恐怖 — 歴史的な仕込み場。全ての仕込み時銘柄を検討';
  if (fg < 50) return '🟠 恐怖 — 仕込み時銘柄への打診買いチャンス';
  if (fg < 70) return '🟡 中立 — 仕込み待ち銘柄の監視継続。急がない';
  return '🟢 強欲 — 利確検討銘柄の整理タイミング';
}

const CAT_META = {
  BUY:  { label:'BUY',  icon:'🟢', color:'#22c55e', cls:'buy',       badge:'badge-BUY',   desc:'ファンダ≥50 · 割安(>20%) · タイミング≥50 — 今仕込んでもよい' },
  WATCH:{ label:'WATCH',icon:'🟡', color:'#eab308', cls:'watch-cat', badge:'badge-WATCH',  desc:'ファンダ≥50 · 割安(0-20%) — 購入候補ウォッチリスト' },
  HOLD: { label:'HOLD', icon:'🔵', color:'#3b82f6', cls:'hold',      badge:'badge-HOLD',   desc:'ファンダ良好 · 許容範囲内 — 保有継続・新規不要' },
  TRIM: { label:'TRIM', icon:'🟠', color:'#f97316', cls:'trim',      badge:'badge-TRIM',   desc:'ファンダ良好 · 割高(-30%超) · 陶酔期以降 — 一部利確検討' },
  SELL: { label:'SELL', icon:'🔴', color:'#ef4444', cls:'sell',      badge:'badge-SELL',   desc:'ファンダ劣化 または 長期下落トレンド — 保有再考' },
  PASS: { label:'PASS', icon:'⬛', color:'#475569', cls:'pass',      badge:'badge-PASS',   desc:'ファンダ<25 — 対象外' },
};

// ─── Sortable table state ─────────────────────────────────────
let _stocks  = [];
let _sortCol = 'funda';
let _sortDir = -1;

function sortAndRender(col) {
  if (_sortCol === col) _sortDir = -_sortDir;
  else { _sortCol = col; _sortDir = -1; }
  renderDetailTable();
}

const COL_KEYS = ['ticker','cat','funda','timing','revYoy','rule40','epsYoy','fcf','upside','stage'];

// ─── Render ③ Detail table ───────────────────────────────────
function renderDetailTable() {
  const sorted = [..._stocks].sort((a, b) => {
    const av = a[_sortCol], bv = b[_sortCol];
    if (av == null && bv == null) return 0;
    if (av == null) return 1; if (bv == null) return -1;
    return _sortDir * (typeof av === 'string' ? av.localeCompare(bv) : av - bv);
  });

  const stageLabel = (s, lbl) => {
    if (s == null) return '<span class="neu">—</span>';
    const cls = `s${s}`;
    return `<span class="${cls}" style="font-family:var(--mono);font-size:12px">${lbl || ['','蓄積期','上昇期','陶酔期','崩壊期'][s] || '—'}</span>`;
  };

  const thArr = (col, label) => {
    const isSorted = _sortCol === col;
    const arr = isSorted ? (_sortDir === -1 ? '▼' : '▲') : '';
    return `<th class="${isSorted ? 'sorted' : ''}" onclick="sortAndRender('${col}')">${label}${arr ? `<span class="sort-arr">${arr}</span>` : ''}</th>`;
  };

  const tbody = sorted.map(s => {
    const m = CAT_META[s.cat];
    const fcfDisp = s.fcf == null ? '<span class="neu">—</span>'
                  : s.fcf > 0    ? '<span class="fcf-ok" style="font-family:var(--mono)">✓</span>'
                                 : '<span class="fcf-ng" style="font-family:var(--mono)">✗</span>';
    return `<tr>
      <td><a class="tkr-a" href="${T_BASE}stock.html?ticker=${s.ticker}">${s.ticker}</a></td>
      <td><span class="cat-badge ${m.badge}">${m.icon} ${m.label}</span></td>
      <td class="sc-num ${scClass(s.funda)}">${s.funda}</td>
      <td class="sc-num ${scClass(s.timing)}">${s.timing}</td>
      <td class="num">${pct(s.revYoy)}</td>
      <td class="num"><span class="${s.rule40 == null ? 'neu' : s.rule40 > 40 ? 'pos' : s.rule40 >= 20 ? 'neu' : 'neg'}" style="font-family:var(--mono)">${s.rule40 != null ? s.rule40.toFixed(1) : '—'}</span></td>
      <td class="num">${pct(s.epsYoy)}</td>
      <td style="text-align:center">${fcfDisp}</td>
      <td class="num">${pct(s.upside)}</td>
      <td>${stageLabel(s.stage, s.stageL)}</td>
    </tr>`;
  }).join('');

  document.getElementById('detail-tbl').innerHTML = `
    <div class="sec">③ 全銘柄詳細 — ヘッダークリックでソート</div>
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead><tr>
          ${thArr('ticker','銘柄')}
          ${thArr('cat','分類')}
          ${thArr('funda','ファンダ')}
          ${thArr('timing','タイミング')}
          ${thArr('revYoy','売上成長')}
          ${thArr('rule40','Rule40')}
          ${thArr('epsYoy','EPS成長')}
          <th>FCF</th>
          ${thArr('upside','TANUKI乖離')}
          ${thArr('stage','フェーズ')}
        </tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
    <div class="tbl-note">
      ファンダ/タイミング: 0–100pt · 🟢75+ 🟡50+ ⚪25+ · 売上成長/EPS成長/TANUKI乖離は最新期
    </div>`;
}

(async function () {

  // 1. Market data
  let mkt = null;
  try {
    const r = await fetch(M_PATH + TS);
    if (r.ok) { const arr = await r.json(); mkt = arr[arr.length - 1]; }
  } catch (_) {}

  const fg      = mkt?.fear_greed?.score             ?? 50;
  const vix     = mkt?.indicators?.['VIX指数']?.value ?? 20;
  const riskOff = mkt?.credit?.risk_off_score         ?? 50;
  const mktDate = (mkt?.date ?? '').slice(0, 10);
  document.getElementById('last-updated').textContent = toJST(mkt?.date ?? '');

  // ① Market summary
  document.getElementById('mkt-summary').innerHTML = `
    <div class="sec">① 市場の今 <span style="font-size:10px;color:var(--mut);margin-left:4px">${mktDate}</span></div>
    <div class="mkt-bar">
      <div class="mkt-phase">${mktMessage(fg)}</div>
      <div class="mkt-stats">
        <div class="mkt-stat">FG <strong style="color:${fg<30?'var(--red)':fg<50?'var(--amb)':fg<70?'var(--sub)':'var(--grn)'}">${fg.toFixed(0)}</strong></div>
        <div class="mkt-stat">VIX <strong style="color:${vix>35?'var(--red)':vix>25?'var(--amb)':vix>20?'var(--sub)':'var(--grn)'}">${vix.toFixed(1)}</strong></div>
        <div class="mkt-stat">Risk-Off <strong style="color:${riskOff>=67?'var(--red)':riskOff>=40?'var(--amb)':'var(--grn)'}">${riskOff}</strong></div>
      </div>
    </div>`;

  // 2. Tickers
  let tickers = [];
  try {
    const r = await fetch(T_BASE + 'data/tickers.json' + TS);
    if (r.ok) { const d = await r.json(); tickers = d.tickers || []; }
  } catch (_) {}

  // 3. Per-ticker data (parallel)
  const [tanukiMap, hypeMap, epsMap] = await Promise.all([

    Promise.allSettled(tickers.map(async tk => {
      try {
        const r = await fetch(`${T_BASE}data/${tk}/latest.json${TS}`);
        if (r.ok) return [tk, await r.json()];
      } catch (_) {}
      return [tk, null];
    })).then(rs => Object.fromEntries(rs.map(r => r.value ?? [null,null]).filter(([k])=>k))),

    Promise.allSettled(tickers.map(async tk => {
      try {
        const r = await fetch(`${H_BASE}${tk}_poc.json${TS}`);
        if (r.ok) return [tk, await r.json()];
      } catch (_) {}
      return [tk, null];
    })).then(rs => Object.fromEntries(rs.map(r => r.value ?? [null,null]).filter(([k])=>k))),

    fetch(E_PATH + TS)
      .then(r => r.ok ? r.json() : {tickers:[]})
      .then(d => Object.fromEntries((d.tickers||[]).map(t=>[t.ticker,t])))
      .catch(()=>({}))
  ]);

  // 4. Build stocks array
  _stocks = tickers.map(ticker => {
    const tk = tanukiMap[ticker];
    const hc = hypeMap[ticker];
    const ep = epsMap[ticker];

    const lastMo  = hc?.monthly?.[hc.monthly.length - 1] ?? null;
    const revYoy  = lastMo?.rev_yoy    ?? null;
    const rule40  = lastMo?.rule40     ?? null;
    const stage   = lastMo?.stage      ?? null;
    const stageL  = lastMo?.stage_label ?? null;
    const upside  = tk?.upside_percent ?? null;
    const fcfBase = tk?.fcf_base?.base_fcf ?? null;
    const rawUp   = tk?.upside_percent ?? null;
    const epsYoyDec = ep?.yoy_growth ?? null;
    const epsYoy  = epsYoyDec != null ? epsYoyDec * 100 : null;

    const ma200      = lastMo?.ma200_dev ?? 0;
    const fcfEst     = tk?.fcf_estimation?.estimated_fcf ?? null;
    const substage   = lastMo?.substage_label ?? '';
    const stageLabel = lastMo?.stage_label ?? '';

    const funda  = calcFunda(revYoy, rule40, epsYoy, fcfBase);
    const timing = calcTiming(rawUp, fg, stage);

    const stockObj = {
      upside: rawUp, stage: stage ?? 0, revYoy: revYoy ?? 0, rule40: rule40 ?? 0,
      ma200, fcfBase, fcfEst,
    };
    const cat = classify(funda, timing, stockObj);

    let sellReason = '';
    if (cat === 'SELL') {
      const _sellFunda = (revYoy ?? 0) < 0 && (rule40 ?? 0) < 20 && (
        fcfBase < 0 || (fcfEst != null && fcfBase != null && fcfEst < fcfBase * 0.8)
      );
      sellReason = _sellFunda ? 'funda' : 'tech';
    }

    const riceAvailable = tk?.rice?.available ?? false;
    const riceNote      = tk?.rice?.note ?? '';
    const riceVal       = tk?.rice?.base?.rice ?? null;
    const roe           = tk?.components?.roe_10yr_avg ?? null;
    let fcfMgn = tk?.fcf_estimation?.fcf_margin ?? null;
    if (fcfMgn === null) {
      const fcfBU  = tk?.components?.fcf_base_used ?? null;
      const latRev = tk?.components?.latest_revenue ?? null;
      if (fcfBU !== null && latRev !== null && latRev !== 0) fcfMgn = fcfBU / latRev * 100;
    }

    const per = tk?.components?.per ?? null;
    const peg = tk?.components?.peg ?? null;
    const ps  = tk?.components?.ps  ?? null;

    return { ticker, cat, funda, timing, revYoy, rule40, epsYoy, fcf: fcfBase,
             upside: rawUp, stage, stageL: stageLabel, substage, stageLabel, sellReason,
             riceAvailable, riceNote, riceVal, roe, fcfMgn, per, peg, ps };
  });

  // 5. Categorize
  const cats = { BUY:[], WATCH:[], HOLD:[], TRIM:[], SELL:[], PASS:[] };
  _stocks.forEach(s => (cats[s.cat] || []).push(s));

  Object.keys(cats).forEach(k => {
    if (k === 'WATCH') {
      cats[k].sort((a, b) => {
        const aBot = (a.substage || '').includes('底') ? 0 : 1;
        const bBot = (b.substage || '').includes('底') ? 0 : 1;
        return aBot !== bBot ? aBot - bBot : b.funda - a.funda;
      });
    } else {
      cats[k].sort((a, b) => b.funda - a.funda);
    }
  });

  // ② Category board
  function matrixBadge(s) {
    const up = s.upside;
    if (up === null) return '';
    let prefix, qx, qy, yHigh, yLow;
    if (s.riceAvailable) {
      prefix = '①'; qx = up >= 0; qy = s.riceVal !== null && s.riceVal >= 2;
      yHigh = '高効率'; yLow = '低効率';
    } else if (s.riceNote.includes('セクター除外')) {
      prefix = '②'; qx = up >= 0; qy = s.roe !== null && s.roe * 100 >= 15;
      yHigh = '高ROE'; yLow = '低ROE';
    } else {
      prefix = '④'; qx = up >= 0; qy = s.fcfMgn !== null && s.fcfMgn >= 15;
      yHigh = '高FCF'; yLow = '低FCF';
    }
    const xL = qx ? '割安' : '割高';
    const yL = qy ? yHigh : yLow;
    let bg, fg;
    if      ( qx &&  qy) { bg = '#14532d'; fg = '#4ade80'; }
    else if (!qx &&  qy) { bg = '#713f12'; fg = '#facc15'; }
    else if ( qx && !qy) { bg = '#1e293b'; fg = '#94a3b8'; }
    else                 { bg = '#450a0a'; fg = '#f87171'; }
    return `<span style="background:${bg};color:${fg};font-family:monospace;font-size:10px;padding:2px 6px;border-radius:3px;display:inline-block;margin-top:3px;line-height:1.4">${prefix} ${xL}×${yL}</span>`;
  }

  function multBadge(s) {
    const parts = [];
    if (s.per != null) parts.push(`PER ${s.per.toFixed(1)}x`);
    if (s.peg != null) {
      const pegCol = s.peg < 1 ? '#4ade80' : s.peg > 2 ? '#f87171' : '#94a3b8';
      parts.push(`<span style="color:${pegCol}">PEG ${s.peg.toFixed(2)}</span>`);
    }
    if (s.ps != null) {
      const psCol = s.ps > 20 ? '#f87171' : '#94a3b8';
      parts.push(`<span style="color:${psCol}">PS ${s.ps.toFixed(1)}x</span>`);
    }
    if (!parts.length) return '';
    return `<span class="chip-tags" title="市場提供値（yfinance）">${parts.join(' ｜ ')}</span>`;
  }

  function chipTag(key, s) {
    if (key === 'WATCH' && s.upside != null && s.upside > 0) {
      const sub = s.substage ? ' ' + s.substage : '';
      return `<span class="chip-tags">割安+${s.upside.toFixed(0)}%${sub}</span>`;
    }
    if (key === 'TRIM' && s.upside != null) {
      return `<span class="chip-tags">割高${s.upside.toFixed(0)}% · ${s.stageLabel || ''}</span>`;
    }
    if (key === 'SELL') {
      return `<span class="chip-tags">${s.sellReason === 'funda' ? '売上鈍化·FCF悪化' : '長期下落·期待剥落'}</span>`;
    }
    return '';
  }

  function catCard(key, stocks) {
    const m = CAT_META[key];
    const chips = stocks.length === 0
      ? '<span class="cat-empty">銘柄なし</span>'
      : stocks.map(s => `<a class="cat-chip" href="${T_BASE}stock.html?ticker=${s.ticker}">
          <span class="ckr">${s.ticker}</span>
          <span class="csc">F:${s.funda} · T:${s.timing}</span>
          ${chipTag(key, s)}
          ${matrixBadge(s)}
          ${multBadge(s)}
        </a>`).join('');
    return `<div class="cat-card ${m.cls}">
      <div class="cat-head">
        <span class="cat-label">${m.icon} ${m.label}</span>
        <span class="cat-count">${stocks.length}銘柄</span>
      </div>
      <div class="cat-desc">${m.desc}</div>
      <div class="cat-chips">${chips}</div>
    </div>`;
  }

  function collapsedCard(key, stocks) {
    const m   = CAT_META[key];
    const id  = key.toLowerCase();
    const chips = stocks.length === 0
      ? '<span class="cat-empty">銘柄なし</span>'
      : stocks.map(s => `<a class="cat-chip" href="${T_BASE}stock.html?ticker=${s.ticker}">
          <span class="ckr">${s.ticker}</span>
          <span class="csc">F:${s.funda} · T:${s.timing}</span>
          ${chipTag(key, s)}
          ${matrixBadge(s)}
          ${multBadge(s)}
        </a>`).join('');
    return `<div class="cat-card ${m.cls}">
      <div class="cat-head ronogai-toggle" id="${id}-toggle" onclick="toggleCat('${id}')">
        <span class="cat-label">${m.icon} ${m.label}</span>
        <span class="cat-count">${stocks.length}銘柄 <span class="tog-arrow">▼</span></span>
      </div>
      <div class="cat-desc">${m.desc}</div>
      <div id="${id}-body" class="cat-chips" style="display:none">${chips}</div>
    </div>`;
  }

  document.getElementById('cat-board').innerHTML = `
    <div class="sec">② 6分類ボード — ファンダ × タイミング</div>
    <div class="cat-row top3">
      ${catCard('BUY',   cats.BUY)}
      ${catCard('WATCH', cats.WATCH)}
      ${catCard('HOLD',  cats.HOLD)}
    </div>
    <div class="cat-row top3">
      ${catCard('TRIM', cats.TRIM)}
      ${catCard('SELL', cats.SELL)}
      ${catCard('PASS', cats.PASS)}
    </div>`;

  // ③ Detail table
  renderDetailTable();

  // ④ 判定実績バックテスト
  const allEntries = await loadScoreHistory(tickers);
  renderScoreVerify(allEntries);
})();

function toggleCat(id) {
  const body   = document.getElementById(id + '-body');
  const toggle = document.getElementById(id + '-toggle');
  if (!body) return;
  const open = body.style.display !== 'none' && body.style.display !== '';
  body.style.display = open ? 'none' : 'flex';
  if (toggle) toggle.classList.toggle('open', !open);
}

function toJST(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr.slice(0, 10);
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

// ─── ④ 判定実績バックテスト ──────────────────────────────────
async function loadScoreHistory(tickers) {
  const all = await Promise.all(
    tickers.map(async ticker => {
      try {
        const res = await fetch(`${T_BASE}data/${ticker}/score_history.json`, { cache: 'no-cache' });
        if (!res.ok) return [];
        const entries = await res.json();
        return entries.map(e => ({ ...e, ticker }));
      } catch { return []; }
    })
  );
  return all.flat();
}

function renderScoreVerify(allEntries) {
  const el = document.getElementById('score-verify-section');
  if (!el) return;
  if (!allEntries.length) {
    el.innerHTML = '<p style="color:var(--mut);text-align:center;padding:40px">データなし（pipeline.py 実行後に表示）</p>';
    return;
  }

  const SCORE_TYPES = ['BUY', 'GROWTH_PREMIUM', 'WATCH', 'HOLD', 'TRIM', 'SELL', 'PASS'];
  const byScore = {};
  for (const e of allEntries) {
    const s = e.tanuki_score;
    if (!s) continue;
    if (!byScore[s]) byScore[s] = { total: 0, win30: 0, n30: 0, win60: 0, n60: 0, ret30s: [] };
    const b = byScore[s];
    b.total++;
    if (e.return_30d != null) { b.n30++; if (e.return_30d > 0) b.win30++; b.ret30s.push(e.return_30d); }
    if (e.return_60d != null) { b.n60++; if (e.return_60d > 0) b.win60++; }
  }

  const badgeCls = s => `sv-badge sv-${(s||'').toLowerCase().replace('_premium','-premium').replace('_','-')}`;

  const winRows = SCORE_TYPES.filter(s => byScore[s]).map(s => {
    const b = byScore[s];
    const w30 = b.n30 > 0 ? `${(b.win30/b.n30*100).toFixed(0)}% <span style="color:var(--mut)">(${b.n30}件)</span>` : '—';
    const w60 = b.n60 > 0 ? `${(b.win60/b.n60*100).toFixed(0)}% <span style="color:var(--mut)">(${b.n60}件)</span>` : '—';
    const avg30 = b.ret30s.length > 0 ? b.ret30s.reduce((a,c) => a+c, 0) / b.ret30s.length : null;
    const avg30Str = avg30 != null ? `<span style="color:${avg30>=0?'var(--grn)':'var(--red)'}">${avg30>=0?'+':''}${avg30.toFixed(1)}%</span>` : '—';
    return `<tr>
      <td><span class="${badgeCls(s)}">${s}</span></td>
      <td style="font-family:var(--mono)">${b.total}</td>
      <td style="font-family:var(--mono)">${w30}</td>
      <td style="font-family:var(--mono)">${w60}</td>
      <td style="font-family:var(--mono)">${avg30Str}</td>
    </tr>`;
  }).join('');

  const fmtR = r => r != null
    ? `<span style="color:${r>=0?'var(--grn)':'var(--red)'}">${r>=0?'+':''}${r.toFixed(1)}%</span>`
    : '<span style="color:var(--mut)">—</span>';

  const recentRows = [...allEntries]
    .filter(e => e.date && e.tanuki_score)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 20)
    .map(e => `<tr>
      <td style="font-family:var(--mono);font-weight:700"><a href="${T_BASE}stock.html?ticker=${e.ticker}" style="color:var(--txt);text-decoration:none">${e.ticker}</a></td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--mut)">${e.date}</td>
      <td><span class="${badgeCls(e.tanuki_score)}">${e.tanuki_score}</span></td>
      <td style="font-family:var(--mono);font-size:12px">${e.price_at_judgment != null ? '$'+e.price_at_judgment.toFixed(2) : '—'}</td>
      <td style="font-family:var(--mono);font-size:12px">${fmtR(e.return_30d)}</td>
      <td style="font-family:var(--mono);font-size:12px">${fmtR(e.return_60d)}</td>
    </tr>`)
    .join('');

  const noData = `<tr><td colspan="99" style="text-align:center;color:var(--mut);padding:16px">データなし（pipeline.py 実行後に表示）</td></tr>`;

  el.innerHTML = `
    <h2 class="section-title">④ 判定実績 — TANUKI SCORE バックテスト</h2>
    <div class="sv-card">
      <div class="sv-subtitle">判定時株価とN日後株価を比較した事後検証。<code>score_verifier.py</code>を定期実行することでリターンが蓄積される。</div>
