<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EXTREME FEAR — 買付支援</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <link rel="stylesheet" href="../../common/site-theme.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh;line-height:1.6}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:999}

    .shell{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
    .sec{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--txt);margin:28px 0 14px;display:flex;align-items:center;gap:10px}
    .sec::after{content:'';flex:1;height:1px;background:var(--bdr)}
    .card{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:20px}

    /* ── ① 候補テーブル ── */
    .cand-wrap{overflow-x:auto}
    .cand-table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
    .cand-table thead th{background:var(--sur2);padding:8px 12px;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);border-bottom:1px solid var(--bdr);white-space:nowrap}
    .cand-table thead th.num{text-align:right}
    .cand-table tbody tr{border-bottom:1px solid rgba(30,40,64,.5)}
    .cand-table tbody tr:last-child{border-bottom:none}
    .cand-table tbody tr:hover{background:var(--sur2)}
    .cand-table td{padding:8px 12px;vertical-align:middle}
    .cand-table td.num{text-align:right;font-family:var(--mono);font-size:12px}
    .score-bar-bg{display:inline-block;vertical-align:middle;width:60px;height:5px;background:var(--sur2);border-radius:3px;margin-left:6px}
    .score-bar-fill{height:100%;border-radius:3px;background:var(--acc)}
    .ts-badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid;white-space:nowrap}
    .ts-buy{background:rgba(16,185,129,.15);color:#10b981;border-color:rgba(16,185,129,.3)}
    .ts-gp{background:rgba(16,185,129,.08);color:#10b981;border-color:rgba(16,185,129,.2)}
    .ts-watch{background:rgba(59,130,246,.12);color:#3b82f6;border-color:rgba(59,130,246,.3)}
    .phase-badge{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid}

    /* ── ④ シミュレーター ── */
    .sim-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .sim-label{font-family:var(--mono);font-size:13px;color:var(--mut)}
    .sim-input{background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);font-family:var(--mono);font-size:16px;padding:8px 14px;border-radius:4px;width:180px;outline:none;-moz-appearance:textfield}
    .sim-input::-webkit-outer-spin-button,.sim-input::-webkit-inner-spin-button{-webkit-appearance:none}
    .sim-input:focus{border-color:var(--acc)}
    .sim-wrap{overflow-x:auto}
    .sim-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
    .sim-table thead th{background:var(--sur2);padding:8px 12px;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);border-bottom:1px solid var(--bdr)}
    .sim-table thead th.num{text-align:right}
    .sim-table tbody tr{border-bottom:1px solid rgba(30,40,64,.5)}
    .sim-table tbody tr:last-child{border-bottom:none}
    .sim-table tbody tr:hover{background:var(--sur2)}
    .sim-table td{padding:8px 12px}
    .sim-table td.num{text-align:right;font-family:var(--mono);font-size:12px}
    .alloc-bar-bg{display:inline-block;width:50px;height:4px;background:var(--sur2);border-radius:2px;vertical-align:middle;margin-left:6px}
    .alloc-bar-fill{height:100%;border-radius:2px;background:var(--grn)}

    /* ── ③ 過去EF ── */
    .ef-hist-wrap{overflow-x:auto}
    .ef-hist-table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
    .ef-hist-table thead th{background:var(--sur2);padding:7px 12px;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);border-bottom:1px solid var(--bdr)}
    .ef-hist-table tbody tr{border-bottom:1px solid rgba(30,40,64,.5)}
    .ef-hist-table tbody tr:last-child{border-bottom:none}
    .ef-hist-table tbody tr:hover{background:var(--sur2)}
    .ef-hist-table td{padding:7px 12px;font-family:var(--mono);font-size:12px}

    /* ── ⑤ メモ ── */
    .memo-area{width:100%;min-height:130px;background:var(--sur2);border:1px solid var(--bdr);border-radius:4px;color:var(--txt);font-family:var(--sans);font-size:13px;padding:12px;resize:vertical;outline:none;line-height:1.75}
    .memo-area:focus{border-color:var(--acc)}
    .memo-hint{font-size:11px;color:var(--mut);margin-top:6px}

    footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--bdr);text-align:center;font-size:11px;color:var(--mut)}
    footer a{color:var(--acc);text-decoration:none}

    @media(max-width:700px){.fg-row{flex-direction:column}.fg-gauge-wrap{margin:0 auto}}
  </style>
</head>
<body data-tool="ef">
<header>
  <a class="logo"></a>
  <nav class="nav-links"></nav>
</header>

<div class="shell">

  <!-- ① 買い候補 TOP10 -->
  <div class="sec">① 買い候補 — TANUKI スコアリング TOP10</div>
  <div class="card" id="candidates-card"><div style="color:var(--mut)">読み込み中...</div></div>

  <!-- ② シミュレーター -->
  <div class="sec">② 投入額シミュレーター</div>
  <div class="card" id="simulator-card"><div style="color:var(--mut)">読み込み中...</div></div>

  <!-- ③ 過去のExtreme Fear -->
  <div class="sec">③ 過去の Extreme Fear 買い場（F&amp;G &le; 20）</div>
  <div class="card" id="past-ef-card"><div style="color:var(--mut)">読み込み中...</div></div>

  <!-- ④ 買い付け方針メモ -->
  <div class="sec">④ 買い付け方針メモ</div>
  <div class="card">
    <textarea class="memo-area" id="memo-area"
      placeholder="今回の買い付け方針を自由に記述...&#10;例: NVDAを100株・METAを50株、VIX>30の時点でナンピン予定"></textarea>
    <div class="memo-hint">自動保存（localStorage）— ページを再読み込みしても前回の内容が復元されます</div>
  </div>

  <footer>
    <p>EXTREME FEAR | Part of <a href="/On-a-journey/">ON A JOURNEY</a> Investment Suite</p>
    <p style="margin-top:4px">データ: Market Pulse (CNN F&amp;G) + TANUKI VALUATION</p>
  </footer>
</div>

<script>
// ── パス定数 ──
const FG_URL      = '../../market-monitor/market-pulse/data/market_data.json';
const TICKERS_URL = '../tanuki_valuation/data/tickers.json';
const LATEST      = t => `../tanuki_valuation/data/${t}/latest.json`;

// ── カラー/ラベル ──
function fgColor(s) {
  if (s <= 20) return '#f43f5e';
  if (s <= 40) return '#f97316';
  if (s <= 60) return '#f59e0b';
  if (s <= 80) return '#10b981';
  return '#3b82f6';
}
function phaseColor(p) {
  if (p == null) return 'var(--mut)';
  if (p <= 2) return 'var(--grn)';
  if (p === 3) return 'var(--amb)';
  return 'var(--red)';
}
function fmtUSD(n) {
  if (n == null) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ── スコアリング ──
function calcScore(d) {
  const ts = d.tanuki_score;
  if (ts !== 'BUY' && ts !== 'GROWTH_PREMIUM' && ts !== 'WATCH') return null;
  let score = 0;
  if (ts === 'BUY' || ts === 'GROWTH_PREMIUM') score += 40;
  else score += 20; // WATCH
  const upside = d.upside_percent ?? 0;
  if (upside >= 30) score += Math.min(upside / 100 * 30, 30);
  if ((d.funda_score ?? 0) >= 60) score += 20;
  const phase = (d.growth_sanity ?? {}).hype_phase_used ?? null;
  if (phase != null && phase <= 2) score += 10;
  if (phase === 4) score -= 20;
  return score;
}

function tsBadge(ts) {
  if (ts === 'BUY')            return `<span class="ts-badge ts-buy">BUY</span>`;
  if (ts === 'GROWTH_PREMIUM') return `<span class="ts-badge ts-gp">G.PREMIUM</span>`;
  if (ts === 'WATCH')          return `<span class="ts-badge ts-watch">WATCH</span>`;
  return `<span class="ts-badge" style="color:var(--mut);border-color:var(--bdr)">${ts||'—'}</span>`;
}

// ── 状態 ──
let fgHistory  = [];
let candidates = []; // {ticker, data, score}

// ── ① 候補テーブル ──
function renderCandidates() {
  const el = document.getElementById('candidates-card');
  if (!candidates.length) {
    el.innerHTML = '<div style="color:var(--mut)">BUY / WATCH 銘柄なし</div>';
    return;
  }
  const maxScore = Math.max(...candidates.map(c => c.score), 1);
  const rows = candidates.map((c, i) => {
    const d      = c.data;
    const upside = d.upside_percent;
    const phase  = (d.growth_sanity ?? {}).hype_phase_used;
    const price  = (d.components ?? {}).current_price;
    const uCol   = upside != null ? (upside >= 0 ? 'var(--grn)' : 'var(--red)') : 'var(--mut)';
    const barW   = Math.max(0, Math.round(c.score / maxScore * 100));
    const pCol   = phaseColor(phase);
    return `<tr>
      <td style="font-family:var(--mono);font-weight:700">
        <span style="color:var(--mut);font-size:10px">#${i+1} </span>
        <a href="../tanuki_valuation/stock.html?ticker=${c.ticker}" style="color:var(--txt);text-decoration:none">${c.ticker}</a>
      </td>
      <td>${tsBadge(d.tanuki_score)}</td>
      <td class="num" style="color:${uCol}">${upside != null ? (upside>=0?'+':'')+upside.toFixed(1)+'%' : '—'}</td>
      <td class="num">${d.funda_score != null ? d.funda_score : '—'}</td>
      <td class="num"><span style="color:${pCol}">${phase != null ? 'P'+phase : '—'}</span></td>
      <td class="num">${price != null ? '$'+price.toFixed(2) : '—'}</td>
      <td class="num" style="color:var(--acc);font-weight:700">
        ${c.score.toFixed(0)}
        <span class="score-bar-bg"><span class="score-bar-fill" style="width:${barW}%"></span></span>
      </td>
    </tr>`;
  }).join('');
  el.innerHTML = `
    <div class="cand-wrap">
      <table class="cand-table">
        <thead><tr>
          <th>銘柄</th><th>判定</th>
          <th class="num">乖離率</th><th class="num">Funda</th>
          <th class="num">Phase</th><th class="num">現在株価</th>
          <th class="num">スコア</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--mut);line-height:1.8">
      スコア = BUY/G.PREMIUM +40 / WATCH +20 &nbsp;|&nbsp;
      乖離率≥30%（比例+最大30）&nbsp;|&nbsp;
      Funda≥60 +20 &nbsp;|&nbsp;
      Phase≤2 +10ボーナス / Phase4 −20ペナルティ
    </div>`;
}

// ── ④ シミュレーター ──
let simAmount = 0;

function renderSimulator(amount) {
  simAmount = amount;
  const el = document.getElementById('simulator-card');
  const inputHTML = `
    <div class="sim-top">
      <span class="sim-label">総投資額</span>
      <input class="sim-input" type="number" id="sim-input" value="${amount > 0 ? amount : ''}" placeholder="10000" min="0" step="500">
      <span class="sim-label">USD</span>
    </div>`;

  const valid = candidates.filter(c => c.score > 0);
  const totalScore = valid.reduce((s, c) => s + c.score, 0);

  let body = '';
  if (amount > 0 && valid.length > 0 && totalScore > 0) {
    const rows = valid.map(c => {
      const alloc  = (c.score / totalScore) * amount;
      const price  = (c.data.components ?? {}).current_price;
      const shares = price > 0 ? Math.floor(alloc / price) : null;
      const pct    = (c.score / totalScore * 100).toFixed(1);
      const barW   = Math.round(c.score / totalScore * 100);
      return `<tr>
        <td style="font-family:var(--mono);font-weight:700">${c.ticker}</td>
        <td>${tsBadge(c.data.tanuki_score)}</td>
        <td class="num">
          ${pct}%
          <span class="alloc-bar-bg"><span class="alloc-bar-fill" style="width:${barW}%"></span></span>
        </td>
        <td class="num" style="color:var(--grn);font-weight:700">${fmtUSD(alloc)}</td>
        <td class="num" style="color:var(--mut)">${price != null ? '$'+price.toFixed(2) : '—'}</td>
        <td class="num" style="color:var(--txt)">${shares != null ? shares.toLocaleString()+'株' : '—'}</td>
      </tr>`;
    }).join('');
    body = `
      <div class="sim-wrap">
        <table class="sim-table">
          <thead><tr>
            <th>銘柄</th><th>判定</th>
            <th class="num">配分比</th>
            <th class="num">投入額（USD）</th>
            <th class="num">現在株価</th>
            <th class="num">購入株数（概算）</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--mut)">
        配分はスコア比例。合計 ${fmtUSD(amount)} を ${valid.length} 銘柄に分散。
        ※株数は端数切り捨て（実際の注文単位に合わせて調整してください）
      </div>`;
  } else if (amount <= 0) {
    body = `<div style="color:var(--mut);font-size:13px;padding:8px 0">総投資額を入力すると、スコア比例で配分を計算します。</div>`;
  } else {
    body = `<div style="color:var(--mut);font-size:13px;padding:8px 0">配分対象の候補なし（スコアが0以下）</div>`;
  }

  el.innerHTML = inputHTML + body;
  el.querySelector('#sim-input').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    renderSimulator(isNaN(v) ? 0 : v);
  });
}

// ── ③ 過去EF ──
function renderPastEF() {
  const el = document.getElementById('past-ef-card');
  const efDays = fgHistory
    .filter(e => (e.fear_greed?.score ?? 99) <= 20)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!efDays.length) {
    el.innerHTML = '<div style="color:var(--mut)">データ期間内に F&G ≤ 20 の記録なし（データは直近60日分）</div>';
    return;
  }

  // 連続日を1イベントとしてグループ化（3日以内の間隔は同一イベント）
  const events = [];
  let cur = null;
  for (const d of efDays) {
    const ts = new Date(d.date).getTime();
    if (!cur || ts - new Date(cur.endDate).getTime() > 3 * 86400000) {
      cur = { startDate: d.date.slice(0,10), endDate: d.date.slice(0,10), minScore: d.fear_greed.score, count: 1 };
      events.push(cur);
    } else {
      cur.endDate = d.date.slice(0,10);
      cur.minScore = Math.min(cur.minScore, d.fear_greed.score);
      cur.count++;
    }
  }

  const rows = events.map(ev => {
    const dateStr = ev.startDate === ev.endDate ? ev.startDate : `${ev.startDate} 〜 ${ev.endDate}`;
    const col = fgColor(ev.minScore);
    // score_historyの追跡開始: 2026-06-03。過去EFのリターンデータはまだなし
    return `<tr>
      <td>${dateStr}</td>
      <td style="color:${col};font-weight:700">${ev.minScore.toFixed(1)}</td>
      <td style="color:var(--mut)">${ev.count}日間</td>
      <td style="color:var(--mut)">—</td>
      <td style="color:var(--mut)">—</td>
      <td style="color:var(--mut);font-size:11px">追跡開始前（2026-06-03以降に蓄積）</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="ef-hist-wrap">
      <table class="ef-hist-table">
        <thead><tr>
          <th>発生期間</th><th>最低F&Gスコア</th><th>継続日数</th>
          <th>30日後リターン</th><th>60日後リターン</th><th>備考</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--mut);line-height:1.8">
      ※ <code>score_verifier.py</code> を定期実行することで、今後の EF 発生時のリターンが自動蓄積されます。
    </div>`;
}

// ── ④ メモ ──
function initMemo() {
  const el  = document.getElementById('memo-area');
  const KEY = 'ef_buy_memo_v1';
  el.value  = localStorage.getItem(KEY) || '';
  el.addEventListener('input', () => localStorage.setItem(KEY, el.value));
}

// ── メイン ──
async function init() {
  initMemo();

  // 1. F&G データ取得（renderPastEF で使用）
  try {
    const res = await fetch(FG_URL, { cache: 'no-cache' });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        fgHistory = [...data].sort((a, b) => a.date.localeCompare(b.date));
      }
    }
  } catch(e) { console.warn('FG fetch failed:', e); }

  renderPastEF();

  // 2. TANUKI データ取得
  try {
    const tr = await fetch(TICKERS_URL, { cache: 'no-cache' });
    if (!tr.ok) throw new Error('tickers.json fetch failed');
    const tickers = ((await tr.json()).tickers || []);

    const results = await Promise.all(
      tickers.map(async t => {
        try {
          const r = await fetch(LATEST(t), { cache: 'no-cache' });
          return r.ok ? { ticker: t, data: await r.json() } : null;
        } catch { return null; }
      })
    );

    const scored = results
      .filter(Boolean)
      .map(r => { const s = calcScore(r.data); return s !== null ? { ticker: r.ticker, data: r.data, score: s } : null; })
      .filter(Boolean);

    scored.sort((a, b) => b.score - a.score);
    candidates = scored.slice(0, 10);
  } catch(e) { console.warn('TANUKI fetch failed:', e); }

  renderCandidates();
  renderSimulator(0);
}

init();
</script>
  <script src="../../common/site-header.js"></script>
  <script src="../../common/site-nav.js"></script>
</body>
</html>
