<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HypeCore | On a Journey</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14;--sur:#111520;--sur2:#161c2d;--bdr:#1e2840;
  --grn:#10b981;--red:#f43f5e;--amb:#f59e0b;
  --txt:#e2e8f0;--mut:#4a5568;
  --hc:#f59e0b;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
  --s0:#64748b;--s1:#06b6d4;--s2:#3b82f6;--s3:#f97316;--s4:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;min-height:100vh;padding-bottom:80px}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:999}

header{border-bottom:1px solid var(--bdr);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.15em;display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt)}
.logo-dot{width:8px;height:8px;background:var(--hc);border-radius:50%;animation:pdot 2s ease-in-out infinite}
@keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.nav-back{font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none;letter-spacing:.1em;transition:color .2s}
.nav-back:hover{color:var(--txt)}

.shell{max-width:1200px;margin:0 auto;padding:28px 28px 0}

/* HERO */
.hero{padding:24px 0 28px;border-bottom:1px solid var(--bdr);margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.hero-label{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mut);text-transform:uppercase;margin-bottom:10px}
.hero-title{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:.06em}
.hero-title span{color:var(--hc)}
.hero-sub{font-size:14px;color:var(--mut);line-height:1.7;margin-top:8px}
.hero-meta{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;line-height:1.8}

/* TICKER */
.ticker-bar{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.ticker-lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.ticker-btn{font-family:var(--mono);font-size:24px;font-weight:700;padding:9px 22px;border:2px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;transition:all .2s}
.ticker-btn.active,.ticker-btn:hover{border-color:var(--hc);color:var(--hc);background:rgba(245,158,11,.06)}

/* MAIN CARD */
.main-card{border:1px solid var(--bdr);border-left:4px solid;background:var(--sur);margin-bottom:16px}
.main-top{display:grid;grid-template-columns:auto 1fr auto;border-bottom:1px solid var(--bdr)}
.stage-block{padding:24px 32px;border-right:1px solid var(--bdr);display:flex;flex-direction:column;justify-content:center;min-width:220px}
.s-code{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;line-height:1}
.s-desc{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
.rec-block{padding:24px 32px;border-right:1px solid var(--bdr);flex:1;display:flex;flex-direction:column;justify-content:center}
.rec-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.rec-title{font-family:var(--mono);font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px}
.rec-sub{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
.mets{padding:24px 32px;display:flex;gap:36px;align-items:center}
.met{text-align:right}
.mval{font-family:var(--mono);font-size:24px;font-weight:700}
.mlbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin-top:4px}
.reason-bar{padding:14px 32px;background:var(--sur2);display:flex;align-items:flex-start;gap:16px}
.reason-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;white-space:nowrap;margin-top:3px;min-width:64px}
.reason-txt{font-family:var(--mono);font-size:13px;color:var(--txt);line-height:1.8}
.reason-txt strong{font-weight:700}
.warn{color:var(--amb)}

/* STAGE LEGEND */
.stage-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;padding:16px 22px;background:var(--sur);border:1px solid var(--bdr)}
.s-pill{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;padding:6px 14px;border:1px solid;white-space:nowrap}

/* TRANSITION (compact) */
.bottom-row{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-bottom:16px;align-items:start}
.trans-card{border:1px solid var(--bdr);background:var(--sur);padding:18px 22px}
.trans-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-bottom:14px}
.trans-list{display:flex;flex-direction:column;gap:8px}
.trans-row{display:flex;align-items:center;gap:10px}
.trans-name{font-family:var(--mono);font-size:13px;font-weight:700;width:130px;white-space:nowrap}
.trans-bar{flex:1;background:rgba(255,255,255,.05);border-radius:2px;height:16px;overflow:hidden}
.trans-fill{height:100%;border-radius:2px}
.trans-pct{font-family:var(--mono);font-size:14px;font-weight:700;width:36px;text-align:right}

/* CHARTS STACK */
.charts-stack{display:flex;flex-direction:column;gap:0;border:1px solid var(--bdr);background:var(--bdr)}
.chart-row{background:var(--sur);padding:0}
.chart-header{padding:16px 24px 0;display:flex;align-items:center;justify-content:space-between}
.chart-title{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.chart-note{font-family:var(--mono);font-size:10px;color:var(--mut)}
.chart-wrap{position:relative;padding:8px 24px 16px}

/* TABLE */
.table-card{border:1px solid var(--bdr);background:var(--sur);margin-top:16px}
.table-hdr{padding:14px 22px;border-bottom:1px solid var(--bdr);font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:11px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--bdr);background:var(--sur2);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03);font-size:14px;vertical-align:middle}
.tbl tr:hover td{background:var(--sur2)}
.tbl tr.now-row td{background:rgba(245,158,11,.04)}
.s-badge{display:inline-block;padding:4px 10px;font-family:var(--mono);font-size:11px;font-weight:700;border:1px solid;letter-spacing:.06em;white-space:nowrap}
.pos{color:var(--grn)}.neg{color:var(--red)}
.mono{font-family:var(--mono)}
.now-tag{font-family:var(--mono);font-size:10px;color:var(--hc);letter-spacing:.08em;margin-left:8px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/On-a-journey/"><div class="logo-dot"></div>ON A JOURNEY</a>
  <a class="nav-back" href="/On-a-journey/">← TOP</a>
</header>

<div class="shell">
  <div class="hero">
    <div>
      <div class="hero-label">Hype Cycle Stage Analyzer</div>
      <div class="hero-title">HYPE<span>CORE</span></div>
      <div class="hero-sub">個別銘柄のハイプサイクル上の現在位置を可視化。期待と実体の乖離からステージを自動判定。</div>
    </div>
    <div class="hero-meta"><div>PoC v0.3</div><div id="tsEl">—</div></div>
  </div>

  <div class="ticker-bar">
    <span class="ticker-lbl">Ticker</span>
    <button class="ticker-btn active" onclick="loadTicker('PLTR',this)">PLTR</button>
  </div>

  <!-- MAIN CARD -->
  <div class="main-card" id="mainCard">
    <div class="main-top">
      <div class="stage-block">
        <div class="s-code" id="stageCode">—</div>
        <div class="s-desc" id="stageDesc">—</div>
      </div>
      <div class="rec-block" id="recBlock">
        <div class="rec-lbl">HypeCore 推奨</div>
        <div class="rec-title" id="recTitle">—</div>
        <div class="rec-sub" id="recSub">—</div>
      </div>
      <div class="mets" id="mets"></div>
    </div>
    <div class="reason-bar">
      <span class="reason-lbl">判定理由</span>
      <div class="reason-txt" id="reasonTxt">—</div>
    </div>
  </div>

  <!-- STAGE LEGEND -->
  <div class="stage-legend" id="stageLegend"></div>

  <!-- TRANSITION (compact) + placeholder -->
  <div class="bottom-row">
    <div class="trans-card">
      <div class="trans-lbl">1ヶ月後の遷移確率</div>
      <div class="trans-list" id="transList"></div>
    </div>
    <div style="background:var(--sur);border:1px solid var(--bdr);padding:18px 22px;display:flex;align-items:center;justify-content:center">
      <span style="font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em">カタリスト表示エリア（Phase 2）</span>
    </div>
  </div>

  <!-- 3チャート縦積み（同一時間軸） -->
  <div class="charts-stack">
    <!-- 株価 -->
    <div class="chart-row">
      <div class="chart-header">
        <span class="chart-title">株価推移 × ステージ</span>
        <span class="chart-note" id="nowLabel">▼ 現在位置</span>
      </div>
      <div class="chart-wrap" style="height:260px"><canvas id="priceChart"></canvas></div>
    </div>
    <!-- 期待・モメンタム -->
    <div class="chart-row" style="border-top:1px solid var(--bdr)">
      <div class="chart-header">
        <span class="chart-title">期待・モメンタム（MA200乖離 / RSI）</span>
        <span class="chart-note">期待過熱↑ / 期待剥落↓</span>
      </div>
      <div class="chart-wrap" style="height:160px"><canvas id="expectChart"></canvas></div>
    </div>
    <!-- 実体 -->
    <div class="chart-row" style="border-top:1px solid var(--bdr)">
      <div class="chart-header">
        <span class="chart-title">実体（売上成長 YoY）</span>
        <span class="chart-note">四半期ベース</span>
      </div>
      <div class="chart-wrap" style="height:140px"><canvas id="fundChart"></canvas></div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-hdr">月次詳細データ（新しい順）</div>
    <table class="tbl">
      <thead><tr>
        <th>月</th><th>ステージ</th><th>推奨</th>
        <th>MA200乖離</th><th>高値比</th><th>RSI</th><th>株価</th><th>判断根拠</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const STAGES={
  0:{n:'失望/蓄積期', d:'Trough of Disillusionment｜期待剥落完了・底値形成中', h:'#64748b'},
  1:{n:'期待覚醒期',  d:'Trigger / Early Recovery｜改善兆候＋価格反応開始',    h:'#06b6d4'},
  2:{n:'期待拡大期',  d:'Inflated Expectations（上昇中）｜マルチプル拡大局面', h:'#3b82f6'},
  3:{n:'陶酔期',      d:'Peak of Inflated Expectations｜期待が実体を超過',     h:'#f97316'},
  4:{n:'期待剥落期',  d:'Disillusionment / Distribution｜乖離縮小開始',        h:'#a855f7'},
};
const sh=s=>STAGES[s]?.h||'#fff';

function getRec(d,prev){
  const ma=d.ma200_dev??0,fp=d.from_peak??0,s=d.stage,ps=prev?.stage??s;
  if(s===0&&ps===4) return{icon:'▲',title:'強い買い推奨',sub:'底値形成を確認。長期エントリーの好機。',c:'#10b981'};
  if(s===1)         return{icon:'↑',title:'買い推奨',    sub:'期待覚醒フェーズ。モメンタム回復を確認後エントリー。',c:'#06b6d4'};
  if(s===2)         return{icon:'→',title:'保有継続',    sub:'期待拡大フェーズ。過熱サインを監視しながら保有。',c:'#94a3b8'};
  if(s===3&&ma<50)  return{icon:'⚠',title:'保有・要注意',sub:`陶酔期。MA200乖離${ma.toFixed(0)}%。ピークアウトに注意。`,c:'#f0c040'};
  if(s===3&&ma>=50) return{icon:'↓',title:'売り準備',    sub:`MA200を${ma.toFixed(0)}%超過。高値更新停止確認次第売り。`,c:'#f97316'};
  if(s===4&&ps===3) return{icon:'▼',title:'売り推奨',    sub:'陶酔期→期待剥落の遷移を検出。ポジション縮小推奨。',c:'#f43f5e'};
  if(s===4)         return{icon:'▼',title:'売り推奨',    sub:`期待剥落継続。高値から${Math.abs(fp).toFixed(0)}%下落。売りを継続。`,c:'#f43f5e'};
  if(s===0)         return{icon:'−',title:'様子見',      sub:'失望期継続中。底値確認まで待機。',c:'#64748b'};
  return{icon:'→',title:'保有継続',sub:'トレンド継続中。',c:'#94a3b8'};
}

function calcTrans(m,cur){
  const cnt={0:{},1:{},2:{},3:{},4:{}};
  for(let i=0;i<m.length-1;i++){const f=m[i].stage,t=m[i+1].stage;cnt[f][t]=(cnt[f][t]||0)+1;}
  const tot=Object.values(cnt[cur]||{}).reduce((a,b)=>a+b,0)||1;
  return[0,1,2,3,4].map(k=>({stage:k,prob:Math.round((cnt[cur]?.[k]||0)/tot*100)})).sort((a,b)=>b.prob-a.prob);
}

function buildReason(d,prev){
  const ma=d.ma200_dev??0,fp=d.from_peak??0,rsi=d.rsi??50,s=d.stage,p=[];
  if(s===3){
    p.push(`MA200を<strong>${ma.toFixed(0)}%</strong>上回る過熱水準`);
    if(rsi>70) p.push(`RSI<strong>${rsi.toFixed(0)}</strong>と過熱圏`);
    else if(rsi>55) p.push(`RSI<strong>${rsi.toFixed(0)}</strong>で上昇トレンド維持`);
    else p.push(`<span class="warn">RSI<strong>${rsi.toFixed(0)}</strong>と低下（押し目の可能性）</span>`);
  }else if(s===4){
    p.push(`高値から<strong>${Math.abs(fp).toFixed(0)}%</strong>下落`);
    if(ma<0) p.push(`MA200割れ（<strong>${ma.toFixed(0)}%</strong>）`);
    else p.push(`MA200はまだ<strong>+${ma.toFixed(0)}%</strong>上（部分的な調整）`);
    if(rsi<30) p.push(`RSI<strong>${rsi.toFixed(0)}</strong>と売られすぎ水準`);
  }else if(s===2){
    if(ma>=0) p.push(`MA200を<strong>${ma.toFixed(0)}%</strong>上回る`);
    if(fp<-8) p.push(`高値比<strong>-${Math.abs(fp).toFixed(0)}%</strong>の押し目局面`);
    if(rsi<45) p.push(`<span class="warn">RSI<strong>${rsi.toFixed(0)}</strong>と低め（下落圧力に注意）</span>`);
    if(ma<0) p.push(`<span class="warn">MA200を下回っているが他条件からデフォルト判定（ロジック精査中）</span>`);
  }else if(s===0){
    p.push(`MA200を<strong>${Math.abs(ma).toFixed(0)}%</strong>下回る低迷`);
    if(fp<-30) p.push(`高値から<strong>${Math.abs(fp).toFixed(0)}%</strong>の深い調整`);
  }else if(s===1){p.push('安値圏からのモメンタム回復兆候を検出');}
  return p.join(' ・ ')||'判定根拠データ不足';
}

function shortRsn(d){
  const ma=d.ma200_dev??0,fp=d.from_peak??0,rsi=d.rsi??50,s=d.stage;
  if(s===3) return `MA200+${ma.toFixed(0)}%・RSI${rsi.toFixed(0)}`;
  if(s===4){const ms=ma<0?`MA200割れ(${ma.toFixed(0)}%)`:`MA200+${ma.toFixed(0)}%`;return `高値-${Math.abs(fp).toFixed(0)}%・${ms}`;}
  if(s===2) return `MA200+${ma.toFixed(0)}%・ピーク比${fp.toFixed(0)}%・RSI${rsi.toFixed(0)}`;
  if(s===0) return `MA200${ma.toFixed(0)}%・高値-${Math.abs(fp).toFixed(0)}%`;
  return `MA200${ma>=0?'+':''}${ma.toFixed(0)}%・RSI${rsi.toFixed(0)}`;
}

// 凡例
const legEl=document.getElementById('stageLegend');
Object.entries(STAGES).forEach(([k,s])=>{
  const p=document.createElement('div');p.className='s-pill';
  p.style.cssText=`color:${s.h};border-color:${s.h};background:${s.h}18`;
  p.textContent=`S${k} ${s.n}`;legEl.appendChild(p);
});
document.getElementById('tsEl').textContent=new Date().toLocaleDateString('ja-JP');

let pChart=null,eChart=null,fChart=null;
const gridC='rgba(255,255,255,.04)',txtC='#4a5568';

async function loadTicker(ticker,btn){
  document.querySelectorAll('.ticker-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  try{const r=await fetch(`data/${ticker}_poc.json`);render(await r.json(),ticker);}
  catch(e){console.error(e);}
}

function render(data,ticker){
  const m=data.monthly,lat=m[m.length-1],prev=m[m.length-2];
  const s=STAGES[lat.stage],rec=getRec(lat,prev);
  const ma=lat.ma200_dev??0,fp=lat.from_peak??0,rsi=lat.rsi??50,price=lat.price??0;

  // MAIN CARD
  const mc=document.getElementById('mainCard');
  mc.style.borderLeftColor=s.h; mc.style.borderColor=s.h+'40';
  document.getElementById('stageCode').textContent=`S${lat.stage} ${s.n}`;
  document.getElementById('stageCode').style.color=s.h;
  document.getElementById('stageDesc').textContent=s.d;
  document.getElementById('recBlock').style.background=rec.c+'08';
  document.getElementById('recTitle').innerHTML=`<span style="color:${rec.c}">${rec.icon}</span><span style="color:${rec.c};margin-left:10px">${rec.title}</span>`;
  document.getElementById('recSub').textContent=rec.sub;
  document.getElementById('mets').innerHTML=`
    <div class="met"><div class="mval" style="color:${s.h}">$${price.toFixed(2)}</div><div class="mlbl">現在株価</div></div>
    <div class="met"><div class="mval ${ma>=0?'pos':'neg'}">${ma>=0?'+':''}${ma.toFixed(1)}%</div><div class="mlbl">MA200乖離</div></div>
    <div class="met"><div class="mval">${rsi.toFixed(0)}</div><div class="mlbl">RSI</div></div>
    <div class="met"><div class="mval ${fp<-10?'neg':''}">${fp>=0?'+':''}${fp.toFixed(1)}%</div><div class="mlbl">高値比</div></div>
  `;
  document.getElementById('reasonTxt').innerHTML=buildReason(lat,prev);

  // TRANSITION
  const trans=calcTrans(m,lat.stage);
  const tl=document.getElementById('transList');tl.innerHTML='';
  trans.forEach((t,i)=>{
    const h2=sh(t.stage),isTop=i===0;
    const div=document.createElement('div');div.className='trans-row';
    div.innerHTML=`
      <div class="trans-name" style="color:${h2}">S${t.stage} ${STAGES[t.stage].n}${t.stage===lat.stage?' <span style="font-size:10px;color:var(--mut)">[現在]</span>':''}</div>
      <div class="trans-bar"><div class="trans-fill" style="width:${t.prob}%;background:${h2}${isTop?'80':'40'}"></div></div>
      <div class="trans-pct" style="color:${h2}">${t.prob}%</div>
    `;
    tl.appendChild(div);
  });

  // ── 3チャート共通ラベル（月次） ──────────────────────────
  const labels=m.map(d=>d.month);

  // ステージ背景プラグイン（3チャート共通）
  function makeBgPlugin(monthly){
    return{id:'bg',beforeDatasetsDraw(c){
      const{ctx:cx,chartArea:{left,right,top,bottom},scales}=c;if(!scales.x)return;
      const step=scales.x.getPixelForValue(1)-scales.x.getPixelForValue(0);
      monthly.forEach((d,i)=>{
        const px=scales.x.getPixelForValue(i);cx.save();
        cx.fillStyle=sh(d.stage)+'30';
        cx.fillRect(Math.max(left,px-step/2),top,Math.min(right,px+step/2)-Math.max(left,px-step/2),bottom-top);
        cx.restore();
      });
    }};
  }

  // NOW縦線プラグイン
  const nowP={id:'now',afterDatasetsDraw(c){
    const{ctx:cx,chartArea:{top,bottom},scales}=c;
    const px=scales.x.getPixelForValue(m.length-1);
    cx.save();cx.strokeStyle='rgba(245,158,11,.5)';cx.lineWidth=1.5;cx.setLineDash([4,3]);
    cx.beginPath();cx.moveTo(px,top);cx.lineTo(px,bottom);cx.stroke();cx.setLineDash([]);
    cx.fillStyle='rgba(245,158,11,.9)';cx.font='bold 10px Space Mono';cx.textAlign='right';
    cx.fillText('▼ NOW',px-4,top+13);cx.restore();
  }};

  // 共通X軸オプション（ラベルを共有）
  const xAxis={ticks:{font:{size:11,family:'Space Mono'},color:txtC,maxRotation:0,autoSkip:true,maxTicksLimit:14},grid:{color:gridC}};
  const xAxisHidden={ticks:{display:false},grid:{color:gridC}};

  // ─── グラフ1: 株価 ───────────────────────────────────────
  if(pChart) pChart.destroy();
  pChart=new Chart(document.getElementById('priceChart').getContext('2d'),{
    type:'line',plugins:[makeBgPlugin(m),nowP],
    data:{labels,datasets:[{
      data:m.map(d=>d.price),label:'株価',
      borderColor:'rgba(255,255,255,.8)',borderWidth:2.5,
      pointBackgroundColor:m.map(d=>sh(d.stage)),
      pointBorderColor:m.map(d=>sh(d.stage)),
      pointBorderWidth:2,pointRadius:4,pointHoverRadius:7,
      fill:false,tension:.25,
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161c2d',borderColor:'#1e2840',borderWidth:1,
        titleFont:{family:'Space Mono',size:11},bodyFont:{family:'Space Mono',size:11},
        callbacks:{title:c=>c[0].label,label:c=>{const d=m[c.dataIndex],r=getRec(d,m[c.dataIndex-1]);
          return[` $${d.price?.toFixed(2)}`,` S${d.stage}: ${STAGES[d.stage]?.n}`,` ${r.icon} ${r.title}`];}}}},
      scales:{x:xAxisHidden,y:{ticks:{font:{size:11,family:'Space Mono'},color:txtC,callback:v=>`$${v}`},grid:{color:gridC}}}}
  });

  // ─── グラフ2: 期待・モメンタム（MA200乖離 + RSI） ──────────
  if(eChart) eChart.destroy();
  eChart=new Chart(document.getElementById('expectChart').getContext('2d'),{
    type:'line',plugins:[makeBgPlugin(m)],
    data:{labels,datasets:[
      {data:m.map(d=>d.ma200_dev),label:'MA200乖離%',
        borderColor:'#f97316',borderWidth:2,
        pointBackgroundColor:'#f97316',pointRadius:3,pointHoverRadius:5,
        fill:false,tension:.3,yAxisID:'y'},
      {data:m.map(d=>d.rsi),label:'RSI',
        borderColor:'#3b82f6',borderWidth:1.5,borderDash:[4,2],
        pointBackgroundColor:'#3b82f6',pointRadius:2,pointHoverRadius:4,
        fill:false,tension:.3,yAxisID:'y2'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'top',align:'end',
        labels:{font:{family:'Space Mono',size:10},color:txtC,boxWidth:12,padding:16}},
        tooltip:{backgroundColor:'#161c2d',borderColor:'#1e2840',borderWidth:1,
          titleFont:{family:'Space Mono',size:11},bodyFont:{family:'Space Mono',size:11}}},
      scales:{
        x:xAxisHidden,
        y:{position:'left',ticks:{font:{size:10,family:'Space Mono'},color:'#f97316',callback:v=>`${v>0?'+':''}${v?.toFixed(0)}%`},grid:{color:gridC},
           title:{display:true,text:'MA200乖離',color:'#f97316',font:{family:'Space Mono',size:9}}},
        y2:{position:'right',min:0,max:100,grid:{display:false},
           ticks:{font:{size:10,family:'Space Mono'},color:'#3b82f6',callback:v=>`${v}`},
           title:{display:true,text:'RSI',color:'#3b82f6',font:{family:'Space Mono',size:9}}},
      }}
  });

  // ─── グラフ3: 実体（売上成長YoY） ──────────────────────────
  if(fChart) fChart.destroy();
  const revData=m.map(d=>d.rev_yoy);
  fChart=new Chart(document.getElementById('fundChart').getContext('2d'),{
    type:'bar',plugins:[makeBgPlugin(m)],
    data:{labels,datasets:[{
      data:revData,label:'売上成長YoY%',
      backgroundColor:m.map(d=>(d.rev_yoy??0)>=0?'rgba(16,185,129,.5)':'rgba(244,63,94,.5)'),
      borderColor:m.map(d=>(d.rev_yoy??0)>=0?'#10b981':'#f43f5e'),
      borderWidth:1,
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161c2d',borderColor:'#1e2840',borderWidth:1,
        titleFont:{family:'Space Mono',size:11},bodyFont:{family:'Space Mono',size:11},
        callbacks:{label:c=>` 売上成長: ${c.raw!=null?'+'+c.raw?.toFixed(0)+'%':'データなし'}`}}},
      scales:{x:xAxis,y:{ticks:{font:{size:10,family:'Space Mono'},color:txtC,callback:v=>`${v>0?'+':''}${v}%`},grid:{color:gridC}}}}
  });

  // TABLE
  const tbody=document.getElementById('tableBody');tbody.innerHTML='';
  m.filter(d=>d.month>='2024-01').slice().reverse().forEach((d,i,arr)=>{
    const prevD=arr[i+1],r2=getRec(d,prevD?{stage:prevD.stage}:null),sc=sh(d.stage),isNow=d.month===lat.month;
    const tr=document.createElement('tr');if(isNow)tr.className='now-row';
    tr.innerHTML=`
      <td class="mono" style="font-size:14px">${d.month}${isNow?'<span class="now-tag">◀ NOW</span>':''}</td>
      <td><span class="s-badge" style="color:${sc};border-color:${sc};background:${sc}18">S${d.stage} ${STAGES[d.stage]?.n}</span></td>
      <td style="font-family:var(--mono);font-size:14px;color:${r2.c};font-weight:700;white-space:nowrap">${r2.icon} ${r2.title}</td>
      <td class="mono ${(d.ma200_dev??0)>=0?'pos':'neg'}" style="font-size:14px">${d.ma200_dev!=null?(d.ma200_dev>=0?'+':'')+d.ma200_dev.toFixed(1)+'%':'-'}</td>
      <td class="mono" style="font-size:14px;color:${(d.from_peak??0)<-15?'var(--red)':'var(--mut)'}">${d.from_peak!=null?(d.from_peak>=0?'+':'')+d.from_peak.toFixed(1)+'%':'-'}</td>
      <td class="mono" style="font-size:14px">${d.rsi!=null?d.rsi.toFixed(0):'-'}</td>
      <td class="mono" style="font-size:14px;font-weight:700">$${d.price?.toFixed(2)}</td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--mut);line-height:1.5">${shortRsn(d)}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadTicker('PLTR',document.querySelector('.ticker-btn'));
</script>
</body>
</html>
