<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCOVER Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:#0a0d14; --sur:#111520; --sur2:#161c2d; --bdr:#1e2840;
      --acc:#06b6d4; --grn:#10b981; --red:#f43f5e; --amb:#f59e0b;
      --txt:#e2e8f0; --mut:#64748b;
      --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh}
    .shell{max-width:1000px;margin:0 auto;padding:0 20px 60px}
    header{border-bottom:1px solid var(--bdr);padding:14px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:10px;flex-wrap:wrap}
    .logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--txt);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo-dot{width:7px;height:7px;background:var(--acc);border-radius:50%}
    .sec{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.15em;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
    .sec::after{content:'';flex:1;height:1px;background:var(--bdr)}

    /* Auth */
    #auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
    .auth-box{text-align:center;padding:48px 40px;background:var(--sur);border:1px solid var(--bdr);border-radius:12px;width:340px}
    .auth-title{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--acc);letter-spacing:.1em;margin-bottom:8px}
    .auth-sub{font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:28px}
    .auth-row{display:flex;gap:8px;justify-content:center}
    .auth-input{font-family:var(--mono);font-size:13px;padding:10px 14px;background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);width:190px;border-radius:4px;outline:none}
    .auth-input:focus{border-color:var(--acc)}
    .auth-btn{padding:10px 18px;background:var(--acc);color:#fff;border:none;cursor:pointer;font-family:var(--mono);font-size:13px;border-radius:4px}
    #pw-error{color:var(--red);font-size:11px;font-family:var(--mono);margin-top:12px;min-height:16px}

    /* Token */
    .token-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sur);border:1px solid var(--bdr);border-radius:6px;padding:12px 16px;margin-bottom:20px}
    .token-label{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
    .token-input{font-family:var(--mono);font-size:12px;background:var(--sur2);border:1px solid var(--bdr);padding:7px 10px;color:var(--txt);flex:1;min-width:220px;border-radius:4px}
    .token-input:focus{outline:none;border-color:var(--acc)}

    /* Buttons */
    .btn{font-family:var(--mono);font-size:12px;padding:7px 16px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);cursor:pointer;border-radius:4px;transition:all .2s}
    .btn:hover{border-color:var(--acc);color:var(--acc)}
    .btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
    .btn.primary:hover{opacity:.85}
    .btn.danger{border-color:var(--red);color:var(--red)}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* Form */
    .form-input{font-family:var(--mono);font-size:12px;background:var(--sur2);border:1px solid var(--bdr);padding:6px 10px;color:var(--txt);border-radius:4px;width:100%}
    .form-input:focus{outline:none;border-color:var(--acc)}

    /* Status message */
    .msg{font-family:var(--mono);font-size:12px;padding:8px 12px;border-radius:4px;margin-top:10px;display:none;white-space:pre-line}
    .msg.ok{background:rgba(16,185,129,.1);color:var(--grn);border:1px solid var(--grn);display:block}
    .msg.err{background:rgba(244,63,94,.1);color:var(--red);border:1px solid var(--red);display:block}

    /* Theme editor table */
    .theme-table{width:100%;border-collapse:collapse;margin-bottom:14px}
    .theme-table th{font-family:var(--mono);font-size:10px;color:var(--mut);text-align:left;padding:8px 10px;background:var(--sur2);border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.06em}
    .theme-table td{padding:8px 10px;border-bottom:1px solid rgba(30,40,64,.5);background:var(--sur);font-size:13px}
    .theme-row:hover td{background:var(--sur2)}

    /* Ticker editor */
    .ticker-grid{display:flex;flex-direction:column;gap:0}
    .ticker-row{display:grid;grid-template-columns:80px 80px 1fr 200px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(30,40,64,.5);background:var(--sur)}
    .ticker-row:nth-child(even){background:var(--sur2)}
    .ticker-row-head{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;background:var(--sur2)!important;border-bottom:1px solid var(--bdr)!important}
    .ticker-sym{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--acc)}
    .cat-label{font-family:var(--mono);font-size:11px;color:var(--mut)}
    .cb-group{display:flex;flex-wrap:wrap;gap:6px}
    .cb-label{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--txt);cursor:pointer;padding:2px 0}
    .cb-label input{accent-color:var(--acc)}
  </style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">DISCOVER Admin</div>
    <div class="auth-sub">パスワードで保護されています</div>
    <div class="auth-row">
      <input type="password" id="pw-input" class="auth-input" placeholder="Password">
      <button class="auth-btn" onclick="checkPassword()">Enter</button>
    </div>
    <div id="pw-error"></div>
  </div>
</div>

<!-- Main -->
<div id="main-content" style="display:none">
<div class="shell">
  <header>
    <a href="./" class="logo"><span class="logo-dot"></span>DISCOVER Admin</a>
    <nav style="display:flex;gap:12px">
      <a href="./" style="font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none">← DISCOVERに戻る</a>
    </nav>
  </header>

  <!-- GitHub Token -->
  <div class="token-row">
    <span class="token-label">GitHub Token:</span>
    <input type="password" id="gh-token" class="token-input" placeholder="ghp_xxxxxxxxxxxx (contents:write)">
    <button class="btn" onclick="loadAll()">📥 データ読み込み</button>
  </div>

  <!-- Section 1: Theme master -->
  <div class="sec">セクション1: テーママスタ編集</div>
  <div id="theme-editor"><div style="font-family:var(--mono);font-size:12px;color:var(--mut)">「データ読み込み」を実行してください</div></div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
    <button class="btn" onclick="addThemeRow()">＋ テーマ追加</button>
    <button class="btn primary" onclick="saveThemeConfig()">💾 theme_config.json を保存</button>
    <span id="theme-msg" class="msg"></span>
  </div>

  <!-- Section 2: Ticker theme assignment -->
  <div class="sec">セクション2: 銘柄テーマ割り当て</div>
  <div id="ticker-editor"><div style="font-family:var(--mono);font-size:12px;color:var(--mut)">「データ読み込み」を実行してください</div></div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
    <button class="btn primary" onclick="saveDiscoverConfig()">💾 discover_config.json を保存</button>
    <span id="discover-msg" class="msg"></span>
  </div>

</div>
</div>

<script>
const PW_HASH    = "1ccaba2b5d2e782f70745dc02ee88f537d51f6938bd6c22982a3d4d685be483a";
const SESSION_KEY = "discover_admin_auth";
const REPO_OWNER = 'Koichi-Shigihara2';
const REPO_NAME  = 'On-a-journey';
const BRANCH     = 'kaihatsu';
const THEME_PATH   = 'config/theme_config.json';
const DISCOVER_PATH = 'config/discover_config.json';

let _themeSha   = null;
let _discoverSha = null;
let _themeConfig  = null;
let _discoverConfig = null;

// ── Auth ──────────────────────────────────────────
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const pw = document.getElementById('pw-input').value;
  const hash = await sha256(pw);
  if (hash === PW_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  } else {
    document.getElementById('pw-error').textContent = 'パスワードが違います';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pw = document.getElementById('pw-input');
  if (pw) pw.addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  }
});

// ── GitHub API ────────────────────────────────────
function token() { return document.getElementById('gh-token').value.trim(); }

function apiHeaders() {
  return {
    'Authorization': `Bearer ${token()}`,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
}

async function fetchFile(path) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (!res.ok) throw new Error(`取得失敗: ${path} (${res.status})`);
  const data = await res.json();
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  return { content, sha: data.sha };
}

async function commitFile(path, content, message, sha) {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(content))),
    branch: BRANCH,
    ...(sha ? { sha } : {})
  };
  const res = await fetch(url, { method: 'PUT', headers: apiHeaders(), body: JSON.stringify(body) });
  if (!res.ok) { const err = await res.json(); throw new Error(`コミット失敗: ${err.message}`); }
  return await res.json();
}

function showMsg(id, type, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'msg ' + type;
  el.textContent = text;
  setTimeout(() => { el.className = 'msg'; el.textContent = ''; }, 5000);
}

// ── Load all data ─────────────────────────────────
async function loadAll() {
  if (!token()) { alert('GitHub Tokenを入力してください'); return; }
  try {
    const [t, d] = await Promise.all([fetchFile(THEME_PATH), fetchFile(DISCOVER_PATH)]);
    _themeSha = t.sha;
    _discoverSha = d.sha;
    _themeConfig = JSON.parse(t.content);
    _discoverConfig = JSON.parse(d.content);
    renderThemeEditor();
    renderTickerEditor();
  } catch (e) {
    alert('読み込みエラー: ' + e.message);
  }
}

// ── Theme editor ──────────────────────────────────
function renderThemeEditor() {
  const themes = _themeConfig?.themes ?? [];
  let html = `<table class="theme-table">
    <thead><tr><th>ID（変更不可）</th><th>ラベル</th><th>カラー</th><th>操作</th></tr></thead>
    <tbody>`;
  themes.forEach((t, i) => {
    html += `<tr class="theme-row">
      <td><span style="font-family:var(--mono);font-size:12px;color:var(--mut)">${escHtml(t.id)}</span></td>
      <td><input class="form-input" id="th-label-${i}" value="${escHtml(t.label)}" style="width:140px"></td>
      <td style="display:flex;align-items:center;gap:8px">
        <input type="color" id="th-color-${i}" value="${t.color}" style="width:36px;height:28px;border:none;background:none;cursor:pointer;border-radius:3px">
        <span style="font-family:var(--mono);font-size:11px;color:var(--mut)">${t.color}</span>
      </td>
      <td><button class="btn danger" onclick="removeTheme(${i})">削除</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('theme-editor').innerHTML = html;
}

function collectThemes() {
  const themes = _themeConfig?.themes ?? [];
  return themes.map((t, i) => ({
    id: t.id,
    label: document.getElementById('th-label-' + i)?.value ?? t.label,
    color: document.getElementById('th-color-' + i)?.value ?? t.color,
  }));
}

function removeTheme(i) {
  if (!confirm('削除しますか？')) return;
  const themes = collectThemes();
  themes.splice(i, 1);
  _themeConfig.themes = themes;
  renderThemeEditor();
  renderTickerEditor();
}

function addThemeRow() {
  const label = prompt('新テーマのラベル名:');
  if (!label) return;
  const id = label.toLowerCase().replace(/[^a-z0-9]/g, '_');
  const themes = collectThemes();
  themes.push({ id, label, color: '#64748b' });
  _themeConfig.themes = themes;
  renderThemeEditor();
  renderTickerEditor();
}

// テーマ設定のバリデーション（テーマID重複・空ラベル・不正な色コード）
// [[DISCOVER-CONFIG-DUAL-MGMT-1]] BACKLOG記載の対応方針に基づき追加。
// エラーメッセージの配列を返す（問題なければ空配列）。
function validateThemes(themes) {
  const errors = [];
  const seenIds = new Set();
  themes.forEach((t, i) => {
    const label = (t.label ?? '').trim();
    if (!label) {
      errors.push(`#${i + 1}行目: ラベルが空です`);
    }
    if (!t.id) {
      errors.push(`#${i + 1}行目: IDが空です`);
    } else if (seenIds.has(t.id)) {
      errors.push(`#${i + 1}行目: テーマID「${t.id}」が重複しています`);
    } else {
      seenIds.add(t.id);
    }
    if (!/^#[0-9a-fA-F]{6}$/.test(t.color ?? '')) {
      errors.push(`#${i + 1}行目: 色コード「${t.color}」が不正です（#rrggbb形式で指定してください）`);
    }
  });
  return errors;
}

async function saveThemeConfig() {
  const themes = collectThemes();
  const errors = validateThemes(themes);
  if (errors.length > 0) {
    showMsg('theme-msg', 'err', '✗ 保存できません:\n' + errors.join('\n'));
    return;
  }
  _themeConfig.themes = themes;
  const content = JSON.stringify(_themeConfig, null, 2);
  try {
    const res = await commitFile(THEME_PATH, content, 'chore: update theme_config.json', _themeSha);
    _themeSha = res.content.sha;
    showMsg('theme-msg', 'ok', '✓ theme_config.json を保存しました');
  } catch (e) {
    showMsg('theme-msg', 'err', '✗ ' + e.message);
  }
}

// ── Ticker editor ─────────────────────────────────
function renderTickerEditor() {
  const tickers = _discoverConfig?.tickers ?? {};
  const themes  = _themeConfig?.themes ?? [];
  const sortedTickers = Object.entries(tickers).sort(([a], [b]) => a.localeCompare(b));

  let html = `<div class="ticker-grid">
    <div class="ticker-row ticker-row-head">
      <span>銘柄</span><span>区分</span><span>テーマ</span><span>メモ</span>
    </div>`;

  for (const [ticker, info] of sortedTickers) {
    const curThemes = Array.isArray(info.themes) ? info.themes : [];
    const cbGroup = themes.map(t => `<label class="cb-label">
      <input type="checkbox" id="cb-${ticker}-${t.id}"${curThemes.includes(t.id) ? ' checked' : ''}>
      <span style="color:${t.color}">${escHtml(t.label)}</span>
    </label>`).join('');
    html += `<div class="ticker-row">
      <span class="ticker-sym">${escHtml(ticker)}</span>
      <span class="cat-label">${escHtml(info.category || '')}</span>
      <div class="cb-group">${cbGroup}</div>
      <input class="form-input" id="memo-${ticker}" value="${escHtml(info.memo || '')}" placeholder="メモ">
    </div>`;
  }
  html += '</div>';
  document.getElementById('ticker-editor').innerHTML = html;
}

async function saveDiscoverConfig() {
  const tickers = _discoverConfig?.tickers ?? {};
  const themes  = _themeConfig?.themes ?? [];
  for (const ticker of Object.keys(tickers)) {
    const selThemes = themes.filter(t => document.getElementById(`cb-${ticker}-${t.id}`)?.checked).map(t => t.id);
    const memoEl = document.getElementById('memo-' + ticker);
    tickers[ticker].themes = selThemes;
    if (memoEl) tickers[ticker].memo = memoEl.value;
  }
  _discoverConfig.last_updated = new Date().toISOString().slice(0, 10);
  const content = JSON.stringify(_discoverConfig, null, 2);
  try {
    const res = await commitFile(DISCOVER_PATH, content, 'chore: update discover_config.json themes', _discoverSha);
    _discoverSha = res.content.sha;
    showMsg('discover-msg', 'ok', '✓ discover_config.json を保存しました');
  } catch (e) {
    showMsg('discover-msg', 'err', '✗ ' + e.message);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
