<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCOVER — 情報収集レーダー</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:#0a0d14; --sur:#111520; --sur2:#161c2d; --bdr:#1e2840;
      --acc:#06b6d4; --grn:#10b981; --red:#f43f5e; --amb:#f59e0b;
      --pur:#8b5cf6;
      --txt:#e2e8f0; --sub:#7a92b0; --mut:#64748b;
      --mono:'Space Mono',monospace; --sans:'DM Sans','Noto Sans JP',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh}
    .shell{max-width:1000px;margin:0 auto;padding:0 20px 64px}

    header{border-bottom:1px solid var(--bdr);padding:14px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px}
    .logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt)}
    .logo-dot{width:7px;height:7px;background:var(--acc);border-radius:50%;animation:pdot 2s ease-in-out infinite}
    @keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.4)}50%{box-shadow:0 0 0 5px rgba(6,182,212,0)}}
    nav a{font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none;padding:4px 10px;border-right:1px solid var(--bdr)}
    nav a:first-child{border-left:1px solid var(--bdr)}
    nav a:hover{color:var(--acc)}

    .sec{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.12em;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
    .sec::after{content:'';flex:1;height:1px;background:var(--bdr)}

    .loading{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--mut)}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── 要注目バナー ── */
    .alert-banner{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.35);border-left:4px solid var(--red);padding:14px 18px;margin-bottom:20px}
    .alert-banner-title{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);letter-spacing:.1em;margin-bottom:8px}
    .alert-chips{display:flex;flex-wrap:wrap;gap:8px}
    .alert-chip{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(244,63,94,.15);color:var(--red);padding:4px 10px;border:1px solid rgba(244,63,94,.3)}

    /* ── 銘柄カード ── */
    .ticker-cards{display:flex;flex-direction:column;gap:12px}
    .ticker-card{background:var(--sur);border:1px solid var(--bdr)}
    .ticker-card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bdr)}
    .tc-ticker{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--acc);text-decoration:none}
    .tc-ticker:hover{text-decoration:underline}
    .tc-cat{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px}
    .cat-保有中{background:rgba(16,185,129,.15);color:var(--grn);border:1px solid rgba(16,185,129,.3)}
    .cat-監視中{background:rgba(6,182,212,.12);color:var(--acc);border:1px solid rgba(6,182,212,.3)}
    .cat-様子見{background:rgba(245,158,11,.12);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
    .tc-imp{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:2px}
    .imp-高{background:rgba(244,63,94,.15);color:var(--red)}
    .imp-中{background:rgba(245,158,11,.12);color:var(--amb)}
    .imp-低{background:rgba(100,116,139,.1);color:var(--mut)}
    .tc-summary{font-size:13px;color:var(--sub);margin-left:auto;font-style:italic}
    .tc-memo{font-size:12px;color:var(--mut);padding:6px 18px 10px;font-family:var(--mono)}

    .news-items{padding:0 18px 14px;display:flex;flex-direction:column;gap:8px}
    .news-item{background:var(--sur2);border:1px solid var(--bdr);padding:10px 14px}
    .news-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .news-cat{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px}
    .cat-カタリスト{background:rgba(16,185,129,.12);color:var(--grn)}
    .cat-リスク{background:rgba(244,63,94,.12);color:var(--red)}
    .cat-ブレイクスルー{background:rgba(139,92,246,.12);color:var(--pur)}
    .cat-一般{background:rgba(100,116,139,.1);color:var(--mut)}
    .news-imp{font-family:var(--mono);font-size:9px;padding:2px 6px}
    .imp-高.sm{color:var(--red)}
    .imp-中.sm{color:var(--amb)}
    .imp-低.sm{color:var(--mut)}
    .news-title{font-size:12px;color:var(--txt)}
    .news-sum{font-size:11px;color:var(--sub);margin-top:3px}

    .no-news{font-family:var(--mono);font-size:12px;color:var(--mut);padding:10px 18px 14px}

    /* ── カード折りたたみ ── */
    .ticker-card[data-collapsed] .ticker-card-head{cursor:pointer;user-select:none}
    .card-toggle-icon{font-family:var(--mono);font-size:11px;color:var(--mut);padding-left:8px;flex-shrink:0}
    .low-toggle{display:block;background:none;border:1px solid var(--bdr);color:var(--mut);font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:5px 12px;cursor:pointer;margin-top:4px;text-align:left;transition:color .2s,border-color .2s}
    .low-toggle:hover{color:var(--acc);border-color:var(--acc)}
    .low-items{display:flex;flex-direction:column;gap:8px;margin-top:4px}

    /* ── 候補カード ── */
    .cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .cand-card{background:var(--sur);border:1px solid var(--bdr);padding:18px}
    .cand-ticker{font-family:var(--mono);font-size:20px;font-weight:700;color:#06b6d4;margin-bottom:2px}
    .cand-company{font-size:12px;color:var(--sub);margin-bottom:10px}
    .cand-sector{font-family:var(--mono);font-size:9px;color:var(--mut);background:var(--sur2);padding:2px 8px;display:inline-block;margin-bottom:10px}
    .cand-reason{font-size:13px;color:var(--txt);line-height:1.65;margin-bottom:8px}
    .cand-risk{font-size:11px;color:var(--amb);background:rgba(245,158,11,.06);border-left:2px solid var(--amb);padding:6px 10px}

    .updated{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;margin-top:16px}

    @media(max-width:640px){.ticker-card-head{flex-wrap:wrap}.tc-summary{margin-left:0;width:100%}}
  </style>
  <link rel="stylesheet" href="../common/site-theme.css">
</head>
<body data-tool="discover">
<div class="shell">

  <header>
    <a href="../" class="logo">
      <span class="logo-dot"></span>
      DISCOVER
    </a>
    <nav class="nav-links"></nav>
  </header>

  <div id="app"><div class="loading"><span class="spin"></span>データを読み込み中...</div></div>

</div>

<script>
const REPORT_PATH   = '/On-a-journey/discover/data/daily_report.json';
const CONFIG_PATH   = '/On-a-journey/../config/discover_config.json';
const TANUKI_BASE   = '/On-a-journey/value-monitor/tanuki_valuation/';
const TS            = '?t=' + Date.now();

const CAT_ORDER = ['保有中', '監視中', '様子見'];

async function loadData() {
  const app = document.getElementById('app');
  try {
    const [reportRes, configRes] = await Promise.allSettled([
      fetch(REPORT_PATH + TS).then(r => r.ok ? r.json() : null),
      fetch('/On-a-journey/config/discover_config.json' + TS).then(r => r.ok ? r.json() : null),
    ]);

    const report = reportRes.status === 'fulfilled' ? reportRes.value : null;
    const config = configRes.status === 'fulfilled' ? configRes.value : null;

    const tickers  = report?.tickers  || {};
    const candidates = report?.candidates || [];
    const configTickers = config?.tickers || {};
    const generatedAt  = report?.generated_at || '';

    // 要注目（top_importance=高）
    const highItems = Object.entries(tickers)
      .filter(([, v]) => v.top_importance === '高')
      .map(([t]) => t);

    let html = '';

    // ── 要注目バナー ──
    if (highItems.length > 0) {
      html += `<div class="alert-banner">
        <div class="alert-banner-title">🔴 要注目銘柄 — 重要ニュースあり</div>
        <div class="alert-chips">${highItems.map(t => `<span class="alert-chip">${t}</span>`).join('')}</div>
      </div>`;
    }

    // ── 銘柄別ニュース ──
    html += '<div class="sec">銘柄別ニュース</div>';
    html += '<div class="ticker-cards">';

    // 区分順でソート
    const sorted = Object.entries(tickers).sort(([, a], [, b]) => {
      const ai = CAT_ORDER.indexOf(a.category);
      const bi = CAT_ORDER.indexOf(b.category);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

    for (const [ticker, data] of sorted) {
      const cat  = data.category || '—';
      const imp  = data.top_importance || '低';
      const memo = configTickers[ticker]?.memo || data.memo || '';
      const classified = data.classified || {};
      const items = classified.items || [];
      const summary = classified.summary || '';

      const cardId = 'card-' + ticker.replace(/[^A-Za-z0-9]/g, '-');
      const lowId  = 'low-'  + ticker.replace(/[^A-Za-z0-9]/g, '-');

      const highMedItems = items.filter(i => i.importance !== '低');
      const lowItems     = items.filter(i => i.importance === '低');
      const allLow = items.length > 0 && highMedItems.length === 0;
      const shouldCollapse = imp === '低' && (items.length === 0 || allLow);

      html += `<div class="ticker-card" id="${cardId}"${shouldCollapse ? ' data-collapsed=""' : ''}>
        <div class="ticker-card-head"${shouldCollapse ? ` onclick="toggleCard('${cardId}')"` : ''}>
          <a class="tc-ticker" href="${TANUKI_BASE}stock.html?ticker=${ticker}">${ticker}</a>
          <span class="tc-cat cat-${cat}">${cat}</span>
          <span class="tc-imp imp-${imp}">${imp}</span>
          <span class="tc-summary">${summary}</span>
          ${shouldCollapse ? '<span class="card-toggle-icon">▶</span>' : ''}
        </div>
        <div class="ticker-card-body"${shouldCollapse ? ' style="display:none"' : ''}>`;

      if (memo) {
        html += `<div class="tc-memo">📝 ${memo}</div>`;
      }

      if (items.length > 0) {
        html += '<div class="news-items">';

        for (const item of highMedItems) {
          const c = item.category || '一般';
          html += `<div class="news-item">
            <div class="news-item-head">
              <span class="news-cat cat-${c}">${c}</span>
              <span class="news-imp imp-${item.importance} sm">${item.importance}</span>
              <span class="news-title">${escHtml(item.title || '')}</span>
            </div>
            <div class="news-sum">${escHtml(item.summary || '')}</div>
          </div>`;
        }

        if (lowItems.length > 0) {
          html += `<button class="low-toggle" onclick="toggleLow(this,'${lowId}')">▼ 低重要度ニュースを表示（${lowItems.length}件）</button>
          <div class="low-items" id="${lowId}" style="display:none">`;
          for (const item of lowItems) {
            const c = item.category || '一般';
            html += `<div class="news-item">
              <div class="news-item-head">
                <span class="news-cat cat-${c}">${c}</span>
                <span class="news-imp imp-${item.importance} sm">${item.importance}</span>
                <span class="news-title">${escHtml(item.title || '')}</span>
              </div>
              <div class="news-sum">${escHtml(item.summary || '')}</div>
            </div>`;
          }
          html += '</div>';
        }

        html += '</div>';
      } else {
        html += `<div class="no-news">直近24時間の重要ニュースなし</div>`;
      }

      html += '</div></div>';
    }

    if (sorted.length === 0) {
      html += '<div class="no-news" style="padding:20px;text-align:center">データなし — 次回更新をお待ちください</div>';
    }

    html += '</div>';

    // ── 新規候補 ──
    html += '<div class="sec">新規候補 — Grok発見</div>';
    if (candidates.length > 0) {
      html += '<div class="cand-grid">';
      for (const c of candidates) {
        html += `<div class="cand-card">
          <div class="cand-ticker">${escHtml(c.ticker || '?')}</div>
          <div class="cand-company">${escHtml(c.company || '')}</div>
          <span class="cand-sector">${escHtml(c.sector || '')}</span>
          <div class="cand-reason">${escHtml(c.reason || '')}</div>
          ${c.risk ? `<div class="cand-risk">⚠️ ${escHtml(c.risk)}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    } else {
      html += '<div style="font-family:var(--mono);font-size:12px;color:var(--mut);padding:10px 0">候補データなし</div>';
    }

    // 更新日時
    if (generatedAt) {
      const dt = new Date(generatedAt);
      const label = dt.toLocaleString('ja-JP', {timeZone:'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      html += `<div class="updated">最終更新: ${label} JST</div>`;
    }

    app.innerHTML = html;

  } catch (e) {
    app.innerHTML = `<div class="loading" style="color:var(--red)">エラー: ${e.message}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleCard(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const body = card.querySelector('.ticker-card-body');
  const icon = card.querySelector('.card-toggle-icon');
  const collapsed = card.hasAttribute('data-collapsed');
  if (collapsed) {
    card.removeAttribute('data-collapsed');
    body.style.display = '';
    if (icon) icon.textContent = '▼';
  } else {
    card.setAttribute('data-collapsed', '');
    body.style.display = 'none';
    if (icon) icon.textContent = '▶';
  }
}

function toggleLow(btn, id) {
  const div = document.getElementById(id);
  if (!div) return;
  const hidden = div.style.display === 'none';
  div.style.display = hidden ? '' : 'none';
  const n = div.querySelectorAll('.news-item').length;
  btn.textContent = hidden
    ? '▲ 低重要度ニュースを折りたたむ'
    : '▼ 低重要度ニュースを表示（' + n + '件）';
}

loadData();
</script>
  <script src="../common/site-nav.js"></script>
</body>
</html>
