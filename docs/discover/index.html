<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCOVER — 情報収集レーダー</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/On-a-journey/favicon.ico">
  <style>
    :root {
      --bg:#0a0d14; --sur:#111520; --sur2:#161c2d; --bdr:#1e2840;
      --acc:#06b6d4; --grn:#10b981; --red:#f43f5e; --amb:#f59e0b;
      --pur:#8b5cf6;
      --txt:#e2e8f0; --sub:#7a92b0; --mut:#64748b;
      --mono:'Space Mono',monospace; --sans:'DM Sans','Noto Sans JP',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;min-height:100vh}
    .shell{max-width:1000px;margin:0 auto;padding:0 20px 64px}

    header{border-bottom:1px solid var(--bdr);padding:14px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px}
    .logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt)}
    .logo-dot{width:7px;height:7px;background:var(--acc);border-radius:50%;animation:pdot 2s ease-in-out infinite}
    @keyframes pdot{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.4)}50%{box-shadow:0 0 0 5px rgba(6,182,212,0)}}
    nav a{font-family:var(--mono);font-size:11px;color:var(--mut);text-decoration:none;padding:4px 10px;border-right:1px solid var(--bdr)}
    nav a:first-child{border-left:1px solid var(--bdr)}
    nav a:hover{color:var(--acc)}

    .sec{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.12em;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
    .sec::after{content:'';flex:1;height:1px;background:var(--bdr)}

    .loading{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--mut)}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── 要注目バナー ── */
    .alert-banner{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.35);border-left:4px solid var(--red);padding:14px 18px;margin-bottom:20px}
    .alert-banner-title{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);letter-spacing:.1em;margin-bottom:8px}
    .alert-chips{display:flex;flex-wrap:wrap;gap:8px}
    .alert-chip{font-family:var(--mono);font-size:12px;font-weight:700;background:rgba(244,63,94,.15);color:var(--red);padding:4px 10px;border:1px solid rgba(244,63,94,.3)}

    /* ── 銘柄カード ── */
    .ticker-cards{display:flex;flex-direction:column;gap:12px}
    .ticker-card{background:var(--sur);border:1px solid var(--bdr)}
    .ticker-card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bdr)}
    .tc-ticker{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--acc);text-decoration:none}
    .tc-ticker:hover{text-decoration:underline}
    .tc-cat{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:2px}
    .cat-保有中{background:rgba(16,185,129,.15);color:var(--grn);border:1px solid rgba(16,185,129,.3)}
    .cat-監視中{background:rgba(6,182,212,.12);color:var(--acc);border:1px solid rgba(6,182,212,.3)}
    .cat-様子見{background:rgba(245,158,11,.12);color:var(--amb);border:1px solid rgba(245,158,11,.3)}
    .tc-imp{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:2px}
    .imp-高{background:rgba(244,63,94,.15);color:var(--red)}
    .imp-中{background:rgba(245,158,11,.12);color:var(--amb)}
    .imp-低{background:rgba(100,116,139,.1);color:var(--mut)}
    .tc-summary{font-size:13px;color:var(--sub);margin-left:auto;font-style:italic}
    .tc-memo{font-size:12px;color:var(--mut);padding:6px 18px 10px;font-family:var(--mono)}

    .news-items{padding:0 18px 14px;display:flex;flex-direction:column;gap:8px}
    .news-item{background:var(--sur2);border:1px solid var(--bdr);padding:10px 14px}
    .news-item-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .news-cat{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px}
    .cat-カタリスト{background:rgba(16,185,129,.12);color:var(--grn)}
    .cat-リスク{background:rgba(244,63,94,.12);color:var(--red)}
    .cat-ブレイクスルー{background:rgba(139,92,246,.12);color:var(--pur)}
    .cat-一般{background:rgba(100,116,139,.1);color:var(--mut)}
    .news-imp{font-family:var(--mono);font-size:9px;padding:2px 6px}
    .imp-高.sm{color:var(--red)}
    .imp-中.sm{color:var(--amb)}
    .imp-低.sm{color:var(--mut)}
    .news-title{font-size:12px;color:var(--txt)}
    .news-sum{font-size:11px;color:var(--sub);margin-top:3px}

    .no-news{font-family:var(--mono);font-size:12px;color:var(--mut);padding:10px 18px 14px}

    /* ── カード折りたたみ ── */
    .ticker-card[data-collapsed] .ticker-card-head{cursor:pointer;user-select:none}
    .card-toggle-icon{font-family:var(--mono);font-size:11px;color:var(--mut);padding-left:8px;flex-shrink:0}
    .low-toggle{display:block;background:none;border:1px solid var(--bdr);color:var(--mut);font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:5px 12px;cursor:pointer;margin-top:4px;text-align:left;transition:color .2s,border-color .2s}
    .low-toggle:hover{color:var(--acc);border-color:var(--acc)}
    .low-items{display:flex;flex-direction:column;gap:8px;margin-top:4px}

    /* ── 候補カード ── */
    .cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .cand-card{background:var(--sur);border:1px solid var(--bdr);padding:18px}
    .cand-ticker{font-family:var(--mono);font-size:20px;font-weight:700;color:#06b6d4;margin-bottom:2px}
    .cand-company{font-size:12px;color:var(--sub);margin-bottom:10px}
    .cand-sector{font-family:var(--mono);font-size:9px;color:var(--mut);background:var(--sur2);padding:2px 8px;display:inline-block;margin-bottom:10px}
    .cand-reason{font-size:13px;color:var(--txt);line-height:1.65;margin-bottom:8px}
    .cand-risk{font-size:11px;color:var(--amb);background:rgba(245,158,11,.06);border-left:2px solid var(--amb);padding:6px 10px}

    .updated{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;margin-top:16px}

    /* テーマフィルター・バッジ・サマリー */
    .theme-filter-bar{background:var(--sur);border:1px solid var(--bdr);padding:12px 16px;margin-bottom:16px}
    .theme-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px;white-space:nowrap}
    .theme-summary-card{background:var(--sur);border:1px solid var(--bdr);padding:14px 18px;margin-bottom:10px;border-radius:4px}

    /* テーマカード */
    .theme-card{background:var(--sur);border:1px solid var(--bdr);padding:18px;margin-bottom:12px}
    .theme-name{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--txt);margin-bottom:10px}
    .theme-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}

    /* 候補カード拡張バッジ */
    .cand-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
    .cand-meta .cand-sector{margin-bottom:0}
    .cand-catalyst{background:rgba(139,92,246,.12);color:var(--pur)}
    .conv-高{background:rgba(16,185,129,.12);color:#10b981}
    .conv-中{background:rgba(245,158,11,.12);color:#f59e0b}
    .conv-低{background:rgba(100,116,139,.1);color:#64748b}
    .screen-pass{background:rgba(16,185,129,.08);color:#10b981}

    @media(max-width:640px){.ticker-card-head{flex-wrap:wrap}.tc-summary{margin-left:0;width:100%}}

    /* ── ゾーンレイアウト ── */
    .zone-header{font-family:var(--mono);font-size:10px;letter-spacing:.12em;margin:24px 0 12px;display:flex;align-items:center;gap:12px}
    .zone-header:not(.zone-nonews)::after{content:'';flex:1;height:1px;background:var(--bdr)}
    .zone-alert{color:var(--red)}
    .zone-alert::after{background:rgba(244,63,94,.3)!important}
    .zone-normal{color:var(--sub)}
    .zone-nonews{color:var(--mut);justify-content:space-between}
    .zone-alert-cards .ticker-card{border-left:3px solid rgba(244,63,94,.6)}
    .no-news-toggle{background:none;border:1px solid var(--bdr);color:var(--mut);font-family:var(--mono);font-size:9px;padding:3px 10px;cursor:pointer;border-radius:2px;transition:all .15s}
    .no-news-toggle:hover{color:var(--acc);border-color:var(--acc)}

    /* ── ニュースタイトルリンク / 出典 ── */
    .news-title-link{color:var(--txt);text-decoration:none;transition:color .15s}
    .news-title-link:hover{color:var(--acc);text-decoration:underline}
    .news-source{font-size:0.72em;color:var(--mut);margin-top:2px}

    /* ── 条件・リスクパネル ── */
    .conditions-panel{padding:4px 18px 8px}
    .cond-toggle{background:none;border:none;color:var(--mut);font-family:var(--mono);font-size:10px;cursor:pointer;padding:0;letter-spacing:.04em;transition:color .15s}
    .cond-toggle:hover{color:var(--acc)}
    .cond-body{margin-top:6px;border-top:1px solid var(--bdr);padding-top:8px;display:flex;flex-direction:column;gap:6px}
    .cond-label{font-family:var(--mono);font-size:9px;color:var(--sub);margin-bottom:4px;letter-spacing:.05em}
    .cond-items{display:flex;flex-wrap:wrap;gap:4px}
    .cond-item{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:2px}
    .cond-pass{background:rgba(16,185,129,.08);color:var(--grn);border:1px solid rgba(16,185,129,.2)}
    .cond-risk{background:rgba(244,63,94,.08);color:var(--red);border:1px solid rgba(244,63,94,.2)}
  </style>
  <link rel="stylesheet" href="../common/site-theme.css">
</head>
<body data-tool="discover">
<div class="shell">

  <header>
    <a href="../" class="logo">
      <span class="logo-dot"></span>
      DISCOVER
    </a>
    <nav class="nav-links"></nav>
  </header>
  <div class="last-updated" id="last-updated"></div>

  <div id="app"><div class="loading"><span class="spin"></span>データを読み込み中...</div></div>

</div>

<script>
const REPORT_PATH    = '/On-a-journey/discover/data/daily_report.json';
const CONFIG_PATH    = '/On-a-journey/portfolio/data/discover_config.json';
const TANUKI_BASE    = '/On-a-journey/value-monitor/tanuki_valuation/';
const HYPE_BASE      = '/On-a-journey/value-monitor/hypecore/data/';
const THEME_CFG_PATH = '/On-a-journey/portfolio/data/theme_config.json';
const TS             = '?t=' + Date.now();

const CAT_ORDER = ['保有中', '監視中', '様子見'];

let _catFilter   = '全て';
let _themeFilter = '全テーマ';
let _state       = null;

function setFilter(type, val) {
  if (type === 'cat') _catFilter = val;
  else _themeFilter = val;
  if (_state) renderTickerSection();
}

function buildNewsItem(item) {
  const c = item.category || '一般';
  const dateStr = item.published_at
    ? `<span style="font-family:var(--mono);font-size:9px;color:var(--mut);margin-left:auto;flex-shrink:0">${escHtml(item.published_at)}</span>`
    : '';
  const hasUrl = item.url && item.url.startsWith('http');
  const href = hasUrl
    ? escHtml(item.url)
    : `https://www.google.com/search?q=${encodeURIComponent(item.title || '')}`;
  const titleHtml = `<a class="news-title news-title-link" href="${href}" target="_blank" rel="noopener">${escHtml(item.title || '')}</a>`;
  const sourceHtml = item.source
    ? `<div class="news-source">via ${escHtml(item.source)}</div>`
    : '';
  return `<div class="news-item">
    <div class="news-item-head">
      <span class="news-cat cat-${escHtml(c)}">${escHtml(c)}</span>
      <span class="news-imp imp-${escHtml(item.importance || '低')} sm">${escHtml(item.importance || '低')}</span>
      ${titleHtml}
      ${dateStr}
    </div>
    <div class="news-sum">${escHtml(item.summary || '')}</div>
    ${sourceHtml}
  </div>`;
}

function buildFilterBar(themeConfig) {
  const cats = ['全て', '保有中', '監視中', '様子見'];
  const FS = 'font-family:var(--mono);font-size:10px;padding:4px 10px;border:1px solid var(--bdr);background:var(--sur2);color:var(--mut);cursor:pointer;border-radius:2px;transition:all .15s';
  const catBtns = cats.map(c =>
    `<button id="cat-btn-${c}" onclick="setFilter('cat','${c}')" style="${FS}">${c}</button>`
  ).join('');
  let themeBtns = `<button id="theme-btn-全テーマ" onclick="setFilter('theme','全テーマ')" style="${FS}">全テーマ</button>`;
  (themeConfig?.themes ?? []).forEach(t => {
    themeBtns += `<button id="theme-btn-${escHtml(t.id)}" onclick="setFilter('theme','${escHtml(t.id)}')" style="${FS};color:${t.color}">${escHtml(t.label)}</button>`;
  });
  return `<div class="theme-filter-bar">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
      <span style="font-family:var(--mono);font-size:10px;color:var(--mut)">区分:</span>${catBtns}
    </div>
    ${themeConfig ? `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="font-family:var(--mono);font-size:10px;color:var(--mut)">テーマ:</span>${themeBtns}
    </div>` : ''}
  </div>`;
}

function updateFilterButtons() {
  const s = _state;
  ['全て', '保有中', '監視中', '様子見'].forEach(c => {
    const btn = document.getElementById('cat-btn-' + c);
    if (!btn) return;
    const on = _catFilter === c;
    btn.style.background  = on ? 'var(--acc)' : 'var(--sur2)';
    btn.style.color       = on ? '#fff' : 'var(--mut)';
    btn.style.borderColor = on ? 'var(--acc)' : 'var(--bdr)';
  });
  ['全テーマ', ...(s?.themeConfig?.themes ?? []).map(t => t.id)].forEach(id => {
    const btn = document.getElementById('theme-btn-' + id);
    if (!btn) return;
    const on = _themeFilter === id;
    const tm = s?.themeConfig?.themes?.find(t => t.id === id);
    const col = tm ? tm.color : 'var(--acc)';
    btn.style.background  = on ? col + '33' : 'var(--sur2)';
    btn.style.borderColor = on ? col : 'var(--bdr)';
    btn.style.color       = on && !tm ? 'var(--acc)' : (tm ? col : 'var(--mut)');
  });
}

function buildConditionsPanel(classified) {
  const conditions = classified.conditions_met ?? [];
  const risks      = classified.risk_flags     ?? [];
  if (!conditions.length && !risks.length) return '';
  const panelId = 'cp-' + Math.random().toString(36).slice(2, 8);
  let content = '';
  if (conditions.length) {
    content += `<div><div class="cond-label">📋 スクリーニング通過条件</div><div class="cond-items">${conditions.map(c => `<span class="cond-item cond-pass">${escHtml(c)}</span>`).join('')}</div></div>`;
  }
  if (risks.length) {
    content += `<div><div class="cond-label">⚠️ リスクフラグ</div><div class="cond-items">${risks.map(r => `<span class="cond-item cond-risk">${escHtml(r)}</span>`).join('')}</div></div>`;
  }
  return `<div class="conditions-panel">
    <button class="cond-toggle" onclick="toggleCond(this,'${panelId}')">▼ 詳細</button>
    <div class="cond-body" id="${panelId}" style="display:none">${content}</div>
  </div>`;
}

function buildTickerCard(ticker, data, configTickers, themeMapById) {
  const cat        = data.category || '—';
  const imp        = data.top_importance || '低';
  const memo       = configTickers[ticker]?.memo || data.memo || '';
  const classified = data.classified || {};
  const items      = classified.items || [];
  const summary    = classified.summary || '';
  const themes     = configTickers[ticker]?.themes ?? [];
  const cardId     = 'card-' + ticker.replace(/[^A-Za-z0-9]/g, '-');
  const lowId      = 'low-'  + ticker.replace(/[^A-Za-z0-9]/g, '-');
  const highMedItems = items.filter(i => i.importance !== '低');
  const lowItems_    = items.filter(i => i.importance === '低');
  const themeBadges  = themes.map(id => {
    const tm = themeMapById[id];
    return tm ? `<span class="theme-badge" style="background:${tm.color}22;color:${tm.color}">${escHtml(tm.label)}</span>` : '';
  }).join('');
  let html = `<div class="ticker-card" id="${cardId}">
    <div class="ticker-card-head">
      <a class="tc-ticker" href="${TANUKI_BASE}stock.html?ticker=${ticker}">${ticker}</a>
      <span class="tc-cat cat-${escHtml(cat)}">${escHtml(cat)}</span>
      ${themeBadges}
      <span class="tc-imp imp-${escHtml(imp)}">${escHtml(imp)}</span>
      <span class="tc-summary">${escHtml(summary)}</span>
    </div>
    <div class="ticker-card-body">`;
  if (memo) html += `<div class="tc-memo">📝 ${escHtml(memo)}</div>`;
  html += buildConditionsPanel(classified);
  if (items.length > 0) {
    html += '<div class="news-items">';
    for (const item of highMedItems) html += buildNewsItem(item);
    if (lowItems_.length > 0) {
      html += `<button class="low-toggle" onclick="toggleLow(this,'${lowId}')">▼ 低重要度ニュースを表示（${lowItems_.length}件）</button>
        <div class="low-items" id="${lowId}" style="display:none">`;
      for (const item of lowItems_) html += buildNewsItem(item);
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += `<div class="no-news">直近24時間の重要ニュースなし</div>`;
  }
  html += '</div></div>';
  return html;
}

function renderTickerSection() {
  const el = document.getElementById('ticker-section');
  if (!el || !_state) return;
  const { tickers, configTickers, themeConfig } = _state;
  const themeMapById = {};
  (themeConfig?.themes ?? []).forEach(t => { themeMapById[t.id] = t; });

  const sorted = Object.entries(tickers)
    .filter(([ticker, data]) => {
      if (_catFilter !== '全て' && data.category !== _catFilter) return false;
      if (_themeFilter !== '全テーマ') {
        const th = configTickers[ticker]?.themes ?? [];
        if (!th.includes(_themeFilter)) return false;
      }
      return true;
    })
    .sort(([, a], [, b]) => {
      const ai = CAT_ORDER.indexOf(a.category);
      const bi = CAT_ORDER.indexOf(b.category);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

  const highZone   = sorted.filter(([, d]) => (d.classified?.items ?? []).length > 0 && d.top_importance === '高');
  const normalZone = sorted.filter(([, d]) => (d.classified?.items ?? []).length > 0 && d.top_importance !== '高');
  const noNewsZone = sorted.filter(([, d]) => (d.classified?.items ?? []).length === 0);

  let html = '';

  if (highZone.length > 0) {
    html += '<div class="zone-header zone-alert">🔴 要注目ゾーン</div><div class="ticker-cards zone-alert-cards">';
    for (const [ticker, data] of highZone) html += buildTickerCard(ticker, data, configTickers, themeMapById);
    html += '</div>';
  }

  if (normalZone.length > 0) {
    html += '<div class="zone-header zone-normal">📰 通常ニュースゾーン</div><div class="ticker-cards">';
    for (const [ticker, data] of normalZone) html += buildTickerCard(ticker, data, configTickers, themeMapById);
    html += '</div>';
  }

  if (noNewsZone.length > 0) {
    html += `<div class="zone-header zone-nonews">
      <span>🔍 ニュースなし銘柄</span>
      <button class="no-news-toggle" id="no-news-btn" onclick="toggleNoNewsZone()">ニュースなし ${noNewsZone.length}銘柄を表示</button>
    </div>
    <div id="no-news-zone" class="ticker-cards" style="display:none">`;
    for (const [ticker, data] of noNewsZone) html += buildTickerCard(ticker, data, configTickers, themeMapById);
    html += '</div>';
  }

  if (sorted.length === 0) {
    html += '<div class="no-news" style="padding:20px;text-align:center">表示する銘柄がありません</div>';
  }

  el.innerHTML = html;
  updateFilterButtons();
}

function buildThemeSummarySection(themeConfig, configTickers, tickers, hypeMap) {
  const themes = themeConfig?.themes ?? [];
  if (!themes.length) return '';
  let cards = '';
  for (const theme of themes) {
    const tklist = Object.entries(configTickers)
      .filter(([, v]) => Array.isArray(v.themes) && v.themes.includes(theme.id))
      .map(([tk]) => tk);
    if (!tklist.length) continue;
    const catCount = {}, phaseCount = {};
    for (const tk of tklist) {
      const cat = tickers[tk]?.category || '-';
      catCount[cat] = (catCount[cat] || 0) + 1;
      const hc = hypeMap[tk];
      const sl = hc?.monthly?.[hc.monthly.length - 1]?.stage_label ?? '-';
      phaseCount[sl] = (phaseCount[sl] || 0) + 1;
    }
    const catDisp   = Object.entries(catCount).map(([k, v]) => `${k}:${v}`).join(' / ') || '-';
    const phaseDisp = Object.entries(phaseCount).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k}:${v}`).join(' / ') || '-';
    cards += `<div class="theme-summary-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-family:var(--mono);font-size:13px;font-weight:700;color:${theme.color}">${escHtml(theme.label)}</span>
        <span style="font-family:var(--mono);font-size:11px;color:var(--mut)">${tklist.length}銘柄</span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--mut);margin-left:auto">${tklist.join(', ')}</span>
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:3px">区分: ${catDisp}</div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--mut)">フェーズ: ${phaseDisp}</div>
    </div>`;
  }
  return cards ? '<div class="sec">📊 テーマ別サマリー</div>' + cards : '';
}

async function loadData() {
  const app = document.getElementById('app');
  try {
    const [reportRes, configRes, themeCfgRes] = await Promise.allSettled([
      fetch(REPORT_PATH + TS).then(r => r.ok ? r.json() : null),
      fetch('/On-a-journey/portfolio/data/discover_config.json' + TS).then(r => r.ok ? r.json() : null),
      fetch(THEME_CFG_PATH + TS).then(r => r.ok ? r.json() : null),
    ]);

    const report      = reportRes.status   === 'fulfilled' ? reportRes.value   : null;
    const config      = configRes.status   === 'fulfilled' ? configRes.value   : null;
    const themeConfig = themeCfgRes.status === 'fulfilled' ? themeCfgRes.value : null;

    const tickers       = report?.tickers    || {};
    const candidates    = report?.candidates || [];
    const configTickers = config?.tickers    || {};
    const generatedAt   = report?.generated_at || '';
    const macroThemes   = report?.macro_themes ?? [];

    if (generatedAt) {
      const lu = document.getElementById('last-updated');
      if (lu) lu.textContent = toJST(generatedAt);
    }

    // Fetch _poc.json for all config tickers (parallel)
    const allConfigTickers = Object.keys(configTickers);
    const hypeResults = await Promise.allSettled(
      allConfigTickers.map(async tk => {
        try {
          const r = await fetch(`${HYPE_BASE}${tk}_poc.json${TS}`);
          if (r.ok) return [tk, await r.json()];
        } catch (_) {}
        return [tk, null];
      })
    );
    const hypeMap = Object.fromEntries(
      hypeResults.map(r => r.value ?? [null, null]).filter(([k]) => k)
    );

    _state = { tickers, configTickers, candidates, macroThemes, generatedAt, themeConfig, hypeMap };

    let html = buildFilterBar(themeConfig);
    html += '<div id="ticker-section"></div>';

    // 🌐 新規発掘ゾーン
    html += '<div class="sec">🌐 新規発掘ゾーン</div>';

    // 🔭 特大テーマ候補（発掘銘柄カードの前に表示）
    if (macroThemes.length > 0) {
      const genDate = macroThemes[0]?.generated_at ?? '';
      html += `<div style="font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.1em;margin:0 0 12px;display:flex;align-items:center;gap:10px">
        📡 今週の特大テーマ候補
        <span style="color:var(--mut)">※ Grokの見解（参考）</span>
        ${genDate ? `<span style="color:var(--mut)">生成日: ${escHtml(genDate)}</span>` : ''}
      </div>`;
      for (const t of macroThemes) {
        const tkBadges = Array.isArray(t.related_tickers) && t.related_tickers.length > 0
          ? t.related_tickers.map(tk => `<span class="news-cat" style="color:var(--acc);background:rgba(6,182,212,.12)">${escHtml(tk)}</span>`).join('') : '';
        html += `<div class="theme-card">
          <div class="theme-name">${escHtml(t.theme || '')}</div>
          <div class="theme-meta">
            <span class="news-cat" style="color:var(--mut);background:var(--sur2)">時間軸: ${escHtml(t.horizon || '')}</span>
            ${t.conviction ? `<span class="news-cat conv-${escHtml(t.conviction)}">確信度: ${escHtml(t.conviction)}</span>` : ''}
          </div>
          <div style="font-size:13px;color:var(--txt);line-height:1.65;margin-bottom:10px">${escHtml(t.background || '')}</div>
          ${tkBadges ? `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px"><span style="font-family:var(--mono);font-size:11px;color:var(--mut)">関連銘柄:</span>${tkBadges}</div>` : ''}
          ${t.catalyst ? `<div style="font-size:12px;color:var(--mut)">📍 ${escHtml(t.catalyst)}</div>` : ''}
        </div>`;
      }
    }

    // ── 新規候補 ──
    html += '<div style="font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.1em;margin:20px 0 12px;display:flex;align-items:center;gap:10px">🔍 新規候補 — Grok発見</div>';
    if (candidates.length > 0) {
      html += '<div class="cand-grid">';
      for (const c of candidates) {
        const catalystBadge = c.catalyst_type ? `<span class="news-cat cand-catalyst">${escHtml(c.catalyst_type)}</span>` : '';
        const convBadge = c.conviction ? `<span class="news-cat conv-${escHtml(c.conviction)}">確信度: ${escHtml(c.conviction)}</span>` : '';
        const passBadges = Array.isArray(c.screening_pass) && c.screening_pass.length > 0
          ? c.screening_pass.map(p => `<span class="news-cat screen-pass">${escHtml(p)}</span>`).join('') : '';
        html += `<div class="cand-card">
          <div class="cand-ticker">${escHtml(c.ticker || '?')}</div>
          <div class="cand-company">${escHtml(c.company || '')}</div>
          <div class="cand-meta">
            <span class="cand-sector">${escHtml(c.sector || '')}</span>
            ${catalystBadge}${convBadge}
          </div>
          ${passBadges ? `<div class="cand-meta">${passBadges}</div>` : ''}
          <div class="cand-reason">${escHtml(c.reason || '')}</div>
          ${c.risk ? `<div class="cand-risk">⚠️ ${escHtml(c.risk)}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    } else {
      html += '<div style="font-family:var(--mono);font-size:12px;color:var(--mut);padding:10px 0">候補データなし</div>';
    }

    // 📊 テーマ別サマリー
    if (themeConfig) {
      html += buildThemeSummarySection(themeConfig, configTickers, tickers, hypeMap);
    }

    if (generatedAt) {
      const dt = new Date(generatedAt);
      const label = dt.toLocaleString('ja-JP', {timeZone:'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
      html += `<div class="updated">最終更新: ${label} JST</div>`;
    }

    app.innerHTML = html;
    renderTickerSection();

  } catch (e) {
    app.innerHTML = `<div class="loading" style="color:var(--red)">エラー: ${e.message}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toJST(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr.slice(0, 10);
  return d.toLocaleString('ja-JP', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function toggleCard(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const body = card.querySelector('.ticker-card-body');
  const icon = card.querySelector('.card-toggle-icon');
  const collapsed = card.hasAttribute('data-collapsed');
  if (collapsed) {
    card.removeAttribute('data-collapsed');
    body.style.display = '';
    if (icon) icon.textContent = '▼';
  } else {
    card.setAttribute('data-collapsed', '');
    body.style.display = 'none';
    if (icon) icon.textContent = '▶';
  }
}

function toggleLow(btn, id) {
  const div = document.getElementById(id);
  if (!div) return;
  const hidden = div.style.display === 'none';
  div.style.display = hidden ? '' : 'none';
  const n = div.querySelectorAll('.news-item').length;
  btn.textContent = hidden
    ? '▲ 低重要度ニュースを折りたたむ'
    : '▼ 低重要度ニュースを表示（' + n + '件）';
}

function toggleNoNewsZone() {
  const zone = document.getElementById('no-news-zone');
  const btn  = document.getElementById('no-news-btn');
  if (!zone) return;
  const hidden = zone.style.display === 'none';
  zone.style.display = hidden ? '' : 'none';
  if (btn) {
    const n = zone.querySelectorAll('.ticker-card').length;
    btn.textContent = hidden ? `ニュースなし ${n}銘柄を非表示` : `ニュースなし ${n}銘柄を表示`;
  }
}

function toggleCond(btn, id) {
  const body = document.getElementById(id);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  btn.textContent = hidden ? '▲ 詳細を閉じる' : '▼ 詳細';
}

loadData();
</script>
  <script src="../common/site-nav.js"></script>
