<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニュース履歴 — DISCOVER</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0d14;--sur:#111520;--sur2:#161c2d;--bdr:#1e2840;
      --acc:#06b6d4;--grn:#10b981;--red:#f43f5e;--amb:#f59e0b;--pur:#8b5cf6;
      --txt:#e2e8f0;--sub:#7a92b0;--mut:#64748b;
      --mono:'Space Mono',monospace;--sans:'DM Sans','Noto Sans JP',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px}
    .shell{max-width:1100px;margin:0 auto;padding:0 16px 60px}

    header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;border-bottom:1px solid var(--bdr);margin-bottom:20px;flex-wrap:wrap;gap:8px}
    .logo{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--txt);text-decoration:none;display:flex;align-items:center;gap:10px}
    .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}

    /* controls */
    .controls{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;padding:12px 16px;background:var(--sur);border:1px solid var(--bdr)}
    .ctrl-group{display:flex;align-items:center;gap:8px}
    .ctrl-label{font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
    .ctrl-group select,.ctrl-group input{
      background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);
      font-family:var(--mono);font-size:11px;padding:5px 10px;outline:none;
      transition:border-color .15s;
    }
    .ctrl-group select:focus,.ctrl-group input:focus{border-color:var(--acc)}

    /* date section */
    .date-section{margin-bottom:24px}
    .date-header{
      font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--sub);
      display:flex;align-items:center;gap:10px;margin-bottom:10px;
    }
    .date-header::after{content:'';flex:1;height:1px;background:var(--bdr)}

    /* ticker card */
    .ticker-card{background:var(--sur);border:1px solid var(--bdr);margin-bottom:8px}
    .ticker-card-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bdr)}
    .tc-ticker{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--acc);min-width:64px}
    .tc-change{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:2px;flex-shrink:0}
    .tc-change.pos{background:rgba(16,185,129,.12);color:var(--grn)}
    .tc-change.neg{background:rgba(244,63,94,.12);color:var(--red)}
    .tc-change.nil{background:rgba(100,116,139,.1);color:var(--mut)}
    .tc-summary{font-size:11px;color:var(--sub);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}

    /* news items */
    .news-list{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
    .news-item{background:var(--sur2);border:1px solid var(--bdr);padding:10px 14px}
    .news-item-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
    .news-imp{font-family:var(--mono);font-size:9px;padding:2px 6px}
    .imp-高{background:rgba(244,63,94,.15);color:var(--red)}
    .imp-中{background:rgba(245,158,11,.12);color:var(--amb)}
    .imp-低{background:rgba(100,116,139,.1);color:var(--mut)}
    .news-cat{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px}
    .cat-カタリスト{background:rgba(16,185,129,.12);color:var(--grn)}
    .cat-リスク{background:rgba(244,63,94,.12);color:var(--red)}
    .cat-ブレイクスルー{background:rgba(139,92,246,.12);color:var(--pur)}
    .cat-一般{background:rgba(100,116,139,.1);color:var(--mut)}
    .news-title{font-size:12px;color:var(--txt)}
    .news-title-link{color:var(--txt);text-decoration:none;transition:color .15s}
    .news-title-link:hover{color:var(--acc);text-decoration:underline}
    .news-sum{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.55}
    .news-source{font-size:10px;color:var(--mut);margin-top:3px}

    /* loading / empty */
    .loading,.empty{font-family:var(--mono);font-size:12px;color:var(--mut);padding:48px 0;text-align:center}

    @media(max-width:640px){.tc-summary{display:none}}
  </style>
  <link rel="stylesheet" href="../common/site-theme.css">
</head>
<body data-tool="news-history">
<div class="shell">

  <header>
    <a href="../" class="logo">
      <img src="../common/images/logo.png" alt="ON A JOURNEY" style="height:28px;width:auto;object-fit:contain">
      <span class="logo-dot"></span>
      DISCOVER · ニュース履歴
    </a>
    <nav class="nav-links"></nav>
  </header>

  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">月</span>
      <select id="month-sel"></select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">銘柄</span>
      <input type="text" id="ticker-filter" placeholder="例: NVDA" style="width:110px">
    </div>
  </div>

  <div id="content"><div class="loading">読み込み中...</div></div>

</div>

<script src="../common/site-nav.js"></script>
<script>
(function () {
  var BASE_DATA = '/On-a-journey/discover/data/';

  var monthSel = document.getElementById('month-sel');
  var filterInput = document.getElementById('ticker-filter');
  var contentEl = document.getElementById('content');

  // 月選択肢（今月から12ヶ月前まで）
  var now = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var opt = document.createElement('option');
    opt.value = y + '_' + m;
    opt.textContent = y + '年' + (d.getMonth() + 1) + '月';
    monthSel.appendChild(opt);
  }

  var currentData = null;

  function loadMonth(ym) {
    contentEl.innerHTML = '<div class="loading">読み込み中...</div>';
    fetch(BASE_DATA + 'news_history_' + ym + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (data) {
        currentData = data;
        render();
      })
      .catch(function () {
        contentEl.innerHTML = '<div class="empty">データがありません</div>';
      });
  }

  function render() {
    if (!currentData) return;
    var filterVal = filterInput.value.trim().toUpperCase();
    var dates = Object.keys(currentData).sort().reverse();
    var html = '';

    dates.forEach(function (dateStr) {
      var dayData = currentData[dateStr];
      var tickers = Object.keys(dayData).filter(function (t) {
        return !filterVal || t.toUpperCase().includes(filterVal);
      });
      var hasItems = tickers.some(function (t) { return (dayData[t].items || []).length > 0; });
      if (tickers.length === 0 || !hasItems) return;

      html += '<div class="date-section">';
      html += '<div class="date-header">' + esc(dateStr) + '</div>';

      tickers.forEach(function (ticker) {
        var td = dayData[ticker];
        var items = td.items || [];
        if (items.length === 0) return;

        // price_change_next_day: 全itemで共通値
        var change = (items.length > 0 && 'price_change_next_day' in items[0])
          ? items[0].price_change_next_day : undefined;
        var changeHtml;
        if (change === null || change === undefined) {
          changeHtml = '<span class="tc-change nil">—</span>';
        } else if (change > 0) {
          changeHtml = '<span class="tc-change pos">↑ +' + change.toFixed(2) + '%</span>';
        } else {
          changeHtml = '<span class="tc-change neg">↓ ' + change.toFixed(2) + '%</span>';
        }

        html += '<div class="ticker-card">';
        html += '<div class="ticker-card-head">';
        html += '<span class="tc-ticker">' + esc(ticker) + '</span>';
        html += changeHtml;
        if (td.summary) {
          html += '<span class="tc-summary">' + esc(td.summary) + '</span>';
        }
        html += '</div>';

        html += '<div class="news-list">';
        items.forEach(function (item) {
          var imp = item.importance || '低';
          var cat = item.category  || '一般';
          html += '<div class="news-item">';
          html += '<div class="news-item-head">';
          html += '<span class="news-imp imp-' + esc(imp) + '">' + esc(imp) + '</span>';
          html += '<span class="news-cat cat-' + esc(cat) + '">' + esc(cat) + '</span>';
          html += '</div>';
          if (item.url) {
            html += '<div class="news-title"><a class="news-title-link" href="' + esc(item.url) + '" target="_blank" rel="noopener">' + esc(item.title || '') + '</a></div>';
          } else {
            html += '<div class="news-title">' + esc(item.title || '') + '</div>';
          }
          if (item.summary) {
            html += '<div class="news-sum">' + esc(item.summary) + '</div>';
          }
          if (item.source || item.published_at) {
            var src = [item.source, item.published_at].filter(Boolean).join(' · ');
            html += '<div class="news-source">' + esc(src) + '</div>';
          }
          html += '</div>'; // .news-item
        });
        html += '</div>'; // .news-list
        html += '</div>'; // .ticker-card
      });

      html += '</div>'; // .date-section
    });

    contentEl.innerHTML = html || '<div class="empty">表示できるデータがありません</div>';
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  monthSel.addEventListener('change', function () { loadMonth(this.value); });
  filterInput.addEventListener('input', render);

  loadMonth(monthSel.value);
})();
</script>
</body>
</html>
