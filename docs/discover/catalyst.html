<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カタリスト — DISCOVER</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0d14;--sur:#111520;--sur2:#161c2d;--bdr:#1e2840;
      --acc:#06b6d4;--grn:#10b981;--red:#f43f5e;--amb:#f59e0b;--pur:#8b5cf6;--blu:#3b82f6;
      --txt:#e2e8f0;--sub:#7a92b0;--mut:#64748b;
      --mono:'Space Mono',monospace;--sans:'DM Sans','Noto Sans JP',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px}
    .shell{max-width:1160px;margin:0 auto;padding:0 16px 60px}

    /* ── ヘッダー ── */
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;border-bottom:1px solid var(--bdr);margin-bottom:20px;flex-wrap:wrap;gap:8px}
    .logo{font-family:var(--mono);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--txt);text-decoration:none;display:flex;align-items:center;gap:10px}
    .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}

    /* ── フィルターバー ── */
    .filter-bar{background:var(--sur);border:1px solid var(--bdr);padding:12px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .filter-group{display:flex;align-items:center;gap:6px}
    .filter-label{font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:.06em;white-space:nowrap}
    .filter-group select,.filter-group input{
      background:var(--sur2);border:1px solid var(--bdr);color:var(--txt);
      font-family:var(--mono);font-size:11px;padding:4px 9px;outline:none;
      transition:border-color .15s;
    }
    .filter-group select:focus,.filter-group input:focus{border-color:var(--acc)}
    .filter-count{font-family:var(--mono);font-size:10px;color:var(--mut);margin-left:auto}

    /* ── 銘柄カード ── */
    .ticker-card{background:var(--sur);border:1px solid var(--bdr);margin-bottom:12px}
    .ticker-card-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr)}
    .tc-ticker{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--acc)}
    .tc-stats{font-family:var(--mono);font-size:10px;color:var(--mut);margin-left:auto;display:flex;gap:10px}
    .tc-updated{font-size:10px;color:var(--mut);font-family:var(--mono)}

    /* ── カタリストリスト ── */
    .catalyst-list{display:flex;flex-direction:column;gap:0}
    .catalyst-item{border-bottom:1px solid var(--bdr);padding:10px 16px;transition:background .1s}
    .catalyst-item:last-child{border-bottom:none}
    .catalyst-item:hover{background:var(--sur2)}

    .ci-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;flex-wrap:wrap}
    .ci-title{font-size:13px;color:var(--txt);font-weight:500;flex:1;min-width:0}
    .ci-badges{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap}

    /* statusバッジ */
    .badge-status{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:2px;white-space:nowrap}
    .status-未達{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
    .status-達成済み{background:rgba(16,185,129,.12);color:var(--grn);border:1px solid rgba(16,185,129,.2)}
    .status-消滅{background:rgba(100,116,139,.1);color:var(--mut);border:1px solid rgba(100,116,139,.2)}

    /* importanceバッジ */
    .badge-imp{font-family:var(--mono);font-size:9px;padding:2px 6px;white-space:nowrap}
    .imp-高{background:rgba(244,63,94,.15);color:var(--red)}
    .imp-中{background:rgba(245,158,11,.12);color:var(--amb)}
    .imp-低{background:rgba(100,116,139,.1);color:var(--mut)}

    /* typeバッジ */
    .badge-type{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px;white-space:nowrap}
    .type-確定{background:rgba(139,92,246,.12);color:var(--pur)}
    .type-不確定{background:rgba(100,116,139,.1);color:var(--mut)}

    /* probabilityバッジ */
    .badge-prob{font-family:var(--mono);font-size:9px;padding:2px 6px;white-space:nowrap;color:var(--mut)}

    .ci-detail{font-size:11px;color:var(--sub);line-height:1.55;margin-top:3px}
    .ci-meta{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
    .ci-timing{font-family:var(--mono);font-size:10px;color:var(--sub)}
    .ci-detected{font-family:var(--mono);font-size:10px;color:var(--mut)}

    /* ── 達成済み/消滅折りたたみ ── */
    .archived-section{border-top:1px solid var(--bdr)}
    .archived-toggle{
      width:100%;background:none;border:none;border-top:1px solid var(--bdr);
      color:var(--mut);font-family:var(--mono);font-size:10px;padding:7px 16px;
      cursor:pointer;text-align:left;letter-spacing:.05em;
      transition:color .15s,background .15s;display:flex;align-items:center;gap:6px;
    }
    .archived-toggle:hover{color:var(--acc);background:rgba(6,182,212,.04)}
    .archived-toggle .toggle-arrow{transition:transform .2s}
    .archived-toggle.open .toggle-arrow{transform:rotate(90deg)}
    .archived-body{display:none}
    .archived-body.open{display:block}

    /* ── ローディング / エラー ── */
    .loading,.empty{font-family:var(--mono);font-size:12px;color:var(--mut);padding:48px 0;text-align:center}

    /* ── 更新日時 ── */
    .generated{font-family:var(--mono);font-size:10px;color:var(--mut);text-align:right;margin-bottom:14px}

    @media(max-width:640px){
      .tc-stats{display:none}
      .filter-count{display:none}
      .ci-badges{width:100%}
    }
  </style>
  <link rel="stylesheet" href="../common/site-theme.css">
</head>
<body data-tool="catalyst">
<div class="shell">

  <header>
    <a class="logo"
       data-title="CATALYST TRACKER"
       data-subtitle="カタリスト発掘・追跡"
       href="../">
      <span class="logo-dot"></span>CATALYST TRACKER
    </a>
    <nav class="nav-links"></nav>
  </header>

  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">重要度</span>
      <select id="f-imp">
        <option value="">すべて</option>
        <option value="高">高</option>
        <option value="中">中</option>
        <option value="低">低</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">種別</span>
      <select id="f-type">
        <option value="">すべて</option>
        <option value="確定イベント">確定イベント</option>
        <option value="不確定シナリオ">不確定シナリオ</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">ステータス</span>
      <select id="f-status">
        <option value="未達">未達</option>
        <option value="">すべて</option>
        <option value="達成済み">達成済み</option>
        <option value="消滅">消滅</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">銘柄</span>
      <input type="text" id="f-ticker" placeholder="例: NVDA" style="width:100px">
    </div>
    <span class="filter-count" id="filter-count"></span>
  </div>

  <div class="generated" id="generated-at"></div>
  <div id="content"><div class="loading">読み込み中...</div></div>

</div>

<script src="../common/site-header.js"></script>
<script src="../common/site-nav.js"></script>
<script>
(function () {
  var BASE_DATA = '/On-a-journey/discover/data/catalyst.json';

  var fImp    = document.getElementById('f-imp');
  var fType   = document.getElementById('f-type');
  var fStatus = document.getElementById('f-status');
  var fTicker = document.getElementById('f-ticker');
  var content = document.getElementById('content');
  var countEl = document.getElementById('filter-count');
  var genEl   = document.getElementById('generated-at');

  var allData = null;

  function loadData() {
    fetch(BASE_DATA + '?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (data) {
        allData = data;
        if (data.generated_at) {
          genEl.textContent = '生成: ' + data.generated_at.replace('T', ' ').slice(0, 16);
        }
        render();
      })
      .catch(function (e) {
        content.innerHTML = '<div class="empty">データがありません (' + e.message + ')</div>';
      });
  }

  function render() {
    if (!allData) return;
    var impF    = fImp.value;
    var typeF   = fType.value;
    var statusF = fStatus.value;
    var tickerF = fTicker.value.trim().toUpperCase();

    var tickers = Object.keys(allData.tickers || {}).sort();
    if (tickerF) {
      tickers = tickers.filter(function (t) { return t.includes(tickerF); });
    }

    var totalCards = 0;
    var html = '';

    tickers.forEach(function (ticker) {
      var td = allData.tickers[ticker];
      var all = td.catalysts || [];

      // フィルター適用（active=未達優先）
      var active = all.filter(function (c) {
        return c.status === '未達' &&
          (!impF    || c.importance === impF) &&
          (!typeF   || c.type === typeF);
      });
      var archived = all.filter(function (c) {
        return c.status !== '未達' &&
          (!impF    || c.importance === impF) &&
          (!typeF   || c.type === typeF);
      });

      // ステータスフィルター
      if (statusF === '未達') { archived = []; }
      else if (statusF === '達成済み') { active = []; archived = archived.filter(function (c) { return c.status === '達成済み'; }); }
      else if (statusF === '消滅')    { active = []; archived = archived.filter(function (c) { return c.status === '消滅'; }); }

      if (active.length === 0 && archived.length === 0) return;
      totalCards++;

      // 重要度順ソート
      var impOrder = {'高': 0, '中': 1, '低': 2};
      active.sort(function (a, b) { return (impOrder[a.importance] || 1) - (impOrder[b.importance] || 1); });
      archived.sort(function (a, b) { return (impOrder[a.importance] || 1) - (impOrder[b.importance] || 1); });

      html += '<div class="ticker-card">';
      html += '<div class="ticker-card-head">';
      html += '<span class="tc-ticker">' + esc(ticker) + '</span>';
      html += '<div class="tc-stats">';
      if (active.length)   html += '<span>未達 ' + active.length + '</span>';
      if (archived.length) html += '<span>完了/消滅 ' + archived.length + '</span>';
      html += '</div>';
      if (td.updated_at) html += '<span class="tc-updated">' + esc(td.updated_at) + '</span>';
      html += '</div>';

      // active catalysts
      html += '<div class="catalyst-list">';
      active.forEach(function (c) { html += renderItem(c); });
      html += '</div>';

      // archived（折りたたみ）
      if (archived.length > 0) {
        html += '<button class="archived-toggle" onclick="toggleArchive(this)">';
        html += '<span class="toggle-arrow">▶</span> 達成済み・消滅 (' + archived.length + '件)';
        html += '</button>';
        html += '<div class="archived-body">';
        html += '<div class="catalyst-list">';
        archived.forEach(function (c) { html += renderItem(c); });
        html += '</div></div>';
      }

      html += '</div>'; // .ticker-card
    });

    content.innerHTML = html || '<div class="empty">条件に合うカタリストがありません</div>';
    countEl.textContent = totalCards + '銘柄';
  }

  function renderItem(c) {
    var typeClass = (c.type === '確定イベント') ? 'type-確定' : 'type-不確定';
    var typeLabel = (c.type === '確定イベント') ? '確定' : '不確定';
    var h = '<div class="catalyst-item">';
    h += '<div class="ci-head">';
    h += '<span class="ci-title">' + esc(c.title || '') + '</span>';
    h += '<div class="ci-badges">';
    h += '<span class="badge-status status-' + esc(c.status || '未達') + '">' + esc(c.status || '未達') + '</span>';
    h += '<span class="badge-imp imp-' + esc(c.importance || '中') + '">' + esc(c.importance || '中') + '</span>';
    h += '<span class="badge-type ' + typeClass + '">' + typeLabel + '</span>';
    h += '<span class="badge-prob">確率:' + esc(c.probability || '中') + '</span>';
    h += '</div></div>';
    if (c.detail) {
      h += '<div class="ci-detail">' + esc(c.detail) + '</div>';
    }
    h += '<div class="ci-meta">';
    if (c.timing) h += '<span class="ci-timing">⏱ ' + esc(c.timing) + '</span>';
    if (c.first_detected) h += '<span class="ci-detected">初回: ' + esc(c.first_detected) + '</span>';
    h += '</div>';
    h += '</div>';
    return h;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  window.toggleArchive = function (btn) {
    btn.classList.toggle('open');
    var body = btn.nextElementSibling;
    body.classList.toggle('open');
  };

  [fImp, fType, fStatus].forEach(function (el) {
    el.addEventListener('change', render);
  });
  fTicker.addEventListener('input', render);

  loadData();
})();
</script>
</body>
</html>
