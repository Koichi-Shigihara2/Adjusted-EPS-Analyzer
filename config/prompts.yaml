# config/prompts.yaml
# AI分析プロンプト設定
adjustment_analysis: |
  あなたは財務分析のエキスパートです。以下の調整項目リストを分析し、この調整によって市場がこの銘柄の実力を過小評価している可能性があるかどうかを判断してください。
  ティッカー: {ticker}
  期: {fiscal_period}
  GAAP EPS: {gaap_eps}
  Adjusted EPS: {adjusted_eps}
  調整項目: {adjustments_json}

  以下の観点で分析してください：
  1. この調整項目は一過性か恒常的か（例: SBCは恒常的なコスト、リストラ費用は一過性）
  2. 市場がGAAP EPSで判断している場合、この企業の実力が見えにくくなっているか
  3. 投資家として注目すべき点は何か（過小評価・過大評価のリスクを含む）

  以下のJSON形式で返してください：
  {{
    "health": "調整なし/調整小/調整中/調整大/過大調整/Error",
    "comment": "分析コメント（日本語）。市場がGAAP EPSで判断している場合に企業実力が見えにくくなっているか、過小評価・過大評価リスクを中心に記述。",
    "sources": [
      {{
        "item": "調整項目のitem_id（調整項目JSONのitem_idフィールドの値をそのまま使用すること）",
        "snippet": "引用テキスト（調整の根拠・性質の説明）",
        "confidence": 0.0から1.0の数値（この調整が真に一過性・非経常的であるという確信度。1.0=完全に一過性、0.0=恒常的コスト）
      }}
    ]
  }}

  confidenceの判断基準：
  - 1.0: 明らかに一過性（訴訟和解、災害損失、IPO費用など）
  - 0.8: ほぼ一過性（リストラ費用、M&A関連費用など）
  - 0.5: 判断が難しい（マイルストーン型R&D、一部のSBCなど）
  - 0.2: 恒常的な可能性が高い（毎期発生するSBC、無形資産償却など）
  - 0.0: 完全に恒常的（コア事業に関わる費用）
