name: Market Data Daily Update

on:
  schedule:
    - cron: '40 21 * * 1-5'  # UTC 21:40 (JST 翌6:40) 平日、市場クローズ後。
                              # Market_Pulse_Update.yml(21:35 UTC)と近接だが
                              # 完全同時刻は避けてリクエスト集中を分散（設計確定事項8）
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for full universe: S&P500+monitor+index/ETF/commodity)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

# ─────────────────────────────────────────────────────────────────
# [[TANUKI-VALUATION-PRICE-SCHEDULE-LAG-1]] 2026-08-22: 上記の準備メモを
# 有効化した。TANUKI_VALUATION_Update.ymlの`on.workflow_run.workflows`に
# "Market Data Daily Update"を追加し、本ワークフロー完了後に連鎖実行する
# ようになった（TANUKI_VALUATION_Update.yml側で実装。本ファイル自体の
# 変更はこのコメント更新のみ）。旧・独立cron（14:05 UTC、本ワークフロー
# の21:40 UTC完了より先に発火してしまいcurrent_priceが常に前営業日終値
# になっていた）は削除し、週1回の安全網cronのみ残した。
#
# 【新たに判明した同型の未対応ギャップ（今回のスコープ外・報告のみ）】
# Stonks_Silo_Update.yml（cron 15:05 UTC）も自身のvaluation_fetcher.py
# 経由でcommon/market_data/daily/の日次終値に依存しているが、本
# ワークフロー（21:40 UTC完了）より先に発火するため、TANUKI VALUATIONと
# 同種の「常に前営業日終値を参照する」構造的ラグを抱えている可能性が
# 高い。今回はTANUKI_VALUATION_Update用のworkflow_run連鎖のみ対応し、
# Stonks_Silo_Update側への同種対応は意図的にスコープ外とした
# （[[STONKS-SILO-PRICE-SCHEDULE-LAG-SUSPECT-1]]として別途登録）。
# ─────────────────────────────────────────────────────────────────

jobs:
  update-market-data-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run fetch_daily_prices
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python common/market_data/fetcher.py $TICKERS --layer daily
          else
            python common/market_data/fetcher.py --layer daily
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add common/market_data/daily/ || true
          git add common/market_data/*/market_data_violations_log.json || true
          git add common/market_data/_sp500_constituents_cache.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Market Data Daily - $(date +'%Y-%m-%d')"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Market Data Daily Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          count=$(ls -1 common/market_data/daily/*.json 2>/dev/null | wc -l)
          echo "daily/ 保存銘柄数: ${count}" >> $GITHUB_STEP_SUMMARY
