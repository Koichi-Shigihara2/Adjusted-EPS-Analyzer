name: Discover Update

on:
  schedule:
    - cron: "3 22 * * *"  # 毎日 JST 7:03 (UTC 22:03前日)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリインストール
        run: pip install requests

      - name: 情報収集実行
        env:
          XAI_API_KEY:  ${{ secrets.XAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python src/discover/collect.py

      - name: データファイルをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/discover/data/daily_report.json
          git add docs/discover/data/macro_themes_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: auto-update discover data $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi
