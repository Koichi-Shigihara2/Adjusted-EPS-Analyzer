name: 01_ShortsellerNews

on:
  schedule:
    - cron: '55 21 * * *'   # JST 朝6:55
    - cron: '55 9 * * *'    # JST 夕18:55
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリインストール
        run: |
          pip install -r src/subport/short_report/requirements.txt

      - name: ショートセラー監視 + スクリーニング実行
        env:
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:   ${{ secrets.GMAIL_PASSWORD }}
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
        run: |
          python src/subport/short_report/news_bot.py

      - name: 状態ファイルをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/subport/short_report/processed_content.json \
                  src/subport/short_report/state.json \
                  src/subport/short_report/trades.csv || true
          git diff --staged --quiet || git commit -m "chore: update short-report state [skip ci]"
          git push
