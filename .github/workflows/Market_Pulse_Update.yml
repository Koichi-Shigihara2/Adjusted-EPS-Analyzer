name: Market_Pulse_Update

on:
  schedule:
    - cron: "35 21 * * 1-5"  # UTC21:35=JST翌6:35頃、月〜金のみ
                              # （2026-09-02: Market_Data_Daily_Update
                              # と同時刻〈21:25〉に揃えたところpush競合
                              # リスクが再発したため、元の10分差に復元。
                              # 7時台閲覧目標には引き続き十分な余裕あり）
  workflow_dispatch:
    branches:
      - kaihatsu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml html5lib

      - name: Run breadth calculator
        run: |
          python src/market/market_pulse/breadth_calculator.py

      - name: Run collect_and_send
        env:
          XAI_API_KEY:     ${{ secrets.XAI_API_KEY }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
        run: |
          python src/market/market_pulse/collect_and_send.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/market-monitor/market-pulse/data/
          git diff --staged --quiet || git commit -m "chore: auto-update market pulse data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
