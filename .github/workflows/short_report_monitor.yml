name: Short Report Monitor

on:
  schedule:
    - cron: "30 22 * * 1-5"  # 毎営業日 JST 7:15 (UTC 22:30前日)
  workflow_dispatch:

jobs:
  # ── ショートセラーニュース監視 + スクリーニング ──────────────
  news:
    name: ショートセラーニュース監視
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: pip install -r src/subport/short_report/requirements.txt

      - name: ショートセラー監視実行
        env:
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
        run: python src/subport/short_report/news_bot.py

      - name: 状態ファイルをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin kaihatsu
          git stash pop
          for f in \
            src/subport/short_report/processed_content.json \
            src/subport/short_report/state.json \
            src/subport/short_report/trades.csv
          do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "chore: update short-report state [skip ci]"
          git push origin kaihatsu

  # ── ポジション監視（日次） ─────────────────────────────────
  monitor:
    name: ポジション監視
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: pip install yfinance requests pandas

      - name: ポジション監視実行
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
        run: |
          cd src/subport/short_report
          python position_manager.py

      - name: state.json をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/subport/short_report/state.json \
                  src/subport/short_report/trades.csv || true
          git diff --staged --quiet || git commit -m "chore: update position state [skip ci]"
          git push origin kaihatsu
