name: TANUKI TAIL Satellite Monitor

on:
  schedule:
    - cron: '0 23 * * 0-4'  # 平日 UTC 23:00 = JST 翌 08:00
    - cron: '0 8 * * 1-5'   # 平日 UTC 08:00 = JST 17:00
  workflow_dispatch:
    inputs:
      ticker:
        description: '対象ティッカー（スペース区切り、空白で全satellite）'
        required: false
        default: ''
      skip_news:
        description: 'Grokニュース検索をスキップ（true/false）'
        required: false
        default: 'false'

env:
  TZ: Asia/Tokyo

jobs:
  satellite-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run satellite monitor
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            ARGS="--ticker ${{ github.event.inputs.ticker }}"
          fi
          if [ "${{ github.event.inputs.skip_news }}" = "true" ]; then
            ARGS="$ARGS --skip-news"
          fi
          python src/tail/satellite_monitor.py $ARGS

      - name: Commit updated alert history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio/tail/data/satellite_alerts.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: satellite_alerts 更新 $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi
