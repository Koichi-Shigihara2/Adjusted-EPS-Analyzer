name: Catalyst Update

on:
  schedule:
    - cron: "30 14 * * 0"  # 毎週日曜 JST 23:30 (UTC 14:30) - HypeCore_Update の1時間後
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for all hypecore=true)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-catalyst:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run Catalyst Pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python src/discover/catalyst.py --ticker "${{ github.event.inputs.tickers }}"
          else
            python src/discover/catalyst.py --all
          fi

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/discover/data/catalyst.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "[CI] Catalyst update $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi
