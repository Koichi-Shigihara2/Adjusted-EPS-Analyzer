name: Score Verifier

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 JST 9:00（UTC 0:00）
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run score_verifier
        run: python src/value/tanuki_valuation/score_verifier.py

      - name: Commit if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/value-monitor/tanuki_valuation/data/*/score_history.json
          if git diff --staged --quiet; then
            echo "更新なし（30d/60d/90d いずれもまだ経過していないか取得失敗）"
          else
            git commit -m "chore: score_verifier 自動更新 $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi
