name: Stonks Silo Update

on:
  schedule:
    - cron: '5 15 * * 1-5'  # UTC 15:05 (JST 翌0:05) weekdays
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for stonks_silo=true all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-stonks-silo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stonks Silo Pipeline
        working-directory: discover/stonks-silo/src
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/stonks-silo/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Stonks Silo - $(date +'%Y-%m-%d %H:%M') JST"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Stonks Silo Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Verdict | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:--------|------:|" >> $GITHUB_STEP_SUMMARY
          python - << 'EOF'
          import json, os
          path = "docs/value-monitor/stonks-silo/data/results.json"
          if not os.path.exists(path):
              print("results.json not found")
          else:
              with open(path) as f:
                  data = json.load(f)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  for ticker, info in data.get("tickers", {}).items():
                      verdict = info.get("overall_verdict", "--")
                      score = info.get("overall_score", "--")
                      out.write(f"| {ticker} | {verdict} | {score} |\n")
          EOF
