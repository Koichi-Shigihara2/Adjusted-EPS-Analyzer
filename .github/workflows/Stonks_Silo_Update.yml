name: Stonks Silo Update

# [[WORKFLOW-SEC-TANUKI-GAP-1]]対応: config/workflow_dependencies.jsonが
# 定義するSEC_Data_Update依存をworkflow_runで追加（SEC更新完了後、
# 既存の平日cronの実行を待たず即座に反映）。既存の平日日次cronは
# 削除せず維持する — valuation_fetcher.pyがcommon/market_data/daily/の
# 日次終値にも依存しており、SEC_Data_Update（週次）だけをトリガーに
# するとその依存を満たせなくなる（案②: フォールバックではなく
# 「別の鮮度要件を満たす並行トリガー」として意図的に併存）。
on:
  workflow_run:
    workflows: ["SEC Data Update"]
    types: [completed]
  schedule:
    - cron: '5 15 * * 1-5'  # UTC 15:05 (JST 翌0:05) weekdays — 日次価格鮮度用
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Target tickers (comma-separated, blank for stonks_silo=true all)'
        required: false
        default: ''

env:
  TZ: Asia/Tokyo

jobs:
  update-stonks-silo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stonks Silo Pipeline
        working-directory: discover/stonks-silo/src
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            TICKERS=$(echo "${{ github.event.inputs.tickers }}" | tr ',' ' ')
            python pipeline.py $TICKERS
          else
            python pipeline.py
          fi

      - name: Consistency Check Gate
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet --ticker "${{ github.event.inputs.tickers }}"
          else
            python common/sec_data/report_consistency_check.py --fail-on-ng --quiet
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/value-monitor/stonks-silo/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Stonks Silo - $(date +'%Y-%m-%d %H:%M') JST"
            git pull --rebase origin kaihatsu
            git push origin kaihatsu
          fi

      - name: Summary
        run: |
          echo "## Stonks Silo Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ticker | Verdict | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|:-------|:--------|------:|" >> $GITHUB_STEP_SUMMARY
          python - << 'EOF'
          import json, os
          path = "docs/value-monitor/stonks-silo/data/results.json"
          if not os.path.exists(path):
              print("results.json not found")
          else:
              with open(path) as f:
                  data = json.load(f)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  for ticker, info in data.get("tickers", {}).items():
                      verdict = info.get("overall_verdict", "--")
                      score = info.get("overall_score", "--")
                      out.write(f"| {ticker} | {verdict} | {score} |\n")
          EOF
