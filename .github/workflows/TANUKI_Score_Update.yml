name: TANUKI_Score_Update

on:
  schedule:
    - cron: "30 13 * * *"   # JST 22:30（UTC 13:30）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run daily_pick
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python src/value/tanuki_score/daily_pick.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/integrated-dashboard/daily_pick.json \
                  docs/integrated-dashboard/history.json
          git diff --staged --quiet || git commit -m \
            "chore: auto-update TANUKI SCORE daily pick $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
