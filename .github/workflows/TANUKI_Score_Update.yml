name: TANUKI_Score_Update

# ARCH-SCORE-SYNC-1: daily_pick.pyはpipeline.py(latest.json)の6分類に依存するため、
# cron時刻の差ではなくworkflow_runイベントでTANUKI VALUATION完了後を確実に保証する。
# pipeline.pyは平日のみ実行のため、土日は独立cronで現状通り実行する
# （金曜時点のlatest.jsonを参照。pipeline.py自体が動かないのは従来からの制約で変更なし）。
on:
  workflow_run:
    workflows: ["TANUKI VALUATION Daily Update"]
    types: [completed]
  schedule:
    - cron: "30 13 * * 6,0"   # 土日のみ独立実行（JST 22:30）
  workflow_dispatch:

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run daily_pick
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python src/value/tanuki_score/daily_pick.py

      - name: Portfolio snapshot
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python src/portfolio/snapshot.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git add docs/integrated-dashboard/daily_pick.json \
                  docs/integrated-dashboard/history.json \
                  docs/portfolio/data/history.json
          git diff --staged --quiet || git commit -m \
            "chore: auto-update TANUKI SCORE daily pick $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin kaihatsu
          git push origin kaihatsu
