name: Short Report Screener

on:
  # 毎営業日 米国市場終値確定後（日本時間 朝7時 = UTC 22:00前日）
  schedule:
    - cron: "0 22 * * 1-5"

  # 手動実行（ショートレポート発見時）
  workflow_dispatch:
    inputs:
      ticker:
        description: "対象ティッカー（例: ACME）"
        required: true
        type: string
      report_url:
        description: "レポートURL（任意）"
        required: false
        type: string
      report_text:
        description: "レポート要約（任意・URL未指定時）"
        required: false
        type: string
      impact_score:
        description: "インパクトスコアを手動指定（0-100、Grok API不使用時）"
        required: false
        type: string
      dry_run:
        description: "DRY RUN（通知・状態更新なし）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  # ============================================================
  # Job 1: 毎日の定期実行（ポジション監視）
  # ============================================================
  monitor:
    name: ポジション監視（日次）
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: |
          pip install yfinance requests pandas

      - name: ポジション監視実行
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
        run: |
          cd src/subport/short_report
          python position_manager.py

      - name: state.json をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/subport/short_report/state.json \
                  src/subport/short_report/trades.csv || true
          git diff --staged --quiet || git commit -m "chore: update position state [skip ci]"
          git push

  # ============================================================
  # Job 2: 手動実行（ショートレポート発見時にスクリーニング）
  # ============================================================
  screen:
    name: スクリーニング（手動）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリインストール
        run: |
          pip install yfinance requests pandas

      - name: スクリーニング実行
        env:
          DISCORD_WEB_HOOK: ${{ secrets.DISCORD_WEB_HOOK }}
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
        run: |
          cd src/subport/short_report

          # 引数を組み立て
          ARGS="--ticker ${{ github.event.inputs.ticker }}"

          if [ -n "${{ github.event.inputs.report_url }}" ]; then
            ARGS="$ARGS --report-url '${{ github.event.inputs.report_url }}'"
          fi

          if [ -n "${{ github.event.inputs.report_text }}" ]; then
            ARGS="$ARGS --report-text '${{ github.event.inputs.report_text }}'"
          fi

          if [ -n "${{ github.event.inputs.impact_score }}" ]; then
            ARGS="$ARGS --score ${{ github.event.inputs.impact_score }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          eval python screener.py $ARGS

      - name: state.json をコミット
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/subport/short_report/state.json \
                  src/subport/short_report/trades.csv || true
          git diff --staged --quiet || git commit -m "chore: update position state [skip ci]"
          git push
