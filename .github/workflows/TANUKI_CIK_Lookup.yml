name: TANUKI CIK Lookup

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: '繝・ぅ繝・き繝ｼ繧ｷ繝ｳ繝懊Ν・井ｾ・ KO・・
        required: true
        type: string

jobs:
  cik-lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: kaihatsu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Lookup CIK from SEC
        id: lookup
        run: |
          python - <<'EOF'
          import os
          import csv
          import json
          import requests

          ticker = os.environ.get("TICKER", "").strip().upper()
          sec_email = os.environ.get("SEC_USER_AGENT_EMAIL", "")
          csv_path = "config/cik_lookup.csv"
          result_path = "config/cik_lookup_result.json"

          def write_result(data: dict):
              os.makedirs(os.path.dirname(result_path), exist_ok=True)
              with open(result_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

          def clean_key(k):
              """BOM繝ｻ遨ｺ逋ｽ繧帝勁蜴ｻ縺励◆繧ｭ繝ｼ繧定ｿ斐☆"""
              return k.lstrip('\ufeff').strip() if k else ''

          # 笏笏 譌｢蟄呂SV繧定ｪｭ縺ｿ霎ｼ繧・・OM蟇ｾ蠢懊・繝倥ャ繝繝ｼ菫晄戟・・笏笏
          rows = []
          existing_tickers = set()
          fieldnames = ["ticker", "cik", "name"]  # 繝輔か繝ｼ繝ｫ繝舌ャ繧ｯ

          try:
              with open(csv_path, newline='', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  raw_fn = reader.fieldnames or []

                  # BOM髯､蜴ｻ繝ｻ遨ｺ蛻鈴勁蜴ｻ縺励※fieldnames繧堤｢ｺ螳・
                  fieldnames = [clean_key(fn) for fn in raw_fn if clean_key(fn)]
                  print(f"[INFO] CSV繝倥ャ繝繝ｼ: {fieldnames}")

                  for row in reader:
                      # 繧ｭ繝ｼ縺ｮBOM繝ｻ遨ｺ逋ｽ繧帝勁蜴ｻ縺励↑縺後ｉ隱ｭ縺ｿ霎ｼ繧
                      clean_row = {clean_key(k): v for k, v in row.items() if clean_key(k)}
                      rows.append(clean_row)
                      existing_tickers.add(clean_row.get('ticker', '').upper())

              print(f"[INFO] 譌｢蟄倩｡梧焚: {len(rows)}")

          except FileNotFoundError:
              print(f"[INFO] {csv_path} 縺悟ｭ伜惠縺励↑縺・◆繧∵眠隕丈ｽ懈・縺励∪縺・)

          if ticker in existing_tickers:
              print(f"[SKIP] {ticker} 縺ｯ譌｢縺ｫcik_lookup.csv縺ｫ蟄伜惠縺励∪縺・)
              write_result({"ticker": ticker, "status": "already_exists"})
              exit(0)

          # 笏笏 SEC company_tickers.json 縺九ｉ CIK 繧貞叙蠕・笏笏
          print(f"[INFO] SEC API縺九ｉCIK繧貞叙蠕嶺ｸｭ: {ticker}")
          user_agent = f"Koichi-Shigihara2 On-a-journey {sec_email}"
          headers = {
              "User-Agent": user_agent,
              "Accept": "application/json",
              "Accept-Encoding": "gzip, deflate"
          }
          print(f"[INFO] User-Agent: Koichi-Shigihara2 On-a-journey ***")

          try:
              res = requests.get(
                  "https://www.sec.gov/files/company_tickers.json",
                  headers=headers,
                  timeout=30
              )
              if res.status_code == 403:
                  raise Exception(
                      "403 Forbidden: SEC_USER_AGENT_EMAIL Secret縺梧悴險ｭ螳壹°辟｡蜉ｹ縺ｧ縺吶・
                  )
              res.raise_for_status()
              data = res.json()
          except Exception as e:
              print(f"[ERROR] SEC API蜿門ｾ怜､ｱ謨・ {e}")
              write_result({"ticker": ticker, "status": "api_error", "error": str(e)})
              exit(1)

          cik = None
          name = None
          for entry in data.values():
              if entry.get("ticker", "").upper() == ticker:
                  cik = str(entry["cik_str"]).zfill(10)
                  name = entry.get("title", "")
                  break

          if not cik:
              print(f"[ERROR] {ticker} 縺ｮCIK縺瑚ｦ九▽縺九ｊ縺ｾ縺帙ｓ縺ｧ縺励◆")
              write_result({"ticker": ticker, "status": "not_found"})
              exit(1)

          print(f"[OK] {ticker}: CIK={cik}, Name={name}")

          # 笏笏 譁ｰ隕剰｡後ｒ霑ｽ蜉・域里蟄倥・fieldnames縺ｫ蜷医ｏ縺帙※遨ｺ蝓九ａ・・笏笏
          new_row = {fn: "" for fn in fieldnames}
          new_row["ticker"] = ticker
          new_row["cik"]    = cik
          new_row["name"]   = name
          rows.append(new_row)
          rows.sort(key=lambda r: r.get("ticker", ""))

          # 笏笏 CSV繧呈嶌縺肴綾縺呻ｼ・OM縺ｪ縺誘TF-8繝ｻ蜈・・繝・ム繝ｼ邯ｭ謖・ｼ・笏笏
          os.makedirs(os.path.dirname(csv_path), exist_ok=True)
          with open(csv_path, "w", newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(rows)

          print(f"[DONE] cik_lookup.csv 繧呈峩譁ｰ縺励∪縺励◆・亥・{len(rows)}陦鯉ｼ・)

          write_result({
              "ticker": ticker,
              "cik": cik,
              "name": name,
              "status": "ok"
          })
          EOF
        env:
          TICKER: ${{ github.event.inputs.ticker }}
          SEC_USER_AGENT_EMAIL: ${{ secrets.SEC_USER_AGENT_EMAIL }}

      - name: Commit updated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add config/cik_lookup.csv 2>/dev/null || true
          git add config/cik_lookup_result.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "[INFO] 繧ｳ繝溘ャ繝医☆繧句､画峩縺ｯ縺ゅｊ縺ｾ縺帙ｓ"
          else
            git commit -m "chore: CIK lookup for ${{ github.event.inputs.ticker }}"
            git push
            echo "[DONE] 繧ｳ繝溘ャ繝亥ｮ御ｺ・
          fi
